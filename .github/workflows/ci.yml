name: CI

# Runs on every PR and on pushes to main. Making these checks *required* in branch
# protection is what turns them from advisory into a merge gate — see the PR that adds
# this file for the one-time settings step.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run the suite
        run: uv run pytest -q

  fresh-install:
    name: installs and imports without the lockfile
    # `uv sync --frozen` above only ever proves the LOCKED versions work, and users never
    # get those: `uv tool install sys-buddy` and `pip install` resolve the newest releases
    # pyproject allows and ignore uv.lock entirely. v2.16-2.18 passed the suite above and
    # still crashed on every fresh install the day mcp 2.0 renamed McpError. So build the
    # wheel, install it the way a user would, and import the modules that actually run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Build the wheel
        run: uv build --wheel
      - name: Install it fresh, ignoring uv.lock
        run: |
          uv venv /tmp/fresh
          VIRTUAL_ENV=/tmp/fresh uv pip install dist/*.whl
      - name: Import what actually runs
        # Not sys_buddy.gui: pywebview wants a display toolkit a headless runner lacks. The
        # break this exists to catch lives in server/middleware, which ARE imported here.
        run: |
          /tmp/fresh/bin/python -c "import sys_buddy.server, sys_buddy.middleware, sys_buddy.tools; print('imports OK')"
          /tmp/fresh/bin/sys-buddy --version

  version-guard:
    name: version not hand-edited
    # Only on PRs, and skip release-please's own release PR — that one legitimately
    # bumps the version. Everyone else must leave the version to the release pipeline.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if the version was bumped by hand
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff "$base"...HEAD -- pyproject.toml | grep -qE '^\+[[:space:]]*version[[:space:]]*='; then
            echo "::error::Don't bump the version in a PR — releases are automated (see CONTRIBUTING.md §8). Remove the pyproject.toml version change; the release bot sets it."
            exit 1
          fi
          if git diff "$base"...HEAD -- src/sys_buddy/__init__.py | grep -qE '^\+.*__version__[[:space:]]*='; then
            echo "::error::Don't set __version__ by hand — it derives from the package metadata."
            exit 1
          fi
          echo "OK — no manual version edit."

  lockfile:
    name: lockfile matches the project version
    # Runs on EVERY event, release-please's own PR included — that PR is exactly where the
    # drift gets introduced, so exempting it would exempt the only case that matters.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if uv.lock disagrees with pyproject.toml
        # release-please bumps `pyproject.toml` and never touches `uv.lock`, so after each
        # release the lock names the PREVIOUS version. Harmless to the package, but it means
        # any `uv run` rewrites the file, and every contributor picks up a spurious diff on
        # top of whatever they were actually working on. Hand-relocked twice already; a
        # check is what stops a third time.
        run: python3 .github/scripts/check_lockfile.py
