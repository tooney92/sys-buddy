/* ---------- shorthand cheatsheet ---------- */
/* The short commands a human types to THEIR OWN agent (taught in the agent prompt).
   Mirrored here so a watcher has the same reference. Contract vs debug show the
   codes that apply to each mode.

   This used to be an inline `<details>` at the bottom of the task page; it now renders
   INSIDE the Commands slide-out (panelHTML below). The content is unchanged — it was
   moved, not rewritten — and in particular the role-tag row is still generated FROM
   ROLE_TAGS. Hard-coding that list is literally how `upto` went missing from the
   cheatsheet; one source, never a hand-maintained copy. */
function shortcodesHTML(d){
  var contract = !(d && d.mode==='debug');
  /* esc() is NOT optional here: `todo <title>` and `no #N <why>` contain angle brackets,
     and an unescaped `<title>` is a real element the parser then reads TEXT into — it
     silently ate every row after it (and, in the panel, the whole Broker-tools section
     below). Placeholders are copy, not markup. */
  function code(c){ return '<span style="font-family:'+MONO+';font-size:10.5px;font-weight:600;color:var(--text);border:1px solid var(--border-strong);border-radius:6px;padding:1px 6px;white-space:nowrap">'+esc(c)+'</span>'; }
  function grp(label){ return '<div style="color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:7px 0 1px">'+label+'</div>'; }
  function cmd(c, desc){ return '<div style="display:flex;gap:9px;align-items:baseline"><span style="flex:none;min-width:70px">'+code(c)+'</span><span>'+desc+'</span></div>'; }
  var rows =
    grp('Messaging')+
    cmd('wm', 'wait for the next message (blocks)')+
    cmd('ch', "check for new messages now (read + mark seen), don't block")+
    cmd('sm', 'send a message to everyone on the task')+
    cmd('sm @role', 'send it privately to just that role')+
    cmd('upto', "share an ambient \"what we're up to\" note")+
    cmd('notify', 'ping the humans on Slack — terminal events only')+
    /* Role tags: the same @role slot, addressed by tag instead of the full name. Listed
       under Messaging (not their own group) because they are an argument spelling, not a
       command — `sm @BE` IS `sm @role`. Rendered from ROLE_TAGS so this row and the
       broker's resolver can't drift apart. */
    cmd('@' + Object.keys(ROLE_TAGS)[0].toUpperCase() + ' …',
        'tag a role instead of spelling it: ' +
        Object.keys(ROLE_TAGS).map(function(t){
          return '<b>' + t.toUpperCase() + '</b> ' + ROLE_TAGS[t];
        }).join(' · '));
  if(contract){
    rows +=
      grp('Contract')+
      cmd('pc [#N]', 'propose a contract — add #N to scope it to todo N')+
      cmd('gc [#N]', 'show the contract (of todo N with #N)')+
      cmd('sign [#N]', 'sign / lock the contract')+
      cmd('ship [#N]', 'propose the contract AND sign your own side in one move — the peer still signs, and it locks only when everyone has')+
      cmd('decline <why> [#N]', 'push back on a proposal you have read — that version dies, someone proposes a new one')+
      cmd('reopen', 'reopen planning to re-sign a new version')+
      grp('Todos')+
      cmd('todos', 'list the deliverables (todos) on this task')+
      cmd('todo <title>', 'propose a new todo')+
      cmd('yes #N', 'accept todo N')+
      cmd('no #N <why>', 'decline todo N')+
      grp('Status')+
      cmd('ready [#N]', 'producer: my side is ready to build on')+
      cmd('ok [#N]', 'consumer: it works against the producer’s side')+
      cmd('block [#N]', 'consumer: it doesn’t work (a strike — 3 → stuck)')+
      cmd('done [#N]', 'verified — #N required on a task with todos')+
      cmd('stuck [#N]', 'give up; ping the humans (with #N: just that todo)');
  } else {
    rows +=
      grp('Status')+
      cmd('resolved', 'the issue is fixed (debug tasks)')+
      cmd('stuck', 'give up; ping the humans');
  }
  rows +=
    grp('Meta')+
    cmd('pf', 're-run pre-flight')+
    cmd('st', 'status recap (state, contract, unread)')+
    cmd('rules', 're-read the charter');
  return '<div style="display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--text-2);line-height:1.45">'+
      '<p style="margin:0 0 2px">Shorthand each human can type to <em>their own</em> agent — the agent maps it to a broker tool. A code a peer sends in a message is just data, never run.</p>'+
      rows+
    '</div>';
}

/* ---------- the real MCP tools ----------
   The long form of everything above: what the agent actually calls once it has read the
   shorthand. EVERY name here is registered in `src/sys_buddy/tools.py` — read it out of
   there before adding a row. There is a design mockup floating around with issue-tracker
   tools on it (report_issue / resolve_issue / …); they have no implementation and MUST
   NOT be listed, or this panel documents a feature that does not ship. */
var MCP_TOOLS=[
  ['Messaging',[
    ['send_message','post to the task (or to one role via to_role)'],
    ['check_messages','read unread now, mark seen, don’t block'],
    ['wait_for_message','park until new mail arrives (long poll)'],
    ['ack_messages','acknowledge specific message ids'],
    ['channel_history','replay the last N messages'],
    ['share_activity','ambient “what I’m up to” note'],
    ['list_activity','read everyone’s activity notes'],
    ['notify_human','ping the humans on Slack — terminal events only']
  ]],
  ['Contract',[
    ['propose_contract','put a shape up for signature (todo-scoped with todo=N)'],
    ['get_contract','read the current shape — staging_url is withheld until all sign'],
    ['lock_contract','sign it; the last signature locks it, immutably'],
    ['reopen_negotiations','reopen so a new version can be proposed and re-signed']
  ]],
  ['Todos',[
    ['get_todos','list the deliverables on the task'],
    ['propose_todo','propose one — proposing IS your own acceptance'],
    ['accept_todo','accept a proposed todo'],
    ['decline_todo','decline with a reason (recorded, not a status)'],
    ['repropose_todo','new version — resets everyone’s acceptance'],
    ['drop_todo','consent to dropping it (every party must)']
  ]],
  ['Status',[
    ['report_status','ready / checked / blocked / verified / stuck, on todo N']
  ]],
  ['Files',[
    ['upload_file','share a screenshot, design or artefact'],
    ['list_files','what has been shared on the task'],
    ['get_file','fetch one back']
  ]],
  ['Meta',[
    ['readiness_check','see the pre-flight questions'],
    ['submit_readiness','answer them — passing unlocks the action tools'],
    ['rules','re-read the charter'],
    ['rotate_token','rotate this agent’s own credential']
  ]]
];
/* A debug task has no contract and never carries todos, so those groups are dropped for
   one — same mode-awareness the shorthand rows already have, applied to the long form. */
function mcpToolsHTML(d){
  var debug = !!(d && d.mode==='debug');
  var out=MCP_TOOLS.filter(function(sec){
    /* `Status` stays: report_status is how a debug task reaches `resolved`. */
    return !(debug && (sec[0]==='Contract' || sec[0]==='Todos'));
  }).map(function(sec){
    var rows=sec[1].map(function(t){
      if(debug && t[0]==='report_status') t=[t[0],'resolved / stuck on a debug task'];
      return '<div style="display:flex;gap:9px;align-items:baseline;padding:2px 0">'+
        '<span style="flex:none;font-family:'+MONO+';font-size:10.5px;font-weight:600;color:var(--text);white-space:nowrap">'+esc(t[0])+'</span>'+
        '<span style="color:var(--text-3)">·</span>'+
        '<span style="min-width:0">'+esc(t[1])+'</span></div>';
    }).join('');
    return '<div style="color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:9px 0 2px">'+esc(sec[0])+'</div>'+rows;
  }).join('');
  return '<div style="font-size:12px;color:var(--text-2);line-height:1.45">'+
    '<p style="margin:0 0 2px">The broker tools the shorthand maps to. Your agent calls these; you never type them.</p>'+
    out+'</div>';
}

/* ---------- the two reference panels ----------
   Both are slide-outs off the header, and both are REFERENCE ONLY. There is no input,
   no button that calls anything, and nothing here executes — DECISIONS D11: "the
   dashboard surfaces state and tells the human what to type — it never acts". The
   Commands panel is a cheatsheet of what you say to YOUR OWN agent; it is not a console.

   They are state-driven (state.panel) and ride the normal render/bind/sig loop, so the
   SSE stream keeps flowing and repainting underneath. Focus is NOT trapped — Tab still
   walks the page — and Esc or the ✕ dismisses. */
var DOC_TODO_FLOW='https://github.com/tooney92/sys-buddy/blob/main/docs/todo-flow.md';
/* The desktop header's own height: 11px padding + its tallest child (a 34px button) +
   11px + the 1px bottom border. The panel starts here rather than at 0 so it docks UNDER
   the header instead of burying the very buttons that opened it. */
var HEADER_H=57;

function panelSection(title, body, note){
  return '<section style="margin:0 0 20px">'+
    '<h3 style="margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)">'+esc(title)+'</h3>'+
    (note?'<p style="margin:0 0 9px;font-size:12px;color:var(--text-2);line-height:1.55">'+note+'</p>':'')+
    body+'</section>';
}
/* a mono chip in the same spelling nextStepHTML and the cheatsheet use, so all three
   read as "this is the literal thing a human types" */
function shChip(c){
  return '<code style="font-family:'+MONO+';font-size:10.5px;font-weight:600;color:var(--text);background:var(--surface-2);border:1px solid var(--border-strong);border-radius:6px;padding:1px 6px;white-space:nowrap">'+esc(c)+'</code>';
}
function flowRow(step, who, what){
  return '<div style="display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid var(--border)">'+
    '<span style="flex:none;min-width:74px">'+shChip(step)+'</span>'+
    '<span style="flex:none;min-width:88px;font-size:11px;font-weight:600;color:var(--text)">'+esc(who)+'</span>'+
    '<span style="min-width:0;font-size:11.5px;color:var(--text-2);line-height:1.5">'+what+'</span></div>';
}

/* Every rule below is a SUMMARY of docs/todo-flow.md, deliberately not a second copy of
   it — two statements of the same rules drift, and the doc is the one that gets updated
   alongside todos.py/state.py. Anything needing detail links out instead. */
function workflowsPanelBody(){
  var fields='<div style="display:flex;flex-direction:column;gap:8px">'+
    '<div style="padding:9px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px">'+
      '<div style="font-size:11.5px;font-weight:700;color:var(--text)">'+shChip('status')+' — the agreement</div>'+
      '<div style="margin-top:5px;font-size:11.5px;color:var(--text-2);line-height:1.5">“How much have we agreed?” pending → accepted → contracted → verified / dropped. Derived on every read, shown as the <strong>status chip</strong>.</div></div>'+
    '<div style="padding:9px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px">'+
      '<div style="font-size:11.5px;font-weight:700;color:var(--text)">'+shChip('state')+' — the march</div>'+
      '<div style="margin-top:5px;font-size:11.5px;color:var(--text-2);line-height:1.5">“How far has it been built?” Shown as the <strong>mini-stepper</strong>, whose four labels fold six march values: planning · building · ready · verified. <strong>“building” means the contract is locked</strong>, not that anything is being built yet.</div></div>'+
    '<div style="padding:9px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px">'+
      '<div style="font-size:11.5px;font-weight:700;color:var(--text)">'+shChip('stuck')+' — a flag, not a state</div>'+
      '<div style="margin-top:5px;font-size:11.5px;color:var(--text-2);line-height:1.5">A stuck deliverable stays exactly where it was on the march so it can’t brick the other five. It just carries a ⚠.</div></div>'+
  '</div>';

  var walk=
    flowRow('todo <title>','any party','propose a deliverable. Proposing <em>is</em> your own acceptance, and you must name yourself a party.')+
    flowRow('yes #N','every other','accept it. Status turns <em>accepted</em> once all have. '+shChip('no #N <why>')+' records a reason and hands it back.')+
    flowRow('pc #N','any party','propose the contract — and <strong>whoever proposes becomes the producer</strong> for that todo. Only after it is accepted.')+
    flowRow('sign #N','every party','sign it. The last signature locks it, immutably, and releases the '+shChip('staging_url')+'.')+
    flowRow('ready #N','producer only','“my side is live, build against it.”')+
    flowRow('ok #N','consumers only','“it works.” '+shChip('block #N')+' instead is a <strong>strike</strong> — three and the broker pulls the cord on that one deliverable.')+
    flowRow('done #N','any party','verified. The task concludes when the <strong>last</strong> todo verifies.');

  var traps='<div style="display:flex;flex-direction:column;gap:8px">'+
    '<div style="padding:9px 11px;background:var(--st-testing-bg);border:1px solid var(--st-testing-dot);border-radius:10px;font-size:11.5px;color:var(--text);line-height:1.55">'+
      '<strong>1 · '+shChip('sign')+' before anything is proposed does nothing.</strong> A signature needs a proposal to attach to. If you typed '+shChip('sign #N')+' and nothing moved, nobody has run '+shChip('pc #N')+' yet. An agent told to sign with nothing proposed should propose it under a stated assumption and sign, not come back asking — its peer still reviews and signs before anything locks. '+shChip('ship #N')+' does both in one move.</div>'+
    '<div style="padding:9px 11px;background:var(--st-testing-bg);border:1px solid var(--st-testing-dot);border-radius:10px;font-size:11.5px;color:var(--text);line-height:1.55">'+
      '<strong>2 · Nothing auto-advances.</strong> No timer, no daemon. Every arrow above is a person deciding and the broker allowing it. A todo parked at <em>building</em> forever isn’t a hung process — the producer just hasn’t typed '+shChip('ready #N')+'. The <strong>Next</strong> line on the todo card names who owes the move.</div>'+
  '</div>';

  var gates='<div style="font-size:11.5px;color:var(--text-2);line-height:1.6">'+
    'Refused unless: you are a <strong>named party</strong> on the todo · '+shChip('pc #N')+' needs it <em>accepted</em> · '+
    shChip('ready #N')+' needs you to be the <strong>producer</strong> with a locked contract · '+shChip('ok #N')+' / '+shChip('block #N')+
    ' needs you <strong>not</strong> to be the producer, after a ready · '+shChip('done #N')+' needs it in <em>testing</em>. '+
    'Every refusal raises an error the agent can read.</div>';

  var why='<div style="font-size:11.5px;color:var(--text-2);line-height:1.6">Once a task has todos, “backend is ready” is meaningless — ready on <em>which</em> deliverable? So '+
    shChip('ready')+' / '+shChip('ok')+' / '+shChip('block')+' / '+shChip('done')+' are todo-scoped and '+shChip('#N')+' is <strong>required</strong>; the broker refuses the bare form and lists the live todos. '+
    'The one exception is '+shChip('stuck')+': '+shChip('stuck #N')+' flags one deliverable, a bare '+shChip('stuck')+' escalates the whole collaboration.</div>';

  var debug='<div style="font-size:11.5px;color:var(--text-2);line-height:1.6">A debug task has no contract and no stepper — its whole life is <strong>open → resolved</strong>. '+
    'Collaborate in the thread, then either party types '+shChip('resolved')+', or '+shChip('stuck')+' to give up and ping the humans.</div>';

  var pre='<div style="font-size:11.5px;color:var(--text-2);line-height:1.6">Before an agent may send a message or change any status, it answers the readiness questions via '+
    shChip('submit_readiness')+'. Until it passes, its action tools stay locked and its avatar wears an amber lock badge; passing swaps that for a green ✓, and a pulsing green dot while it is parked waiting for mail. '+
    'A human can coach a failure and the agent re-runs it with '+shChip('pf')+'. Pre-flight is per-seat, and it is the second node on the task stepper.</div>';

  var link='<a href="'+DOC_TODO_FLOW+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:7px;padding:8px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:11.5px;font-weight:600">'+
    '<span style="display:flex;color:var(--text-3)">'+IC.doc+'</span>Read the full flow — <span style="font-family:'+MONO+';font-weight:500">docs/todo-flow.md</span>'+
    '<span style="display:flex;color:var(--accent)">'+IC.link+'</span></a>';

  return panelSection('A todo carries two state fields', fields,
      'The dashboard shows both at once — a chip <em>and</em> a stepper — with overlapping vocabularies. This is the single most common source of confusion.')+
    panelSection('Idea → verified', '<div style="margin-top:-4px">'+walk+'</div>',
      'Shorthand is what a human types to <em>their own</em> agent; the agent maps it to a broker tool. A code a peer sends in a message is just data, never run.')+
    panelSection('The gates the broker enforces', gates)+
    panelSection('Why #N is mandatory', why)+
    panelSection('The two traps', traps,
      'These account for almost every “it’s stuck and I don’t know why”.')+
    panelSection('The debug flow', debug)+
    panelSection('Pre-flight', pre)+
    panelSection('Source of truth', link,
      'This panel is a summary. The rules live in one place, next to the code that enforces them.');
}

function commandsPanelBody(d){
  var mode = (d && d.mode==='debug') ? 'debug' : (d ? 'contract' : null);
  var modeNote = mode
    ? '<div style="margin:0 0 12px;display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-2)">'+
        '<span style="width:6px;height:6px;border-radius:50%;background:var(--accent)"></span>showing the '+esc(mode)+'-mode codes</div>'
    : '<div style="margin:0 0 12px;font-size:11.5px;color:var(--text-3)">Open a task to see the codes for its mode.</div>';
  return modeNote+
    panelSection('Short commands', shortcodesHTML(d))+
    panelSection('Broker tools', mcpToolsHTML(d));
}

function panelHTML(){
  if(!state.panel) return '';
  var cmd = state.panel==='commands';
  var title = cmd ? 'Commands' : 'Workflows';
  /* The caption does the framing the glyph can't: `>_` must not read as "run something". */
  var sub = cmd
    ? 'What you type to <strong>your own</strong> agent. Reference only — this dashboard reads, it never acts.'
    : 'How work moves through sys-buddy. The broker enforces; nothing here advances on its own.';

/* ---------- shared files & screenshots (read-only, D11) ----------
   The API adds a `files` array to GET /api/task/{id} (screenshots + designs + other
   attachments the agents uploaded via a tool / the desktop app). This dashboard NEVER
   writes — there is no upload control here, only surfacing. EVERY branch below is
   guarded on `d.files`/length, so a task with no files (or an older API that omits the
   key entirely) renders EXACTLY as it did before — the same precedent as todos above.

   Each file's bytes are served (GET only) at a same-origin relative URL `/api/file/{id}`;
   the `sb_view` HttpOnly cookie rides along automatically on the <img>/<a> request, so
   there is no token in the URL to leak (JS can't read the cookie anyway — same auth model
   as every other /api/* call). The server sets Content-Disposition inline for images and
   attachment for everything else, so a plain <a> downloads non-images on its own. */
function fileURL(id){ return '/api/file/'+encodeURIComponent(id); }
/* screenshots = anything the browser can render inline: an image content-type, or the
   broker's explicit `screenshot` kind (covers a screenshot whose type didn't survive). */
function isImageFile(f){ return (f.content_type && String(f.content_type).indexOf('image/')===0) || f.kind==='screenshot'; }
function humanSize(n){
  n=+n; if(!isFinite(n)||n<0) return '';
  if(n<1024) return n+' B';
  var u=['KB','MB','GB','TB'], i=-1;
  do{ n/=1024; i++; }while(n>=1024 && i<u.length-1);
  return (n>=10?Math.round(n):Math.round(n*10)/10)+' '+u[i];
}
function fileKindChip(kind){
  return '<span style="font-family:'+MONO+';font-size:9.5px;font-weight:600;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;flex:none">'+esc(kind||'other')+'</span>';
}
/* uploader avatar + label, shared by both sections */
function fileUploader(f){
  var a=av(f.role);
  return '<span title="'+esc(a.label)+'" style="display:inline-flex;align-items:center;gap:5px;min-width:0">'+
    '<span style="width:15px;height:15px;border-radius:4px;background:'+a.c+';color:#fff;font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+'</span>'+
    '<span style="font-size:10.5px;color:var(--text-2);font-weight:500">'+esc(a.label)+'</span></span>';
}
var IC_DOWNLOAD='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 11l5 5 5-5M5 21h14"/></svg>';

/* Screenshots — inline thumbnails, click to enlarge (lightboxHTML below). */
function screenshotsCardHTML(imgs){
  if(!imgs.length) return '';
  var thumbs=imgs.map(function(f){
    return '<button data-lightbox="'+esc(f.id)+'" title="'+esc(f.name||'')+' — click to enlarge" style="display:flex;flex-direction:column;gap:6px;padding:0;border:none;background:transparent;cursor:pointer;font-family:inherit;width:104px;flex:none">'+
      '<span style="width:104px;height:78px;border-radius:9px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center">'+
        '<img src="'+esc(fileURL(f.id))+'" alt="'+esc(f.name||'')+'" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block"></span>'+
      '<span style="font-size:10.5px;font-weight:500;color:var(--text);max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left">'+esc(f.name||'')+'</span>'+
      '<span style="display:flex;align-items:center;gap:6px">'+fileUploader(f)+'<span style="font-size:10px;color:var(--text-3);font-family:'+MONO+'">'+esc(f.time||'')+'</span></span>'+
    '</button>';
  }).join('');
  return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-top:16px">'+
    '<div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px">'+
      '<span style="font-weight:600;font-size:14px;color:var(--text)">Screenshots</span>'+
      '<span style="font-size:12px;color:var(--text-2)">'+imgs.length+'</span></div>'+
    '<div style="padding:16px;display:flex;flex-wrap:wrap;gap:14px">'+thumbs+'</div></div>';
}

/* Files — everything else, each a download link. */
function filesCardHTML(others){
  if(!others.length) return '';
  var rows=others.map(function(f){
    var size=humanSize(f.size);
    return '<a href="'+esc(fileURL(f.id))+'" title="Download '+esc(f.name||'')+'" style="display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--border);text-decoration:none;color:var(--text)">'+
      '<span style="display:flex;color:var(--text-3);flex:none">'+IC.doc+'</span>'+
      '<span style="flex:1;min-width:0">'+
        '<span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:12.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px">'+esc(f.name||'')+'</span>'+fileKindChip(f.kind)+'</span>'+
        '<span style="display:flex;align-items:center;gap:10px;margin-top:5px;flex-wrap:wrap">'+fileUploader(f)+
          (size?'<span style="font-size:10.5px;color:var(--text-3);font-family:'+MONO+'">'+esc(size)+'</span>':'')+
          '<span style="font-size:10.5px;color:var(--text-3);font-family:'+MONO+'">'+esc(f.time||'')+'</span></span>'+
      '</span>'+
      '<span style="display:flex;color:var(--text-3);flex:none">'+IC_DOWNLOAD+'</span></a>';
  }).join('');
  return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-top:16px">'+
    '<div style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px">'+
      '<span style="font-weight:600;font-size:14px;color:var(--text)">Files</span>'+
      '<span style="font-size:12px;color:var(--text-2)">'+others.length+'</span></div>'+
    rows+'</div>';
}

/* Both sections, split by type. '' when the task has no files → identical to before. */
function attachmentsHTML(d){
  var files=(d&&d.files)||[];
  if(!files.length) return '';
  var imgs=[], others=[];
  files.forEach(function(f){ (isImageFile(f)?imgs:others).push(f); });
  return screenshotsCardHTML(imgs)+filesCardHTML(others);
}

/* Full-screen enlarge for a screenshot. State-driven (state.lightbox = the file id) so it

function lightboxHTML(){
  if(state.lightbox==null) return '';
  var d=state.detail; if(!d) return '';

    '<img src="'+esc(fileURL(f.id))+'" alt="'+esc(f.name||'')+'" style="max-width:min(1100px,92vw);max-height:78vh;object-fit:contain;border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.5);background:var(--surface)">'+
    '<div style="display:flex;align-items:center;gap:10px;color:#fff;font-size:13px;flex-wrap:wrap;justify-content:center">'+
      '<span style="width:20px;height:20px;border-radius:6px;background:'+a.c+';color:#fff;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center">'+esc(a.i)+'</span>'+
      '<span style="font-weight:600">'+esc(f.name||'')+'</span>'+
      '<span style="opacity:.8;font-family:'+MONO+'">'+esc(a.label)+' · '+esc(f.time||'')+'</span>'+
      '<a href="'+esc(fileURL(f.id))+'" target="_blank" rel="noopener" style="color:#fff;text-decoration:underline;opacity:.85">open original</a></div>'+
    '<button data-lb-close="1" title="Close (Esc)" style="position:fixed;top:20px;right:24px;width:38px;height:38px;border-radius:10px;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>'+
  '</div>';
}

/* ---------- activity strip ---------- */
/* Ambient activity notes: a bounded, scrollable strip of role-colored chat bubbles.
   Full-width, sits directly UNDER the stepper (above the thread/contract grid) in BOTH the
   contract and debug task views. The API hands `activity` back oldest-first, so we reverse
   for a NEWEST-FIRST display. Read-only (D11) — notes are posted via the agent tool, never
   here, so there is no compose box. Renders NOTHING when the task has no activity (guarded
   on length), so a task with no notes looks EXACTLY as before. `activity` rides inside
   state.detail, which sig() already serializes — no new state to register. */
function activityStripHTML(d){
  var acts=(d&&d.activity)||[];
  if(!acts.length) return '';
  var rows=acts.slice().reverse().map(function(a){
    var av0=av(a.role);
    return '<div style="display:flex;align-items:flex-start;gap:9px;padding:8px 11px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border)">'+
      '<span title="'+esc(av0.label)+'" style="width:20px;height:20px;border-radius:6px;background:'+av0.c+';color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px">'+esc(av0.i)+'</span>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="display:flex;align-items:baseline;gap:8px">'+
          '<span style="font-size:11.5px;font-weight:600;color:'+av0.c+'">'+esc(av0.label)+'</span>'+
          '<span style="font-size:10px;color:var(--text-3);font-family:'+MONO+';margin-left:auto;flex:none">'+esc(a.time||'')+'</span></div>'+
        '<div style="font-size:12.5px;color:var(--text-2);line-height:1.45;margin-top:2px;word-break:break-word">'+esc(a.text||'')+'</div>'+
      '</div></div>';
  }).join('');
  return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px">'+
    '<div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px">'+
      '<span style="font-weight:600;font-size:14px;color:var(--text)">Activity</span>'+
      '<span style="font-size:12px;color:var(--text-2)">'+acts.length+'</span></div>'+
    '<div style="padding:12px 16px;display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto">'+rows+'</div></div>';
}

/* ---------- task view ---------- */
function taskHTML(){
  if(!state.detail){
    return '<div style="max-width:1200px;margin:0 auto;padding:20px 20px 80px">'+
      '<button data-home="1" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;background:var(--surface);border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:13px;color:var(--text-2)">'+IC.back+'Tasks</button>'+
      '<div style="text-align:center;padding:80px 20px;color:var(--text-2);font-size:14px">Loading task…</div></div>';
  }
  var d=state.detail;
  if(d.mode==='debug') return debugTaskHTML(d);
  var m=state.isMobile;
  var chip=stateChip(d.state);
  /* The stepper TRUNCATES when this task has todos — same component, three nodes. A task
     with no todos (and a task whose todos were all dropped, where has_todos is false)
     keeps today's full seven-node stepper, unchanged. */
  var todos=hasTodos(d);
  var steps=todos ? genStepsTodo(d) : genSteps(d.state, d.times, d.agents);
  var stuck=d.state==='stuck';

  var stepsHTML=steps.map(function(s){
    // The pre-flight node shows host/buddy status pills in place of a timestamp; the
    // `todos` node shows the fan-out's progress bar and counts.
    var tail = s.key==='preflight' ? preflightPills(d)
      : s.key==='todos' ? todoProgressTail(d)
      : '<span style="margin-top:3px;font-size:10px;font-family:'+MONO+';color:var(--text-3);height:12px">'+esc(s.time)+'</span>';
    return '<div style="display:flex;flex-direction:column;align-items:center;flex:1;position:relative;padding-top:4px">'+
      '<div style="position:absolute;top:18px;left:0;width:50%;height:2px;background:'+s.leftColor+'"></div>'+
      '<div style="position:absolute;top:18px;right:0;width:50%;height:2px;background:'+s.rightColor+'"></div>'+
      '<div style="'+s.nodeStyle+'">'+s.inner+'</div>'+
      '<span style="margin-top:7px;font-size:11px;font-weight:600;text-align:center;color:'+s.labelColor+';line-height:1.3;padding:0 4px">'+esc(s.label)+'</span>'+
      tail+'</div>';
  }).join('');
  var stuckBanner = stuck ? '<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;padding:9px 13px;background:var(--st-stuck-bg);border:1px solid var(--st-stuck-dot);border-radius:11px;font-size:13px;color:var(--st-stuck-fg);font-weight:500"><span style="display:flex">'+IC.warn+'</span>3 fix cycles reached — humans notified 📣</div>' : '';

  var stepper='<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:15px 20px;margin-bottom:16px;overflow-x:auto">'+stuckBanner+'<div style="display:flex;align-items:flex-start;min-width:560px">'+stepsHTML+'</div></div>';

  var mobileTabs = m ? '<div style="display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px">'+
    '<button data-tab="thread" style="'+tabStyle(state.mobileTab==='thread')+'">Thread</button>'+
    '<button data-tab="contract" style="'+tabStyle(state.mobileTab==='contract')+'">'+(todos?'Todos':'Contract')+'</button>'+
    '<button data-tab="log" style="'+tabStyle(state.mobileTab==='log')+'">Log</button></div>' : '';

  var threadDisp = m ? (state.mobileTab==='thread'?'block':'none') : 'block';
  var contractDisp = m ? (state.mobileTab==='contract'?'block':'none') : 'block';
  var logDisp = m ? (state.mobileTab==='log'?'block':'none') : (state.eventLogOpen?'block':'none');
  var rowStyle = m ? 'display:block' : 'display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:16px;align-items:start';

  var eventBtn = m ? '' : '<button data-eventlog="1" style="display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:9px;border:1px solid '+(state.eventLogOpen?'var(--accent)':'var(--border)')+';background:'+(state.eventLogOpen?'var(--accent-soft)':'var(--surface)')+';color:'+(state.eventLogOpen?'var(--accent-2)':'var(--text-2)')+';cursor:pointer;font-size:13px;font-weight:500">'+IC.log+'Event log</button>';

  return '<div style="max-width:1200px;margin:0 auto;padding:20px 20px 80px">'+
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">'+
      '<button data-home="1" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;background:var(--surface);border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:13px;color:var(--text-2)">'+IC.back+'Tasks</button>'+
      '<h1 style="font-size:20px;font-weight:700;margin:0;color:var(--text);letter-spacing:-.02em">'+esc(d.title)+'</h1>'+
      '<span style="display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:'+chip.bg+';color:'+chip.fg+'"><span style="width:6px;height:6px;border-radius:50%;background:'+chip.dot+'"></span>'+esc(chip.label)+'</span>'+
      '<div style="flex:1"></div>'+eventBtn+'</div>'+
    stepper+activityStripHTML(d)+readinessFailPanel(d)+mobileTabs+
    '<div style="'+rowStyle+'">'+
      '<div style="display:'+threadDisp+'">'+threadHTML(d)+'</div>'+
      /* the right column becomes the TODO LIST when the task has todos; selecting one
         swaps this same slot to that todo's contract card. The shared screenshots + files
         sit under it (so on mobile they live inside the existing Contract/Todos tab — no
         new tab). attachmentsHTML('') when the task has no files, so this is unchanged. */
      '<div style="display:'+contractDisp+(m?'':';position:sticky;top:72px')+'">'+(todos?todoPanelHTML(d):contractHTML(d))+attachmentsHTML(d)+'</div>'+
    '</div>'+
    '<div style="display:'+logDisp+'">'+eventLogHTML(d)+'</div>'+
    readinessPreviewHTML(d)+
  '</div>'+lightboxHTML();
}

/* ---------- render ---------- */
function sig(){
  /* `todo_rollup` rides along so a rollup change (2/6 → 3/6) repaints the list badge. */
  var tasksLite=(state.tasks||[]).map(function(t){ return {id:t.id,title:t.title,state:t.state,roles:t.roles,strikes:t.strikes,roll:t.todo_rollup||null}; });
  return JSON.stringify({
    view:state.view, taskId:state.taskId, error:state.error, theme:state.theme, isMobile:state.isMobile,
    viewer:state.viewer, tasks:tasksLite, detail:state.detail,
    expanded:state.expanded, version:state.version, selectedTodo:state.selectedTodo,
    lightbox:state.lightbox, panel:state.panel, narrow:state.narrow,
    eventFilter:state.eventFilter,
    eventLogOpen:state.eventLogOpen, mobileTab:state.mobileTab, switcherOpen:state.switcherOpen,
    loading:state.detail?0:state.loadingDetail
  });
}
function render(){
  document.documentElement.setAttribute('data-theme', state.theme);
  var s=sig();
  if(s!==lastSig){
    lastSig=s;
    var html;
    if(state.isMobile) html=mobileGate();
    else if(state.error==='no-token') html=messageScreen('<span style="font-size:22px">🔑</span>','No viewer token','This dashboard needs a viewer token. Open the link your host shared — it looks like /ui?v=sbv_… — to watch this task.');
    else if(state.error==='unauthorized') html=messageScreen('<span style="font-size:22px">🚫</span>','Access denied','This viewer token isn’t valid or has been revoked. Ask your host for a fresh dashboard link.');
    else if(state.error==='forbidden') html=headerHTML()+messageBody('Not your task','This token can only view its own task. '+ (state.viewer&&state.viewer.task_id?('You have access to “'+state.viewer.task_id+'”.'):''));
    else if(state.error==='not-found') html=headerHTML()+messageBody('Task not found','That task doesn’t exist (or was closed).');
    else html=headerHTML()+(state.view==='task'?taskHTML():listHTML());
    /* the reference slide-out overlays whatever is underneath — including the error
       screens, whose header carries the same two buttons. Never on the mobile gate,
       which has no header at all. */
    if(!state.isMobile) html+=panelHTML();
    app.innerHTML=html;
    bind();
  }
  patchVolatile();
}
function messageBody(title,body){
  return '<div style="max-width:520px;margin:12vh auto 0;padding:40px 24px;text-align:center">'+
    '<h1 style="font-size:19px;font-weight:700;margin:0 0 8px;color:var(--text)">'+esc(title)+'</h1>'+
    '<p style="font-size:14px;color:var(--text-2);margin:0 0 18px;line-height:1.55">'+esc(body)+'</p>'+
    '<button data-home="1" style="padding:8px 14px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);cursor:pointer;font-size:13px">Back to tasks</button></div>';
}

/* volatile bits updated every poll without a full re-render (avoids replaying confetti) */
function patchVolatile(){
  var rt=document.getElementById('sb-refresh-text'); if(rt) rt.textContent=refreshText();
  var dot=document.getElementById('sb-refresh-dot');
  if(dot) dot.style.background = state.error ? 'var(--st-stuck-dot)' : 'var(--st-verified-dot)';
  (state.tasks||[]).forEach(function(t){
    var el=document.querySelector('[data-last="'+cssEsc(t.id)+'"]');
    if(el) el.textContent=t.last||'';
  });
}
function cssEsc(s){ return String(s).replace(/["\\]/g,'\\$&'); }

/* ---------- event binding (delegation) ---------- */
function bind(){
  app.querySelectorAll('[data-open]').forEach(function(el){ el.onclick=function(){ openTask(el.getAttribute('data-open')); }; });
  app.querySelectorAll('[data-home]').forEach(function(el){ el.onclick=function(){ goHome(); }; });
  var sw=app.querySelector('[data-switcher]'); if(sw) sw.onclick=function(e){ e.stopPropagation(); state.switcherOpen=!state.switcherOpen; render(); };
  var tt=app.querySelector('[data-theme-toggle]'); if(tt) tt.onclick=toggleTheme;
  var nt=app.querySelector('[data-newtask]'); if(nt) nt.onclick=function(){ try{ window.pywebview.api.new_task(); }catch(e){} };
  /* data-vkey names the contract chain (task id, or '<task>#<todo>'); absent = the task's */
  app.querySelectorAll('[data-version]').forEach(function(el){ el.onclick=function(){ state.version[el.getAttribute('data-vkey')||state.taskId]=el.getAttribute('data-version'); render(); }; });
  /* select a todo — from a panel row OR from a ⟨todo⟩ chip in the thread */
  app.querySelectorAll('[data-todo]').forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); state.selectedTodo[state.taskId]=parseInt(el.getAttribute('data-todo'),10); state.mobileTab='contract'; render(); }; });
  var tback=app.querySelector('[data-todoback]'); if(tback) tback.onclick=function(){ delete state.selectedTodo[state.taskId]; render(); };
  /* screenshot lightbox: a thumbnail opens it; the backdrop (click outside the image) and
     the ✕ close it. Escape also closes — see the document keydown handler below. */
  app.querySelectorAll('[data-lightbox]').forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); state.lightbox=el.getAttribute('data-lightbox'); render(); }; });
  var lbb=app.querySelector('[data-lb-backdrop]'); if(lbb) lbb.onclick=function(e){ if(e.target===lbb){ state.lightbox=null; render(); } };
  /* reference panels: the header buttons TOGGLE (clicking the open one closes it, and
     clicking the other swaps straight across); the backdrop and ✕ dismiss. */
  app.querySelectorAll('[data-panel]').forEach(function(el){ el.onclick=function(){
    /* deliberately NOT stopping propagation: the document-level handler still gets to
       close an open task switcher, so the two never sit on screen together. */
    var k=el.getAttribute('data-panel');
    state.panel = (state.panel===k) ? null : k;
    render();
  }; });
  app.querySelectorAll('[data-panel-close]').forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); state.panel=null; render(); }; });
  var pbd=app.querySelector('[data-panel-backdrop]'); if(pbd) pbd.onclick=function(){ state.panel=null; render(); };
  app.querySelectorAll('[data-lb-close]').forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); state.lightbox=null; render(); }; });
  app.querySelectorAll('[data-ep]').forEach(function(el){ el.onclick=function(){ var k=el.getAttribute('data-ep'); state.expanded[k]=!state.expanded[k]; render(); }; });
  app.querySelectorAll('[data-filter]').forEach(function(el){ el.onclick=function(){ state.eventFilter=el.getAttribute('data-filter'); render(); }; });
  app.querySelectorAll('[data-tab]').forEach(function(el){ el.onclick=function(){ state.mobileTab=el.getAttribute('data-tab'); render(); }; });
  var elg=app.querySelector('[data-eventlog]'); if(elg) elg.onclick=function(){ state.eventLogOpen=!state.eventLogOpen; render(); };
  app.querySelectorAll('.sb-row').forEach(function(el){
    el.onmouseenter=function(){ el.style.borderColor='var(--border-strong)'; el.style.boxShadow='var(--shadow)'; };
    el.onmouseleave=function(){ el.style.borderColor='var(--border)'; el.style.boxShadow='none'; };
  });
}
/* Esc closes the screenshot lightbox, then the reference panel — innermost first, so a
   lightbox opened over a panel doesn't take the panel down with it. */
document.addEventListener('keydown', function(e){
  if(e.key!=='Escape') return;
  if(state.lightbox!=null){ state.lightbox=null; render(); }
  else if(state.panel){ state.panel=null; render(); }
});
/* close switcher on outside click */
document.addEventListener('click', function(e){
  if(state.switcherOpen && !e.target.closest('[data-switcher]') && !e.target.closest('[data-open]')){
    state.switcherOpen=false; render();
  }
});
window.addEventListener('resize', function(){
  var mob=window.innerWidth<900, nar=window.innerWidth<1150;
  if(mob!==state.isMobile || nar!==state.narrow){ state.isMobile=mob; state.narrow=nar; render(); }
});

/* ---------- boot + live stream (SSE) ---------- */
/* Replaces the old 3s poll: the broker pushes change notifications over
   GET /api/stream (see SSE contract v1). We refetch via the existing helpers
   when told — we never reload the page, and tokens stay opaque to the client. */
var es=null;                     // active EventSource, or null while paused
var idleTimer=null;
var IDLE_MS=15*60*1000;          // ~15 min of no activity -> pause
var liveBanner=null;

/* one round of "get me current state" using the existing fetch helpers */
function catchUp(){
  fetchTasks();
  if(state.view==='task' && state.taskId) fetchDetail(state.taskId);
}

function ensureBanner(){
  if(liveBanner) return liveBanner;
  var b=document.createElement('div');
  b.id='sb-live-banner';
  b.setAttribute('role','button');
  b.setAttribute('title','Resume live updates');
  b.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;'+
    'display:none;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;cursor:pointer;'+
    'font-family:inherit;font-size:13px;font-weight:500;color:var(--text-2);'+
    'background:var(--surface);border:1px solid var(--border-strong);box-shadow:var(--shadow)';
  b.innerHTML='<span style="width:8px;height:8px;border-radius:50%;background:var(--st-open-dot);display:inline-block"></span>'+
    '<span>Live updates paused — click to resume</span>';
  b.onclick=function(){ resumeStream(); };
  document.body.appendChild(b);
  liveBanner=b;
  return b;
}
function showBanner(){ ensureBanner().style.display='flex'; }
function hideBanner(){ if(liveBanner) liveBanner.style.display='none'; }

/* open (or re-open) the stream. Always starts with a catch-up fetch so a
   resume is never stale, then relies on EventSource auto-reconnect for blips. */
function openStream(){
  catchUp();
  if(es) return;                 // already streaming
  try{
    es=new EventSource('/api/stream');
    es.addEventListener('tasks', function(){ fetchTasks(); });
    es.addEventListener('task', function(e){
      try{ var d=JSON.parse(e.data); if(d && d.id===state.taskId) fetchDetail(d.id); }catch(err){}
    });
    /* onerror: EventSource reconnects itself on server-side drops (ngrok/proxy
       idle timeouts). We only force a true pause via pauseStream() below. */
  }catch(err){ es=null; }
}
/* client-side close = no auto-reconnect = a genuine pause */
function pauseStream(){
  if(es){ es.close(); es=null; }
  showBanner();
}
function resumeStream(){
  hideBanner();
  openStream();
  armIdle();
}

/* ---- inactivity gate: pause after IDLE_MS of no user activity ---- */
function armIdle(){
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer=setTimeout(function(){ pauseStream(); }, IDLE_MS);
}
function onActivity(){
  armIdle();
  if(!es) resumeStream();         // any activity wakes a paused stream
}
['mousemove','keydown','scroll','click','touchstart'].forEach(function(ev){
  window.addEventListener(ev, onActivity, {passive:true});
});

/* ---- visibility gate: pause when hidden, resume (+catch-up) when shown ---- */
document.addEventListener('visibilitychange', function(){
  if(document.hidden) pauseStream();
  else resumeStream();
});

render();
openStream();  // begins with a catch-up fetch; cookie carries auth, a bad token surfaces as 401
armIdle();
setInterval(patchVolatile, 1000); // keep "refreshed Ns ago" ticking (local only)
})();
</script>
