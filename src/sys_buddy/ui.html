/* ---------- render ---------- */
function sig(){
  /* `todo_rollup` rides along so a rollup change (2/6 → 3/6) repaints the list badge. */
  var tasksLite=(state.tasks||[]).map(function(t){ return {id:t.id,title:t.title,state:t.state,roles:t.roles,strikes:t.strikes,roll:t.todo_rollup||null}; });
  return JSON.stringify({
    view:state.view, taskId:state.taskId, error:state.error, theme:state.theme, isMobile:state.isMobile,
    viewer:state.viewer, tasks:tasksLite, detail:state.detail,
    expanded:state.expanded, version:state.version, todoModal:state.todoModal,
    lightbox:state.lightbox, panel:state.panel, narrow:state.narrow, wf:state.wf,
    eventFilter:state.eventFilter,
    eventLogOpen:state.eventLogOpen, mobileTab:state.mobileTab, switcherOpen:state.switcherOpen,
    loading:state.detail?0:state.loadingDetail
  });
}
function render(){
  document.documentElement.setAttribute('data-theme', state.theme);
  var s=sig();
  if(s!==lastSig){
    lastSig=s;
    var html;
    if(state.isMobile) html=mobileGate();
    else if(state.error==='no-token') html=messageScreen('<span style="font-size:22px">🔑</span>','No viewer token','This dashboard needs a viewer token. Open the link your host shared — it looks like /ui?v=sbv_… — to watch this task.');
    /* The wording no longer claims to know WHICH of the two happened, because it cannot:
       a token that does not resolve is indistinguishable from one that was revoked. It
       says what to do instead, and the stale-cookie case — by far the commonest, and the
       one that used to be unrecoverable — is now handled for the reader rather than
       described at them. */
    else if(state.error==='unauthorized') html=messageScreen('<span style="font-size:22px">🚫</span>','Access denied','This viewer token isn’t valid any more. It has been cleared, so “Try again” will use the link you opened; if that still fails, ask your host for a fresh dashboard link.', true);
    else if(state.error==='forbidden') html=headerHTML()+messageBody('Not your task','This token can only view its own task. '+ (state.viewer&&state.viewer.task_id?('You have access to “'+state.viewer.task_id+'”.'):''));
    else if(state.error==='not-found') html=headerHTML()+messageBody('Task not found','That task doesn’t exist (or was closed).');
    else html=headerHTML()+(state.view==='task'?taskHTML():listHTML());
    /* the reference slide-out overlays whatever is underneath — including the error
       screens, whose header carries the same two buttons. Never on the mobile gate,
       which has no header at all. */
    if(!state.isMobile) html+=panelHTML();
    /* Captured BEFORE innerHTML is replaced, restored after — see THREAD_ID. */
    var prevThread=threadScroll();
    app.innerHTML=html;
    bind();
    restoreThreadScroll(prevThread);
  }
  patchVolatile();
}

/* ---------- thread scroll ----------
   The newest message is at the BOTTOM of the thread, because a conversation reads top-down
   and reversing it would mean reading replies before the things they reply to. That only
   works if the newest one is actually reachable, and it was not: the box is 640px tall and
   `render()` replaces `app.innerHTML` wholesale whenever `sig()` changes — and a new message
   IS a sig change. So the arrival of a message scrolled the reader away from the message
   that had just arrived, back to the top of the thread.

   Pinned to the bottom instead, UNLESS the reader has deliberately scrolled up to read
   history — their position is theirs to keep, and yanking someone out of what they are
   reading because a peer said something is the same defect pointing the other way.

   The event log needs none of this: it is newest-first, so its newest row is already the one
   you see. */
var THREAD_ID='sb-thread-scroll';
function threadScroll(){
  var el=document.getElementById(THREAD_ID);
  if(!el) return null;
  /* 40px of slack. "At the bottom" has to survive fractional scrollHeight and the browser's
     own rounding, or the pin quietly stops engaging for readers who are, visibly, at the
     bottom. */
  return {top:el.scrollTop, atBottom:(el.scrollHeight-el.scrollTop-el.clientHeight)<=40};
}
function restoreThreadScroll(prev){
  var el=document.getElementById(THREAD_ID);
  if(!el) return;
  /* No previous box means this is the thread's first paint — opening a task, or coming back
     to one. Open on the newest message, which is what someone checking in wants to see. */
  if(!prev || prev.atBottom) el.scrollTop=el.scrollHeight;
  else el.scrollTop=prev.top;
}
function messageBody(title,body){
  return '<div style="max-width:520px;margin:12vh auto 0;padding:40px 24px;text-align:center">'+
    '<h1 style="font-size:19px;font-weight:700;margin:0 0 8px;color:var(--text)">'+esc(title)+'</h1>'+
    '<p style="font-size:14px;color:var(--text-2);margin:0 0 18px;line-height:1.55">'+esc(body)+'</p>'+
    '<button data-home="1" style="padding:8px 14px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);cursor:pointer;font-size:13px">Back to tasks</button></div>';
}

/* volatile bits updated every poll without a full re-render (avoids replaying confetti) */
function patchVolatile(){
  var rt=document.getElementById('sb-refresh-text'); if(rt) rt.textContent=refreshText();
  var dot=document.getElementById('sb-refresh-dot');
  if(dot) dot.style.background = state.error ? 'var(--st-stuck-dot)' : 'var(--st-verified-dot)';
  (state.tasks||[]).forEach(function(t){
    var el=document.querySelector('[data-last="'+cssEsc(t.id)+'"]');
    if(el) el.textContent=t.last||'';
  });
}
function cssEsc(s){ return String(s).replace(/["\\]/g,'\\$&'); }

/* ---------- event binding (delegation) ---------- */
function bind(){
  app.querySelectorAll('[data-open]').forEach(function(el){ el.onclick=function(){ openTask(el.getAttribute('data-open')); }; });
  app.querySelectorAll('[data-home]').forEach(function(el){ el.onclick=function(){ goHome(); }; });
  /* A real reload, not a re-render: the point is to re-run the whole load with the dead
     cookie now cleared, including the `?v=` still in the window's original URL if there
     was one. `location.reload()` keeps that URL, which is exactly what we want. */
  app.querySelectorAll('[data-reload]').forEach(function(el){ el.onclick=function(){ location.reload(); }; });
  var sw=app.querySelector('[data-switcher]'); if(sw) sw.onclick=function(e){ e.stopPropagation(); state.switcherOpen=!state.switcherOpen; render(); };
  var tt=app.querySelector('[data-theme-toggle]'); if(tt) tt.onclick=toggleTheme;
  var nt=app.querySelector('[data-newtask]'); if(nt) nt.onclick=function(){ try{ window.pywebview.api.new_task(); }catch(e){} };
  /* data-vkey names the contract chain (task id, or '<task>#<todo>'); absent = the task's */
  app.querySelectorAll('[data-version]').forEach(function(el){ el.onclick=function(){ state.version[el.getAttribute('data-vkey')||state.taskId]=el.getAttribute('data-version'); render(); }; });
  /* open a todo in the modal — from a panel row OR from a ⟨todo⟩ chip in the thread.
     No `state.mobileTab='contract'` any more: that existed to bring the swapped-in detail
     into view on a phone, and the todo now opens over everything regardless of which tab
     is showing (and the phone gate means this only ever runs on a desktop anyway). */
  app.querySelectorAll('[data-todo]').forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); state.todoModal=parseInt(el.getAttribute('data-todo'),10); render(); }; });
  /* the todo modal closes on the backdrop (click OUTSIDE the dialog — the e.target test is
     what keeps a click inside it from closing) and on the ✕. Escape too, below. */
  var tmb=app.querySelector('[data-tm-backdrop]'); if(tmb) tmb.onclick=function(e){ if(e.target===tmb){ state.todoModal=null; render(); } };
  app.querySelectorAll('[data-tm-close]').forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); state.todoModal=null; render(); }; });
  /* screenshot lightbox: a thumbnail opens it; the backdrop (click outside the image) and
     the ✕ close it. Escape also closes — see the document keydown handler below. */
  app.querySelectorAll('[data-lightbox]').forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); state.lightbox=el.getAttribute('data-lightbox'); render(); }; });
  var lbb=app.querySelector('[data-lb-backdrop]'); if(lbb) lbb.onclick=function(e){ if(e.target===lbb){ state.lightbox=null; render(); } };
  /* reference panels: the header buttons TOGGLE (clicking the open one closes it, and
     clicking the other swaps straight across); the backdrop and ✕ dismiss. */
  app.querySelectorAll('[data-panel]').forEach(function(el){ el.onclick=function(){
    /* deliberately NOT stopping propagation: the document-level handler still gets to
       close an open task switcher, so the two never sit on screen together. */
    var k=el.getAttribute('data-panel');
    state.panel = (state.panel===k) ? null : k;
    render();
  }; });
  app.querySelectorAll('[data-panel-close]').forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); state.panel=null; render(); }; });
  var pbd=app.querySelector('[data-panel-backdrop]'); if(pbd) pbd.onclick=function(){ state.panel=null; render(); };
  /* Workflows panel disclosure. Sections and nested entries toggle independently — an
     accordion that shut its siblings would hide the thing you were comparing against. */
  app.querySelectorAll('[data-wf-sec]').forEach(function(el){ el.onclick=function(){
    var k=el.getAttribute('data-wf-sec'), d=state.detail;
    state.wf.sec[k]=!wfIsOpen(k,(d&&d.mode==='debug')?'debug':'contract'); render();
  }; });
  app.querySelectorAll('[data-wf-sub]').forEach(function(el){ el.onclick=function(){
    var k=el.getAttribute('data-wf-sub'); state.wf.sub[k]=!state.wf.sub[k]; render();
  }; });
  app.querySelectorAll('[data-wf-cast]').forEach(function(el){ el.onclick=function(){
    state.wf.cast=el.getAttribute('data-wf-cast'); render();
  }; });
  app.querySelectorAll('[data-lb-close]').forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); state.lightbox=null; render(); }; });
  app.querySelectorAll('[data-ep]').forEach(function(el){ el.onclick=function(){ var k=el.getAttribute('data-ep'); state.expanded[k]=!state.expanded[k]; render(); }; });
  app.querySelectorAll('[data-filter]').forEach(function(el){ el.onclick=function(){ state.eventFilter=el.getAttribute('data-filter'); render(); }; });
  app.querySelectorAll('[data-tab]').forEach(function(el){ el.onclick=function(){ state.mobileTab=el.getAttribute('data-tab'); render(); }; });
  var elg=app.querySelector('[data-eventlog]'); if(elg) elg.onclick=function(){ state.eventLogOpen=!state.eventLogOpen; render(); };
  app.querySelectorAll('.sb-row').forEach(function(el){
    el.onmouseenter=function(){ el.style.borderColor='var(--border-strong)'; el.style.boxShadow='var(--shadow)'; };
    el.onmouseleave=function(){ el.style.borderColor='var(--border)'; el.style.boxShadow='none'; };
  });
}
/* Esc closes the screenshot lightbox, then the todo modal, then the reference panel —
   innermost first, so a lightbox opened over the modal doesn't take the modal down with
   it, and closing the modal doesn't also dismiss the panel behind it. One press, one
   layer. */
document.addEventListener('keydown', function(e){
  if(e.key!=='Escape') return;
  if(state.lightbox!=null){ state.lightbox=null; render(); }
  else if(state.todoModal!=null){ state.todoModal=null; render(); }
  else if(state.panel){ state.panel=null; render(); }
});
/* close switcher on outside click */
document.addEventListener('click', function(e){
  if(state.switcherOpen && !e.target.closest('[data-switcher]') && !e.target.closest('[data-open]')){
    state.switcherOpen=false; render();
  }
});
window.addEventListener('resize', function(){
  var mob=window.innerWidth<900, nar=window.innerWidth<1150;
  if(mob!==state.isMobile || nar!==state.narrow){ state.isMobile=mob; state.narrow=nar; render(); }
});

/* ---------- boot + live stream (SSE) ---------- */
/* Replaces the old 3s poll: the broker pushes change notifications over
   GET /api/stream (see SSE contract v1). We refetch via the existing helpers
   when told — we never reload the page, and tokens stay opaque to the client.

   THE STREAM IS AN OPTIMISATION, NOT THE SOURCE OF FRESHNESS. It used to be the only
   thing that refreshed this page, and that made a silent stream indistinguishable from
   a quiet task: watched through a Cloudflare quick tunnel, new messages simply never
   appeared and the header counted honestly but uselessly up to "Last refreshed 4m ago"
   while the viewer reloaded by hand. (Measured: a quick tunnel forwarded ZERO bytes of
   an open event-stream for 45s while keepalives and real change events sat on the wire.
   It buffers on the order of 128 KB before flushing, and it drops the
   `X-Accel-Buffering: no` we send on the floor.) So there are three layers now, and the
   page is honest about which one it is running on:
     1. the stream, when it works — sub-second,
     2. a WATCHDOG that times the stream's own pings and reopens a dead one,
     3. a slow POLL the VIEWER turns on, so freshness never DEPENDS on layer 1 at all.

   Layer 3 is opt-in, and that is a deliberate reversal of the first attempt. Polling is
   not free to the person watching: it is two requests every 15s through THEIR tunnel,
   ~480/hour, and a free ngrok allowance is measured in tens of thousands of requests. We
   were about to spend somebody's quota on their behalf because we had decided it was
   worth it. It is their tunnel.

   So the page detects the failure, SAYS SO, and offers the switch — the control only
   exists once there is a reason for it, which is what keeps this from being the hidden
   footer checkbox we deleted elsewhere in this release. The answer is remembered per
   broker, because a modal on every reload is its own kind of broken. */
var es=null;                     // active EventSource, or null while paused/closed
var idleTimer=null;
var IDLE_MS=15*60*1000;          // ~15 min of no activity -> pause
var POLL_MS=15*1000;             // fallback refresh when the stream is useless
var DEAD_MS=45*1000;             // silence this long = the stream is gone, whatever it says
var liveBanner=null;
var lastFrame=0;                 // when the last stream frame of ANY kind arrived
var streamErrors=0;              // consecutive es.onerror callbacks
var paused=false;                // true ONLY on a deliberate pause (idle / hidden tab)
var degraded=false;              // the stream is failing; the header switch is showing
/* The viewer's answer to "shall I poll?", remembered per broker origin — the transport is
   a property of the broker, so the answer is too. Three states, and `null` matters: it is
   "never asked", which is what makes the modal appear exactly once. */
var POLL_KEY='sysbuddy.pollWhenDegraded:'+location.origin;
var pollOptIn=null;
try{
  var _saved=localStorage.getItem(POLL_KEY);
  if(_saved==='1') pollOptIn=true; else if(_saved==='0') pollOptIn=false;
}catch(e){}
function setPollOptIn(v){
  pollOptIn=v;
  try{ localStorage.setItem(POLL_KEY, v?'1':'0'); }catch(e){}
  if(v) catchUp();               // acting on "yes" immediately is the point of saying yes
  renderStreamSwitch();
}

/* one round of "get me current state" using the existing fetch helpers */
function catchUp(){
  fetchTasks();
  if(state.view==='task' && state.taskId) fetchDetail(state.taskId);
}

function ensureBanner(){
  if(liveBanner) return liveBanner;
  var b=document.createElement('div');
  b.id='sb-live-banner';
  b.setAttribute('role','button');
  b.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;'+
    'display:none;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;cursor:pointer;'+
    'font-family:inherit;font-size:13px;font-weight:500;color:var(--text-2);'+
    'background:var(--surface);border:1px solid var(--border-strong);box-shadow:var(--shadow)';
  b.innerHTML='<span id="sb-live-dot" style="width:8px;height:8px;border-radius:50%;background:var(--st-open-dot);display:inline-block"></span>'+
    '<span id="sb-live-text">Live updates paused — click to resume</span>';
  b.onclick=function(){ resumeStream(); };   // a click retries, in either mode
  document.body.appendChild(b);
  liveBanner=b;
  return b;
}
/* One banner, two DIFFERENT admissions — and the second one is the whole point.
   'paused' is a choice the viewer made (or their tab going hidden). 'degraded' is the
   stream failing underneath them, which this page used to render as perfect health. */
function showBanner(kind){
  var b=ensureBanner();
  var dot=b.querySelector('#sb-live-dot'), txt=b.querySelector('#sb-live-text');
  if(kind==='degraded'){
    /* Kept for the retry affordance, but it no longer claims to be refreshing — that is the
       header switch's business now, and only if the viewer said yes. */
    dot.style.background='var(--st-stuck-dot)';
    txt.textContent='Live updates unavailable — click to retry';
    b.setAttribute('title','Click to retry the live connection');
  }else{
    dot.style.background='var(--st-open-dot)';
    txt.textContent='Live updates paused — click to resume';
    b.setAttribute('title','Resume live updates');
  }
  b.style.display='flex';
}
function hideBanner(){ if(liveBanner) liveBanner.style.display='none'; }

/* ---- the header switch: visible ONLY while the stream is failing ---- */
/* It lives in the header beside "Last refreshed" because that is where a viewer already
   looks to ask "is this current?" — the honest place for the answer. It does not exist at
   all on a healthy stream, so there is nothing to find, ignore, or wonder about. */
function ensureStreamSwitch(){
  var el=document.getElementById('sb-stream-switch');
  if(el) return el;
  var host=document.getElementById('sb-refresh-dot');
  if(!host || !host.parentNode) return null;
  el=document.createElement('button');
  el.id='sb-stream-switch';
  el.type='button';
  el.style.cssText='display:none;align-items:center;gap:6px;margin-left:4px;padding:3px 9px;'+
    'border-radius:999px;border:1px solid var(--st-stuck-dot);background:var(--st-stuck-bg);'+
    'color:var(--st-stuck-fg);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;'+
    'white-space:nowrap;flex:none';
  host.parentNode.appendChild(el);
  return el;
}
function renderStreamSwitch(){
  var el=ensureStreamSwitch();
  if(!el) return;
  if(!degraded){ el.style.display='none'; return; }
  var on=pollOptIn===true;
  el.textContent = on
    ? 'Refreshing every '+Math.round(POLL_MS/1000)+'s'
    : 'Not updating live';
  el.title = on
    ? 'The live connection is not working. Click to stop refreshing and save requests.'
    : 'The live connection is not working, so this page is NOT updating. Click to refresh every '
      + Math.round(POLL_MS/1000) + 's.';
  el.onclick=function(){
    if(pollOptIn===true) setPollOptIn(false);
    else if(pollOptIn===false) setPollOptIn(true);
    else showPollModal();      // never asked → ask properly
  };
  el.style.display='inline-flex';
}

/* ---- the one-time explanation ---- */
/* A viewer whose stream just died has no way of knowing WHY, and the why is almost always
   their transport rather than anything on this page. Naming the likely culprit and the
   transports that do work turns a dead end into a decision — and it is the difference
   between "this app is broken" and "my tunnel buffers". */
function showPollModal(){
  if(document.getElementById('sb-poll-modal')) return;
  var back=document.createElement('div');
  back.id='sb-poll-modal';
  back.style.cssText='position:fixed;inset:0;z-index:9996;background:rgba(20,15,10,.74);'+
    'display:flex;align-items:center;justify-content:center;padding:24px';
  back.innerHTML=
    '<div role="dialog" aria-modal="true" aria-label="Live updates unavailable" '+
      'style="background:var(--surface);border:1px solid var(--border);border-radius:16px;'+
      'box-shadow:var(--shadow);max-width:520px;padding:22px 24px">'+
      '<h2 style="font-size:16px;font-weight:700;margin:0 0 10px;color:var(--text)">Live updates aren’t getting through</h2>'+
      '<p style="font-size:13.5px;line-height:1.6;color:var(--text-2);margin:0 0 10px">'+
        'This page holds an open connection to the broker for instant updates, and nothing '+
        'is arriving on it. The page is <strong>not refreshing itself</strong> right now.</p>'+
      '<p style="font-size:13.5px;line-height:1.6;color:var(--text-2);margin:0 0 10px">'+
        'The usual cause is the tunnel in between. <strong>Free Cloudflare quick tunnels '+
        '(<span style="font-family:'+MONO+'">trycloudflare.com</span>) buffer this kind of '+
        'connection and never release it</strong> — so if that is how you are connected, '+
        'this is why. A <strong>named Cloudflare tunnel</strong>, <strong>ngrok</strong> or '+
        '<strong>Tailscale</strong> carries live updates instantly.</p>'+
      '<p style="font-size:13.5px;line-height:1.6;color:var(--text-2);margin:0 0 16px">'+
        'Until then this page can re-check every '+Math.round(POLL_MS/1000)+' seconds instead. '+
        'That is <strong>your</strong> tunnel’s allowance it spends — roughly 480 requests an '+
        'hour — so it is your call, and you can change it any time from the header.</p>'+
      '<div style="display:flex;gap:9px;justify-content:flex-end">'+
        '<button data-poll-no="1" style="padding:8px 14px;border:1px solid var(--border);'+
          'border-radius:9px;background:var(--surface);color:var(--text-2);cursor:pointer;'+
          'font-family:inherit;font-size:13px">Not now</button>'+
        '<button data-poll-yes="1" style="padding:8px 14px;border:1px solid var(--accent);'+
          'border-radius:9px;background:var(--accent-soft);color:var(--accent-2);cursor:pointer;'+
          'font-family:inherit;font-size:13px;font-weight:600">Refresh every '+
          Math.round(POLL_MS/1000)+'s</button>'+
      '</div></div>';
  function close(){ if(back.parentNode) back.parentNode.removeChild(back); }
  back.querySelector('[data-poll-yes]').onclick=function(){ setPollOptIn(true); close(); };
  back.querySelector('[data-poll-no]').onclick=function(){ setPollOptIn(false); close(); };
  /* Backdrop click = "Not now", but NOT remembered: a stray click outside must not silently
     answer a question about spending somebody's quota. The switch stays in the header. */
  back.onclick=function(e){ if(e.target===back){ close(); renderStreamSwitch(); } };
  document.body.appendChild(back);
}

function markDegraded(){
  if(degraded) return;
  degraded=true;
  renderStreamSwitch();
  /* Ask once, ever, per broker. After that the header switch is the whole interface. */
  if(pollOptIn===null) showPollModal();
}
/* Any DATA frame at all — a ping counts — is proof the stream is delivering. Only
   frames clear the degraded state, and that distinction is the whole trick: see the
   `onopen` handler below for why "connected" is not evidence of anything. */
function noteFrame(){
  lastFrame=Date.now();
  streamErrors=0;
  if(degraded){
    degraded=false; hideBanner(); renderStreamSwitch();
    /* RECOVERY IS A REFETCH, not just a cleared flag. While the stream was down anything
       could have changed, and a viewer who declined polling has had no fetch at all — so
       without this the page keeps whatever it was showing AND keeps reading "connection
       issue" in the header, because only a successful fetch clears that. Observed exactly
       that: the switch correctly disappeared while the header still cried outage. */
    catchUp();
  }
}

/* open (or re-open) the stream. Always starts with a catch-up fetch so a
   resume is never stale. */
function openStream(){
  paused=false;
  catchUp();
  if(es) return;                 // already streaming
  lastFrame=Date.now();          // give the new stream a full DEAD_MS to say hello
  try{
    es=new EventSource('/api/stream');
    /* `onopen` is NOT liveness, and must never call noteFrame(). Measured against a
       real trycloudflare.com tunnel: onopen fired at 214ms and then not one data
       frame arrived in the following 30s, with readyState sitting on OPEN the whole
       time. The tunnel forwards the response HEAD promptly and then buffers the body
       indefinitely — so "the stream opened" is precisely the reassurance that made
       this bug invisible. All a successful connect proves is that the endpoint is
       reachable, which is worth resetting the error count for and nothing else. */
    es.onopen=function(){ streamErrors=0; };
    /* A keepalive is a NAMED `ping` event now, not an invisible `: ping` comment —
       SSE comments never reach JavaScript, so before this there was no way to observe
       that an idle stream was still alive. This handler is the watchdog's heartbeat. */
    es.addEventListener('ping', function(){ noteFrame(); });
    es.addEventListener('tasks', function(){ noteFrame(); fetchTasks(); });
    es.addEventListener('task', function(e){
      noteFrame();
      try{ var d=JSON.parse(e.data); if(d && d.id===state.taskId) fetchDetail(d.id); }catch(err){}
    });
    /* EventSource's built-in auto-reconnect only covers a socket that visibly BREAKS.
       It never fires for the failure that actually bit us — a proxy holding the
       response open and silent forever — which is why the watchdog below exists as
       well. Here we only count: two consecutive errors is a real problem worth
       admitting to the viewer, one is a blip EventSource will retry through. */
    es.onerror=function(){
      streamErrors++;
      if(streamErrors>=2) markDegraded();
    };
  }catch(err){ es=null; markDegraded(); }
}
/* client-side close = no auto-reconnect = a genuine pause */
function pauseStream(){
  paused=true;
  degraded=false;                // a pause is a choice, not a failure
  if(es){ es.close(); es=null; }
  showBanner('paused');
}
function resumeStream(){
  hideBanner();
  openStream();
  armIdle();
  /* A retry is a hope, not a fix. If the stream was degraded, KEEP saying so until a
     real frame proves otherwise — only noteFrame() clears it. Clearing it here would
     buy the viewer another DEAD_MS of false calm every time they clicked the banner
     (or moved the mouse), which is the deception in miniature. */
  if(degraded) showBanner('degraded');
}
function restartStream(){
  if(es){ try{ es.close(); }catch(e){} es=null; }
  openStream();                   // which begins with catchUp(), so data is current
}

/* ---- watchdog: a stream lies by staying SILENT, so we time it ----
   The broker pings every ~10s. 45s of total silence therefore means the stream is
   gone no matter what `es.readyState` claims — a buffering proxy leaves it reading
   OPEN forever. Reopening runs catchUp(), so a failed reconnect still leaves the page
   current. Runs on its own 5s tick rather than off a frame, because the failure we
   are hunting produces no frames to hang a timer off. */
function watchdog(){
  if(paused || document.hidden) return;   // a deliberate pause is not a failure
  if(!es || Date.now()-lastFrame >= DEAD_MS){ markDegraded(); restartStream(); }
}
/* ---- fallback poll: freshness must never DEPEND on the stream ----
   Slow enough to be free on a laptop, fast enough that a demo over a buffering tunnel
   still reads as live. Respects the same two gates as the stream — a deliberate pause
   and a hidden tab — so a paused dashboard genuinely stays paused. */
function fallbackPoll(){
  if(paused || document.hidden) return;
  /* Only when the viewer asked for it, and only while the stream is actually failing. On a
     healthy stream this costs nothing at all — which is the other half of the reversal: the
     first attempt polled every 15s even when the stream was delivering perfectly, spending
     ~480 requests an hour of somebody's tunnel to duplicate work already being done. */
  if(!degraded || pollOptIn!==true) return;
  catchUp();
}

/* ---- inactivity gate: pause after IDLE_MS of no user activity ---- */
function armIdle(){
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer=setTimeout(function(){ pauseStream(); }, IDLE_MS);
}
function onActivity(){
  armIdle();
  if(!es) resumeStream();         // any activity wakes a paused stream
}
['mousemove','keydown','scroll','click','touchstart'].forEach(function(ev){
  window.addEventListener(ev, onActivity, {passive:true});
});

/* ---- visibility gate: pause when hidden, resume (+catch-up) when shown ---- */
document.addEventListener('visibilitychange', function(){
  if(document.hidden) pauseStream();
  else resumeStream();
});

render();
openStream();  // begins with a catch-up fetch; cookie carries auth, a bad token surfaces as 401
armIdle();
setInterval(patchVolatile, 1000);   // keep "refreshed Ns ago" ticking (local only)
setInterval(watchdog, 5000);        // notice a stream that has gone quiet on us
setInterval(fallbackPoll, POLL_MS); // and stay fresh even when it has
})();
</script>
</body>
</html>
