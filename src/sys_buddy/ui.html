<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sys-buddy</title>
<!-- sys-buddy dashboard — single-file vanilla rebuild of the design prototype (SPEC §12).
     Served at /ui. Auth rides an HttpOnly sb_view cookie (set by /ui from the ?v=
     bootstrap link); fetches the read-only /api/* and receives live change
     notifications over an SSE stream (GET /api/stream). No framework, no build step. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#FAF9F7;--surface:#ffffff;--surface-2:#F5F3F0;--surface-3:#EDEAE5;
  --border:#EBE8E3;--border-strong:#DAD5CE;
  --text:#211F1C;--text-2:#6B6763;--text-3:#9C978F;
  --accent:#E0693F;--accent-2:#C4552E;--accent-soft:#FBEADF;
  --shadow:0 1px 2px rgba(40,30,20,.04),0 6px 16px rgba(40,30,20,.05);
  --st-open-bg:#EFEDEA;--st-open-fg:#6B6763;--st-open-dot:#A29D96;
  --st-proposed-bg:#E7F0FB;--st-proposed-fg:#2E6BC4;--st-proposed-dot:#3B82F6;
  --st-locked-bg:#EEE9FB;--st-locked-fg:#6D4BC4;--st-locked-dot:#8B5CF6;
  --st-live-bg:#DEF2EE;--st-live-fg:#1C8577;--st-live-dot:#14A08C;
  --st-testing-bg:#FBF0DA;--st-testing-fg:#A9720F;--st-testing-dot:#E0A22B;
  --st-verified-bg:#E1F2E3;--st-verified-fg:#2C8A3D;--st-verified-dot:#33A852;
  --st-stuck-bg:#FBE7E3;--st-stuck-fg:#BF4638;--st-stuck-dot:#DE5B4A;
  --role-backend:#5468C9;--role-frontend:#C0568C;--role-mobile:#3F9E8C;--role-designer:#B8823C;--role-system:#8A857F;
}
[data-theme="dark"]{
  --bg:#161514;--surface:#201E1D;--surface-2:#282624;--surface-3:#312E2B;
  --border:#332F2C;--border-strong:#443F3A;
  --text:#F3F1EE;--text-2:#A7A29C;--text-3:#726D68;
  --accent:#F0845C;--accent-2:#F59A77;--accent-soft:#38271F;
  --shadow:0 1px 2px rgba(0,0,0,.24),0 6px 18px rgba(0,0,0,.30);
  --st-open-bg:#2A2826;--st-open-fg:#A7A29C;--st-open-dot:#726D68;
  --st-proposed-bg:#1B2838;--st-proposed-fg:#82B2F0;--st-proposed-dot:#4B90ED;
  --st-locked-bg:#251F36;--st-locked-fg:#B79EF2;--st-locked-dot:#9B72F0;
  --st-live-bg:#152C28;--st-live-fg:#6BCCBE;--st-live-dot:#2FB3A0;
  --st-testing-bg:#2F2712;--st-testing-fg:#E6B95F;--st-testing-dot:#D9A032;
  --st-verified-bg:#182C1C;--st-verified-fg:#74CB82;--st-verified-dot:#3FB457;
  --st-stuck-bg:#301C19;--st-stuck-fg:#F08876;--st-stuck-dot:#DA6152;
  --role-backend:#7E8FE0;--role-frontend:#DB7CAC;--role-mobile:#5FBDAA;--role-designer:#D6A05E;--role-system:#9A948D;
}
body{min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'Geist',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-2)}
button{font-family:inherit}
@keyframes cfall{0%{transform:translateY(-4px) rotate(0);opacity:0}12%{opacity:1}100%{transform:translateY(30px) rotate(240deg);opacity:0}}
@keyframes pulsedot{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
@keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.1);opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ---------- design maps (ported from the prototype Component) ---------- */
/* `confirmed` deliberately REUSES the `verified` palette rather than owning one. A new
   key means six new CSS declarations across both themes, and a dark-theme triple that
   goes missing renders a genuinely blank chip — stateChip writes its var() with no
   fallback, so an undefined bg/fg/dot resolves to nothing at all. Green already means
   "this is finished"; the two ends of an engagement differ by their word, not colour. */
var SK={open:'open',contract_proposed:'proposed',contract_locked:'locked',backend_live:'live',testing:'testing',verified:'verified',confirmed:'verified',stuck:'stuck'};
/* The chip's LABEL. `contract_locked` reads just 'locked', matching SK above and the
   `locked` node in STEPS/TODO_STEPS — it used to say 'contract locked' here alone, so the
   same state was named two different things on one screen depending on which widget drew
   it. There is only one kind of contract now, so the qualifier bought nothing. */
/* `confirmed ✓` carries the tick for the same reason `resolved ✓` does (debugChip): it
   is the LAST word on the task, and the bare adjective reads as one more stage in a list
   of stages. `verified` means the builders are done; `confirmed` means the owner agrees
   he got what he asked for — the end of the engagement, and the moment you invoice. */
var SLAB={open:'open',contract_proposed:'planning',contract_locked:'locked',backend_live:'backend live',testing:'testing',verified:'verified',confirmed:'confirmed ✓',stuck:'stuck'};
var ORDER={open:0,contract_proposed:1,contract_locked:2,backend_live:3,testing:4,verified:5,confirmed:6};
/* Nothing is left to happen on a task in one of these — so it is NOT "in flight", and
   the stepper stops pulsing. Keyed as an object, not an array, because every read is a
   membership test. Mirrors `state.TERMINAL_STATES`. */
var TERMINAL={verified:1,confirmed:1,stuck:1,resolved:1};
// `broker` is not an agent seat — it's the broker's own voice, used for the
// notifications it authors (e.g. contract_locked). Neutral system colour so it never
// reads as one of the peers talking.
var RL={backend:{i:'B',c:'var(--role-backend)',label:'backend'},frontend:{i:'F',c:'var(--role-frontend)',label:'frontend'},mobile:{i:'M',c:'var(--role-mobile)',label:'mobile'},designer:{i:'D',c:'var(--role-designer)',label:'designer'},broker:{i:'SB',c:'var(--role-system)',label:'sys-buddy'}};
/* Short tags a human types instead of spelling a role out ("sm @BE ..."). Mirrors
   ROLE_TAGS in service.py — the broker is what actually resolves them; this copy exists
   so the shortcodes cheatsheet renders the list rather than hard-coding it and drifting,
   which is exactly how `upto` went missing from the cheatsheet in the first place. */
var ROLE_TAGS={be:'backend',fe:'frontend',mb:'mobile',de:'designer'};
// The 'preflight' node has no matching task state — it's a sub-phase of 'open',
// driven by per-agent readiness (see genSteps). ORDER above stays keyed on the REAL
// task states; genSteps maps real→display indices around the inserted node.
// The LAST node, `confirmed`, exists only in engagement mode — a contract/debug task can
// never reach it, and a node nothing can ever light is worse than no node. genSteps drops
// it for a peer task (STEPS.slice), so those steppers are the seven they always were.
var STEPS=[['open','open'],['preflight','pre-flight assessments'],['contract_proposed','planning'],['contract_locked','locked'],['backend_live','backend live'],['testing','testing'],['verified','verified'],['confirmed','confirmed']];
/* ---------- todos (v2) ----------
   When a task has todos the stepper TRUNCATES, it does not die: `open` and `pre-flight
   assessments` stay task-level (you pair once, at the task), and the five later phases
   fan OUT into each todo. Same component, same visual language, three nodes.
   EVERY todo branch below is dead for a task with no todos — the API omits the
   `has_todos`/`todos`/`todo_rollup` keys entirely, so a pre-todo payload renders on
   exactly the code paths that shipped before. */
var STEPS_TODO=[['open','open'],['preflight','pre-flight assessments'],['todos','todos']];
/* The mini-stepper INSIDE a todo — the six march values folded to the five nodes below
   (`open` and `contract_proposed` share `planning`), so nobody learns a second idiom; it
   is the familiar widget one level down. No count of these is written down in prose
   anywhere: the Workflows panel COUNTS TODO_STEPS/TODO_MARCH instead, because both this
   comment and that sentence undercounted for as long as it took someone to notice
   `testing` had been added as a node of its own.

   `testing` used to share the `ready` node, which hid the step that confuses people most:
   `verified` transitions from `testing` ONLY (state._report_verified), so a consumer must
   report a check before anyone can verify. With the two collapsed, the stepper stopped
   moving when the producer said ready and gave no sign whether anyone had actually
   checked — the exact question a human asks at that moment. Its own node makes `ok #N`
   visibly advance something, and makes "has anyone tested this?" answerable at a glance.

   The labels name what is HAPPENING, not the event that just fired. Locking is an
   instant, not a phase — so `contract_locked` lights `building`, because that is what
   the humans are doing for the whole time the todo sits there. The old labels were a
   step behind reality: `locked` sat current while people built, and `build` only lit
   up once the producer was already live, i.e. once building was over. `ready` matches
   the shorthand the producer actually types (`ready #N`). */
var TODO_STEPS=[['planning','planning'],['building','building'],['ready','ready'],['testing','testing'],['verified','verified']];
var TODO_MARCH={open:0,contract_proposed:0,contract_locked:1,backend_live:2,testing:3,verified:4};
/* The AGREEMENT stage (todo.status) — NOT the march above. `pending` borrows the amber
   `testing` palette on purpose: it is the one row on this screen asking a human for
   something, so it reads as a request, and it is the row that carries the ⚠. */
var TODO_STATUS={pending:'testing',accepted:'proposed',contracted:'locked',verified:'verified',resolved:'verified',dropped:'open'};
var MAX_STRIKES=3;
var MONO="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace";

/* ---------- the shorthand vocabulary: ONE source of truth ----------
   Every short command a human types to THEIR OWN agent, written down once. BOTH
   reference panels render from this array — the Commands cheatsheet (shortcodesHTML)
   and the Workflows walkthrough (workflowsPanelBody, via SH()) — because they used to
   be two hand-typed copies and had already drifted on notation. Same discipline as
   ROLE_TAGS above, and the same reason: a hand-maintained second copy is how `upto`
   went missing from the cheatsheet.

   Fields:
     id     lookup key for SH(); never rendered.
     code   the LITERAL a human types. This is the string both panels print — prose must
            never hand-type a command again, it asks for SH('id'). ESCAPED on render, so
            angle brackets are safe here (`todo <title>`).
     desc   the sentence beside it. Interpolated as RAW HTML — `cmd()` cannot esc() it
            because the role-tags row builds <b> into its own desc. So any literal angle
            bracket MUST be written &lt;like-this&gt; or the browser eats it as a tag:
            `/files/<task-id>` silently rendered as `/files/` until it was caught in a
            screenshot. Escaped for the same reason in MCP_TOOLS below.
     tools  the broker tool(s) the agent calls. [] means no broker TOOL is called —
            either the agent composes the answer locally (`st`) or it shells out to an
            HTTP route (`upload`, `getfile`, which move bytes precisely so they never
            enter a context). Every name here is registered in tools.py, and a test pins
            that; naming the base64 fallbacks would advertise the expensive path as the
            normal one.
     group  the cheatsheet heading it sits under. Order in this array IS render order,
            and the heading is emitted whenever it changes, so grouping needs no second
            structure. "Todo Contract" is one heading naming one concept — there is no
            other kind of contract to distinguish it from, and the same words head the
            long-form tool list (MCP_TOOLS) so the two panels read as one vocabulary.
     debugGroup  optional: the heading this row sits under on a DEBUG task, where the
            rows are ISSUES rather than todos. Only for the rows both modes share
            (`yes #N`, `no #N`) — one command, one notation, two places a reader looks.
     modes  the task modes that show it: 'contract', 'debug', or both. A debug task has
            no CONTRACT — but it does carry numbered work: its rows are ISSUES, a todo
            with the contract half removed, so the `#N` vocabulary applies there too.
     scope  how the todo number attaches — the notation rule, as DATA:
              'required' — `#N` is mandatory. Every task is delivered by one or more
                           todos (issues, on a debug task) and there is no task-wide
                           form, so this is the norm: a single-deliverable task simply
                           has one todo.
              'optional' — `stuck` ONLY, the single exception in the whole vocabulary:
                           `stuck #N` flags one deliverable and the others keep
                           marching, a bare `stuck` escalates the whole task.
              'none'     — not todo-scoped at all. `resolved` is one: it is about the
                           whole debug session, and it is refused once that session
                           carries issues.
   `stuck` also carries `bare` and `scoped` spellings, because prose has to name both
   halves of its exception: SH('stuck','bare') / SH('stuck','scoped').
   The role-tag row carries gen:'roleTags' — its code and description are BUILT from
   ROLE_TAGS at render time, so the tag list cannot drift from the broker's resolver.

   Kept strict-JSON on purpose (double quotes, no comments inside the literal) so a test
   can parse it straight out of this file and hold the agent prompt to the same words. */
var SHORTCODES=[
  {"id":"wm","code":"wm","tools":["wait_for_message"],"group":"Messaging","modes":["contract","debug"],"scope":"none","desc":"wait for the next message (blocks)"},
  {"id":"ch","code":"ch","tools":["check_messages"],"group":"Messaging","modes":["contract","debug"],"scope":"none","desc":"check for new messages now (read + mark seen), don't block"},
  {"id":"sm","code":"sm","tools":["send_message"],"group":"Messaging","modes":["contract","debug"],"scope":"none","desc":"send a message to everyone on the task"},
  {"id":"sm-role","code":"sm @role","tools":["send_message"],"group":"Messaging","modes":["contract","debug"],"scope":"none","desc":"send it privately to just that role"},
  {"id":"upto","code":"upto","tools":["share_activity"],"group":"Messaging","modes":["contract","debug"],"scope":"none","desc":"share an ambient \"what we're up to\" note"},
  {"id":"notify","code":"notify","tools":["notify_human"],"group":"Messaging","modes":["contract","debug"],"scope":"none","desc":"ping the humans on Slack — terminal events only"},
  {"id":"role-tag","code":"@BE …","gen":"roleTags","tools":["send_message"],"group":"Messaging","modes":["contract","debug"],"scope":"none","desc":"tag a role instead of spelling it:"},
  {"id":"pc","code":"pc #N","tools":["propose_contract"],"group":"Todo Contract","modes":["contract"],"scope":"required","desc":"propose the contract for todo N"},
  {"id":"gc","code":"gc #N","tools":["get_contract"],"group":"Todo Contract","modes":["contract"],"scope":"required","desc":"show todo N’s contract"},
  {"id":"sign","code":"sign #N","tools":["lock_contract"],"group":"Todo Contract","modes":["contract"],"scope":"required","desc":"sign / lock todo N’s contract"},
  {"id":"ship","code":"ship #N","tools":["propose_contract","lock_contract"],"group":"Todo Contract","modes":["contract"],"scope":"required","desc":"propose the contract AND sign your own side in one move — the peer still signs, and it locks only when everyone has"},
  {"id":"decline","code":"decline <why> #N","tools":["decline_contract"],"group":"Todo Contract","modes":["contract"],"scope":"required","desc":"push back on a proposal you have read — that version dies, someone proposes a new one"},
  {"id":"reopen","code":"reopen <why> #N","tools":["reopen_negotiations"],"group":"Todo Contract","modes":["contract"],"scope":"required","desc":"reopen planning to re-sign a new version"},
  {"id":"todos","code":"todos","tools":["get_todos"],"group":"Todos","modes":["contract"],"scope":"none","desc":"list the deliverables (todos) on this task"},
  {"id":"todo","code":"todo <title>","tools":["propose_todo"],"group":"Todos","modes":["contract"],"scope":"none","desc":"propose a new todo"},
  {"id":"issues","code":"issues","tools":["get_todos"],"group":"Issues","modes":["debug"],"scope":"none","desc":"list the issues on this debug session"},
  {"id":"issue","code":"issue <title>","tools":["propose_issue"],"group":"Issues","modes":["debug"],"scope":"none","desc":"raise a new issue — raising it IS your own acceptance"},
  {"id":"yes","code":"yes #N","tools":["accept_todo"],"group":"Todos","debugGroup":"Issues","modes":["contract","debug"],"scope":"required","desc":"accept todo N — on a debug session, agree issue N is real"},
  {"id":"no","code":"no #N <why>","tools":["decline_todo"],"group":"Todos","debugGroup":"Issues","modes":["contract","debug"],"scope":"required","desc":"decline todo N — on a debug session, “that is not a bug”"},
  {"id":"ready","code":"ready #N","tools":["report_status"],"group":"Status","modes":["contract"],"scope":"required","desc":"producer: my side is ready to build on"},
  {"id":"ok","code":"ok #N","tools":["report_status"],"group":"Status","modes":["contract"],"scope":"required","desc":"consumer: it works against the producer’s side"},
  {"id":"block","code":"block #N","tools":["report_status"],"group":"Status","modes":["contract"],"scope":"required","desc":"consumer: it doesn’t work (a strike — 3 → stuck)"},
  {"id":"done","code":"done #N","tools":["report_status"],"group":"Status","modes":["contract"],"scope":"required","desc":"todo N is verified end to end"},
  {"id":"fixed","code":"fixed #N","tools":["report_status"],"group":"Status","modes":["debug"],"scope":"required","desc":"YOUR side of issue N is fixed — EVERY party reports it, and the last one resolves the issue"},
  {"id":"resolved","code":"resolved","tools":["report_status"],"group":"Status","modes":["debug"],"scope":"none","desc":"closes a debug session that carries NO issues; once it has any, name one with fixed #N"},
  {"id":"stuck","code":"stuck [#N]","bare":"stuck","scoped":"stuck #N","tools":["report_status"],"group":"Status","modes":["contract","debug"],"scope":"optional","desc":"give up; ping the humans — the one command #N is optional on: with #N just that todo (or issue), bare escalates the whole task"},
  {"id":"files","code":"files","tools":["list_files"],"group":"Files","modes":["contract","debug"],"scope":"none","desc":"what has been shared on the task"},
  {"id":"upload","code":"upload <path>","tools":[],"group":"Files","modes":["contract","debug"],"scope":"none","desc":"share a file — the agent POSTs the raw bytes to /files/&lt;task-id&gt;, so nothing goes through its context"},
  {"id":"getfile","code":"getfile <id>","tools":[],"group":"Files","modes":["contract","debug"],"scope":"none","desc":"fetch one back the same cheap way"},
  {"id":"pf","code":"pf","tools":["readiness_check","submit_readiness"],"group":"Meta","modes":["contract","debug"],"scope":"none","desc":"re-run pre-flight"},
  {"id":"st","code":"st","tools":[],"group":"Meta","modes":["contract","debug"],"scope":"none","desc":"status recap (state, contract, unread)"},
  {"id":"rules","code":"rules","tools":["rules"],"group":"Meta","modes":["contract","debug"],"scope":"none","desc":"re-read the charter"}
];
var SHORTCODE_BY_ID={};
SHORTCODES.forEach(function(s){ SHORTCODE_BY_ID[s.id]=s; });
/* The literal a human types, by id. Every sentence in the panels that names a command
   goes through here, so there is exactly one place the notation can change. Falls back
   to the id rather than throwing: a typo'd lookup must not blank the whole panel. */
function SH(id,variant){
  var e=SHORTCODE_BY_ID[id];
  if(!e) return id;
  return (variant && e[variant]) || e.code;
}

function av(role){ return RL[role] || {i:(role?String(role)[0].toUpperCase():'?'),c:'var(--role-system)',label:role||'system'}; }
function stateChip(s){ var k=SK[s]||'open'; return {label:SLAB[s]||s, bg:'var(--st-'+k+'-bg)', fg:'var(--st-'+k+'-fg)', dot:'var(--st-'+k+'-dot)'}; }
function methodChip(m){ var k=({GET:'proposed',POST:'live',PUT:'locked',PATCH:'testing',DELETE:'stuck'})[m]||'open'; return {bg:'var(--st-'+k+'-bg)', fg:'var(--st-'+k+'-fg)'}; }
function typeChip(type,pass){
  var map={question:['question','open'],answer:['answer','proposed'],status_update:['status','open'],
    contract_proposal:['contract proposal','locked'],contract_lock:['contract lock','locked'],
    contract_locked:['contract locked','locked'],renegotiation:['replanning','proposed'],
    deploy_confirmed:['deploy confirmed','live'],verified:['verified','verified'],stuck:['stuck','stuck'],
    /* The two ENDINGS. Both were falling through to the default ['message','open'], so the
       one bubble in the thread that closes the whole task rendered as an anonymous grey
       "message" — `resolved` has done that since debug tasks shipped. */
    confirmed:['confirmed','verified'],resolved:['resolved','verified'],
    /* ISSUES (debug tasks): one party's "my side is fixed". It is NOT `test_result` —
       there is no test and no strike here — and it must not fall through to the grey
       default, because it is the bubble the whole issue flow turns on. The issue's
       CLOSING bubble is `resolved` above, so the two endings share one palette. */
    fixed:['fixed','proposed'],
    /* the todo conversation (v2). Additive: no pre-todo task ever carries these types. */
    todo_proposal:['todo proposed','proposed'],todo_accept:['todo accepted','verified'],
    todo_decline:['todo declined','stuck'],todo_drop:['todo drop','open'],
    todo_dropped:['todo dropped','open']};
  /* The todo chips read "issue …" on a debug task, where these rows ARE issues. Read off
     the payload already on screen (`state.detail.mode`), the same way todoChipHTML reads
     it — one message type, one palette, the word the reader's task actually uses. */
  var ISSUE_LABEL={todo_proposal:'issue raised',todo_accept:'issue accepted',
    todo_decline:'issue declined',todo_drop:'issue drop',todo_dropped:'issue dropped'};
  var label,key;
  if(type==='test_result'){ label=pass?'test · pass':'test · fail'; key=pass?'verified':'stuck'; }
  else { var e=map[type]||['message','open']; label=e[0]; key=e[1]; }
  if(isDebugTask(state.detail) && ISSUE_LABEL[type]) label=ISSUE_LABEL[type];
  return {label:label, bg:'var(--st-'+key+'-bg)', fg:'var(--st-'+key+'-fg)'};
}
/* `todo` is ONE event kind carrying the specific action inside (api._event), so this
   vocabulary stays fixed as the todo actions grow. Every other palette dot is already
   spoken for, hence accent-2 — distinct from slack's accent, and not a role colour. */
/* Every kind the broker actually writes needs a row here, or it renders in the
   fallback grey and reads as background noise. `deliverable`, `verification` and
   `guidelines` are the engagement kinds; `resolved` is a pre-existing gap — a debug
   task's terminal event was uncoloured and unfilterable. */
function eventColor(kind){ return ({transition:'var(--st-proposed-dot)',lock:'var(--st-locked-dot)',deploy:'var(--st-live-dot)',test:'var(--st-testing-dot)',slack:'var(--accent)',token:'var(--st-open-dot)',task:'var(--st-open-dot)',todo:'var(--accent-2)',deliverable:'var(--accent)',verification:'var(--st-verified-dot)',guidelines:'var(--st-locked-dot)',resolved:'var(--st-verified-dot)'})[kind]||'var(--st-open-dot)'; }

/* small inline SVGs */
function svg(w,inner){ return '<svg width="'+w+'" height="'+w+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+inner+'</svg>'; }
var IC={
  chevR:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>',
  back:svg(15,'<path d="M15 6l-6 6 6 6"/>'),
  caret:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>',
  log:svg(14,'<path d="M4 6h16M4 12h16M4 18h10"/>'),
  warn:svg(16,'<path d="M12 9v4M12 17h.01M10.3 3.9l-8 14A2 2 0 004 21h16a2 2 0 001.7-3l-8-14a2 2 0 00-3.4 0z"/>'),
  user:svg(13,'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'),
  lockSmall:'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
  doc:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>',

/* ---------- html escaping ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }

/* ---------- state ---------- */
/* The viewer token lives in an HttpOnly cookie (set by /ui on first load) and is
   sent automatically with same-origin /api fetches — JS neither reads nor forwards
   it. A missing/invalid token surfaces as a 401 from /api/tasks below. */
var state = {
  view:'list', taskId:null,
  theme: localStorage.getItem('sb-theme') || 'light',
  tasks:[], viewer:null, detail:null,
  loadingDetail:false,
  error:null,        // null | 'no-token' | 'unauthorized' | 'forbidden' | 'not-found' | 'network'
  expanded:{}, version:{}, eventFilter:'all', eventLogOpen:true,
  /* which todo is open in the modal over the board (its internal `id`), or null when
     nothing is. NOT keyed by task like `version` is: a modal is a thing you opened a
     second ago and close by pressing Escape, so remembering it across a navigation would
     mean returning to a task and finding a dialog you never opened. Cleared on
     navigation (openTask/goHome). MUST appear in sig() below or opening/closing it
     would never re-render. */
  todoModal:null,
  /* which shared file the screenshot lightbox is enlarging (its id, as a string), or
     null when the overlay is closed. MUST appear in sig() below or opening/closing the
     lightbox would never re-render. Cleared on navigation (openTask/goHome). */
  lightbox:null,
  /* which slide-out reference panel is open: null | 'commands' | 'workflows'. Reference
     only — neither panel has an input or a button that calls anything (DECISIONS D11).
     MUST appear in sig() below or opening/closing it would never re-render. */
  panel:null,
  /* Workflows panel: which sections are expanded and which cast size the story tells.
     `sec`/`sub` hold only what the human has TOUCHED — an untouched key falls through to
     wfIsOpen()'s mode default, so a debug task can open with its own section already up
     without that being a click nobody made. MUST appear in sig() or a toggle would never
     repaint. */
  wf:{sec:{}, sub:{}, cast:'2'},
  mobileTab:'thread', switcherOpen:false, isMobile: window.innerWidth<900,
  /* a desktop that is merely NARROW (>=900 so not gated, but under ~1150): the header
     is already dense, so the two reference buttons drop their text labels and the
     "last refreshed" wording collapses to its dot + tooltip. Nothing is lost, and the
     header never overflows horizontally. */
  narrow: window.innerWidth<1150,
  lastRefresh:0, refreshing:false
};
var lastSig=null;
var app=document.getElementById('app');

/* ---------- fetching ---------- */
function api(path){
  /* auth rides the HttpOnly sb_view cookie — same-origin, sent automatically */
  return fetch(path,{headers:{'Accept':'application/json'},credentials:'same-origin'});
}
function fetchTasks(){
  state.refreshing=true; patchVolatile();
  return api('/api/tasks').then(function(r){
    if(r.status===401){ state.error='unauthorized'; throw 0; }
    if(!r.ok) throw 0;
    return r.json();
  }).then(function(d){
    state.tasks=d.tasks||[]; state.viewer=d.viewer||null;
    if(state.error==='unauthorized'||state.error==='network') state.error=null;
    state.lastRefresh=Date.now();
  }).catch(function(e){
    if(state.error==null) state.error='network';
  }).then(function(){ state.refreshing=false; render(); });
}
function fetchDetail(id){
  if(!id) return Promise.resolve();
  return api('/api/task/'+encodeURIComponent(id)).then(function(r){
    if(r.status===401){ state.error='unauthorized'; throw 0; }
    if(r.status===403){ state.error='forbidden'; throw 0; }
    if(r.status===404){ state.error='not-found'; throw 0; }
    if(!r.ok) throw 0;
    return r.json();
  }).then(function(d){
    if(state.view==='task' && state.taskId===id){
      state.detail=d; state.loadingDetail=false;
      if(state.error==='forbidden'||state.error==='not-found'||state.error==='network') state.error=null;
    }
    state.lastRefresh=Date.now();
  }).catch(function(e){
    if(state.error==null) state.error='network';
  }).then(function(){ render(); });
}

/* ---------- navigation ---------- */
function openTask(id){
  state.view='task'; state.taskId=id; state.detail=null; state.loadingDetail=true;
  state.switcherOpen=false; state.mobileTab='thread'; state.lightbox=null; state.todoModal=null;
  if(state.error==='not-found'||state.error==='forbidden') state.error=null;
  render(); fetchDetail(id);
}
function goHome(){ state.view='list'; state.switcherOpen=false; state.detail=null; state.taskId=null; state.lightbox=null; state.todoModal=null; render(); }
function toggleTheme(){ state.theme = state.theme==='dark'?'light':'dark'; localStorage.setItem('sb-theme',state.theme); render(); }

/* ---------- style helpers ---------- */
function seg(active){ return 'padding:5px 13px;font-size:12.5px;font-weight:600;border-radius:7px;border:none;background:'+(active?'var(--surface)':'transparent')+';color:'+(active?'var(--text)':'var(--text-2)')+';box-shadow:'+(active?'var(--shadow)':'none'); }
function tabStyle(active){ return 'flex:1;padding:10px 0;font-size:13px;font-weight:600;border:none;background:transparent;cursor:pointer;color:'+(active?'var(--accent)':'var(--text-2)')+';border-bottom:'+(active?'2px solid var(--accent)':'2px solid transparent'); }
function filterStyle(active){ return 'padding:3px 10px;border-radius:7px;border:1px solid '+(active?'var(--accent)':'var(--border)')+';background:'+(active?'var(--accent-soft)':'transparent')+';color:'+(active?'var(--accent-2)':'var(--text-2)')+';font-size:11px;font-weight:600;cursor:pointer;font-family:'+MONO; }
/* `dead` = superseded: still selectable (reading back what was agreed is the point of a
   version picker) but never rendered as an equal of the live one. Only the INACTIVE state
   is faded — a faded button you have just clicked reads as a failed click. */
function vBtnStyle(active, dead){ return 'padding:4px 10px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:'+MONO+';display:flex;align-items:center;gap:4px;background:'+(active?'var(--surface)':'transparent')+';color:'+(active?'var(--text)':'var(--text-2)')+';box-shadow:'+(active?'var(--shadow)':'none')+';opacity:'+(dead&&!active?'.45':'1'); }

/* ---------- stepper ---------- */
/* Pre-flight is done once every live agent has passed (readiness_status), with a
   fallback to the legacy `ready` bool. No agents yet → not done. */
function preflightPassed(agents){
  if(!agents||!agents.length) return false;
  return agents.every(function(a){ return a.readiness_status==='passed' || a.ready; });
}

/* ONE stepper node's circle + label colour, shared by all three steppers (the seven-node
   task stepper, the truncated three-node one, and the per-todo mini-stepper) so they are
   literally the same widget at different sizes. The glyph sizes are derived from `size`
   and reproduce the original 28px node exactly (14/8/6). */
function stepVisual(done,current,stuckStep,size){
  size=size||28;
  var chk=Math.round(size*0.5), dot=Math.round(size*0.29), pip=Math.round(size*0.215);
  var node='width:'+size+'px;height:'+size+'px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;';
  if(stuckStep) node+='background:var(--st-stuck-dot);';
  else if(done) node+='background:var(--st-verified-dot);';
  else if(current) node+='background:var(--accent);';
  else node+='background:var(--surface);border:2px solid var(--border-strong);';
  var inner;
  if(done) inner='<svg width="'+chk+'" height="'+chk+'" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2"><path d="M20 6L9 17l-5-5"/></svg>';
  else if(current) inner='<span style="width:'+dot+'px;height:'+dot+'px;border-radius:50%;background:#fff"></span><span style="position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ring 1.6s ease-out infinite"></span>';
  else if(stuckStep) inner='<span style="color:#fff;font-weight:700;font-size:'+chk+'px">!</span>';
  else inner='<span style="width:'+pip+'px;height:'+pip+'px;border-radius:50%;background:var(--border-strong)"></span>';
  return {nodeStyle:node, inner:inner,
    labelColor:(done||current)?'var(--text)':(stuckStep?'var(--st-stuck-fg)':'var(--text-3)')};
}

function genSteps(stateName, times, agents, engagement){
  times=times||{};
  var isStuck = stateName==='stuck';
  var realO = ORDER[stateName]!=null?ORDER[stateName]:0;   // index into REAL task states
  var preDone = preflightPassed(agents);
  function disp(ri){ return ri===0?0:ri+1; }               // real index → display index
  // Display frontier (into the 7-node STEPS incl. the inserted pre-flight at index 1).
  var o = isStuck ? 5 : (stateName==='open' ? 1 : disp(realO));
  // Only an engagement gets the eighth (`confirmed`) node — see STEPS.
  var steps = engagement ? STEPS : STEPS.slice(0, STEPS.length-1);
  var last = steps.length-1;
  /* Nothing is left to do AT the frontier node itself, so it renders done (a tick)
     rather than current (a pulsing ring). `confirmed` belongs here beside `verified`:
     without it the final node of a FINISHED engagement pulses forever, which is the
     dashboard's one way of saying "someone is working on this right now". */
  var finished = stateName==='verified' || stateName==='confirmed';
  // Pass 1: resolve done/current/stuck per node (the pre-flight node is special-cased
  // because it has no matching task state — it's driven by agent readiness).
  var meta = steps.map(function(s,i){
    var key=s[0];
    var stuckStep = isStuck && i===5;
    var done, current;
    if(key==='preflight'){
      done = (stateName!=='open') || preDone;
      current = stateName==='open' && !preDone && !isStuck;
    } else {
      done = i<o || (finished && i===o);
      current = i===o && !isStuck && !finished;
    }
    return {done:done, current:current, stuck:stuckStep};
  });
  var reached=function(m){ return m.done||m.current||m.stuck; };
  return steps.map(function(s,i){
    var key=s[0], m=meta[i];
    var done=m.done, current=m.current, stuckStep=m.stuck;
    var v=stepVisual(done,current,stuckStep,28);
    var leftColor = i===0 ? 'transparent' : (reached(m) ? 'var(--st-verified-dot)' : 'var(--border-strong)');
    var rightColor = i===last ? 'transparent' : (reached(meta[i+1]) ? 'var(--st-verified-dot)' : 'var(--border-strong)');
    return {key:key, label:s[1], time:(done||current||stuckStep)?(times[key]||''):'', nodeStyle:v.nodeStyle, inner:v.inner, leftColor:leftColor, rightColor:rightColor, labelColor:v.labelColor};
  });
}

/* The THREE-node task stepper for a task WITH todos. `open` is done the moment the task
   exists; `pre-flight` keeps its per-seat meaning; the tail is the fan-out, summarised
   by todoProgressTail below. Returns the identical node shape genSteps does, so
   taskHTML's renderer is untouched. */
function genStepsTodo(d){
  var times=d.times||{};
  var roll=d.todo_rollup||{};
  var preDone=preflightPassed(d.agents);
  var complete=!!roll.complete;
  var meta=[
    {done:true,current:false},
    {done:preDone,current:!preDone},
    /* only the frontier pulses: todos can't be the live node until pre-flight passed
       (the broker locks the action tools until then, so this is belt-and-braces) */
    {done:complete,current:preDone&&!complete}
  ];
  var last=STEPS_TODO.length-1;
  var reached=function(m){ return m.done||m.current; };
  return STEPS_TODO.map(function(s,i){
    var m=meta[i], v=stepVisual(m.done,m.current,false,28);
    return {key:s[0], label:s[1], time:(s[0]==='open'?(times.open||''):''),
      nodeStyle:v.nodeStyle, inner:v.inner, labelColor:v.labelColor,
      leftColor: i===0?'transparent':(reached(m)?'var(--st-verified-dot)':'var(--border-strong)'),
      rightColor: i===last?'transparent':(reached(meta[i+1])?'var(--st-verified-dot)':'var(--border-strong)')};
  });
}

/* ---------- role avatar helper ---------- */
/* Find the live agent for a role in the current task detail, or null when the
   detail (or its agents list) is missing — matched by role, then name. */
function agentFor(role, name){
  var ags = state.detail && state.detail.agents;
  if(!ags || !ags.length) return null;
  for(var i=0;i<ags.length;i++){ if(ags[i].role===role || (name&&ags[i].name===name)) return ags[i]; }
  return null;
}
/* ---------- live presence (agent parked in wait_for_message) ---------- */
/* The broker stores an EXPIRY and the API hands us the already-computed booleans.
   DEFENSIVE: ui.html is served fresh from disk while api.py runs from memory, so a
   broker restarted mid-upgrade can serve this file against an older API with no
   `listening` fields at all. Missing → "not listening", and every badge falls back
   to exactly what shipped before (same precedent as the 1.0.1 thread-ordering fix). */
function isListening(ag){ return !!(ag && ag.listening); }
/* "42m" for the streak start; '' when the API is stale or the value is nonsense. */
function listenAgo(ag){
  var since = ag && ag.listening_since;
  if(!since) return '';
  var secs = Math.floor(Date.now()/1000 - since);
  if(!isFinite(secs) || secs < 0) return '';
  if(secs < 60) return secs+'s';
  if(secs < 3600) return Math.floor(secs/60)+'m';
  var h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60);
  return m ? h+'h '+m+'m' : h+'h';
}
function listenLabel(ag){ var d=listenAgo(ag); return d ? 'listening — '+d : 'listening'; }
var LISTEN_TIP="Parked in wait_for_message right now — new mail wakes it immediately.";
/* The same signal spelled out, for rows with room for words. '' when not listening
   (and always '' against an older API, since isListening is then false). */
function listenPill(ag){
  if(!isListening(ag)) return '';
  return '<span title="'+esc(LISTEN_TIP)+'" style="display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--st-verified-bg);color:var(--st-verified-fg);white-space:nowrap">'+
    '<span style="width:6px;height:6px;border-radius:50%;background:var(--st-verified-dot);animation:pulsedot 1.8s ease-in-out infinite;flex:none"></span>'+esc(listenLabel(ag))+'</span>';
}

/* A small corner badge on an agent's avatar. Pre-flight state first — amber 🔒 while
   they haven't passed — then it HANDS OFF: once an agent is through pre-flight the
   badge carries the live signal, a pulsing green dot while it's listening and the
   static green ✓ when it isn't. '' only when the agent is unknown (no agents list). */
var LOCK_TIP="Hasn't passed the pre-flight readiness check — can't send messages or change status yet.";
var READY_TIP="Passed the pre-flight readiness check — action tools unlocked.";
function lockBadge(role, name){
  var ag=agentFor(role, name);
  if(!ag) return '';
  if(ag.ready){
    if(isListening(ag)){
      return '<span title="'+esc(listenLabel(ag)+' · '+LISTEN_TIP)+'" style="position:absolute;bottom:-3px;right:-3px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:1.5px solid var(--surface);display:flex;align-items:center;justify-content:center">'+
        '<span style="width:8px;height:8px;border-radius:50%;background:var(--st-verified-dot);animation:pulsedot 1.8s ease-in-out infinite"></span></span>';
    }
    return '<span title="'+esc(READY_TIP)+'" style="position:absolute;bottom:-3px;right:-3px;width:13px;height:13px;border-radius:50%;background:var(--st-verified-bg);color:var(--st-verified-fg);border:1.5px solid var(--surface);display:flex;align-items:center;justify-content:center">'+
      '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></span>';
  }
  return '<span title="'+esc(LOCK_TIP)+'" style="position:absolute;bottom:-3px;right:-3px;width:13px;height:13px;border-radius:50%;background:var(--st-stuck-bg);color:var(--st-stuck-fg);border:1.5px solid var(--surface);display:flex;align-items:center;justify-content:center">'+
    '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></span>';
}
/* `role` here is the SEAT (the handle) — that is what `agentFor`/`lockBadge` match on,
   because the API's agent rows are keyed by seat. `colorRole` is the ROLE TYPE and is
   what picks the letter and the colour; they are the same string on a task with one
   seat per role type, so omitting it reproduces exactly the old behaviour. */
function avatarChip(role, size, fs, colorRole){
  var a=av(colorRole||role);
  var lock=lockBadge(role);
  return '<span title="'+esc(a.label)+'" style="position:relative;width:'+size+'px;height:'+size+'px;border-radius:7px;background:'+a.c+';color:#fff;font-size:'+fs+'px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+lock+'</span>';
}

/* ---------- pre-flight pills (under the pre-flight stepper node) ---------- */
/* One tiny pill per agent — the host/buddy status shown right under the "pre-flight
   assessments" node: green "passed", red "failed", grey "pending" (the default).
   Reads readiness_status, falling back to the legacy `ready` bool. */
function preflightStatus(ag){
  if(ag.readiness_status) return ag.readiness_status;
  return ag.ready ? 'passed' : 'pending';
}
function preflightPills(d){
  var ags=(d&&d.agents)||[];
  if(!ags.length) return '';
  var pills=ags.map(function(ag){
    /* `ag.role` is the SEAT; the colour and letter come from the kind of work. */
    var a=av(ag.role_type||ag.role);
    var s=preflightStatus(ag);
    var cfg = s==='passed' ? {bg:'var(--st-verified-bg)',fg:'var(--st-verified-fg)',lbl:'passed'}
           : s==='failed' ? {bg:'var(--st-stuck-bg)',fg:'var(--st-stuck-fg)',lbl:'failed'}
           : {bg:'var(--st-open-bg)',fg:'var(--st-open-fg)',lbl:'pending'};
    var ic = s==='passed' ? '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M20 6L9 17l-5-5"/></svg>'
           : s==='failed' ? '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M18 6L6 18M6 6l12 12"/></svg>'
           : '<span style="width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7"></span>';
    return '<span title="'+esc(seatIdentity(ag.role, true)+' — '+cfg.lbl)+'" style="display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;font-size:9.5px;font-weight:700;background:'+cfg.bg+';color:'+cfg.fg+';max-width:100%">'+
      '<span style="width:12px;height:12px;border-radius:4px;background:'+a.c+';color:#fff;font-size:8px;display:inline-flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+'</span>'+ic+'</span>';
  }).join('');
  return '<div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:6px;max-width:120px">'+pills+'</div>';
}

/* ---------- naming a PERSON vs naming a SEAT ----------
   Two different jobs, and one label was doing both badly.

   IDENTITY — a party pill, a signature, "who is this?" — is the human's OWN name plus
   the kind of work they do: `Tony's agent [backend]`. That is the question those pills
   are actually answering, and a bare `frontend-2` answered it with a database key.

   INSTRUCTION — anything a human is meant to TYPE — stays the HANDLE, because that is
   the token the broker accepts and the one quoted in every message and signature. The
   two are joined on FIRST MENTION in the NEXT card (`Priya's agent (@frontend-2) types
   sign #1`), so a reader can connect the person to the word in the sentence.

   NAME IS DISPLAY-ONLY AND NEVER A KEY. Two people called Sarah is legal, so when a
   name is shared the handle is appended as the tiebreak — two identical pills would be
   worse than a slightly longer one. Resolution is untouched and stays
   handle → role type → tag → name.

   All of it reads `d.roster`, the same source the Cast panel and the agents' `roster`
   tool use. DEFENSIVE as everywhere else here: with no roster (an older API) every
   helper falls back to the handle, i.e. exactly what shipped before. */
function rosterRow(seat){
  var rows = state.detail && state.detail.roster && state.detail.roster.rows;
  if(!rows) return null;
  for(var i=0;i<rows.length;i++){ if(rows[i].seat===seat) return rows[i]; }
  return null;
}
/* A seat's ROLE TYPE — what picks its colour and its letter. */
function seatRole(seat){ var r=rosterRow(seat); return r ? r.role : seat; }
function avSeat(seat){ return av(seatRole(seat)); }
/* The token a human should TYPE for a seat. Identical to the handle everywhere except
   one row: a seat whose stored handle is a bare role type on a task that later grew a
   second seat of that type. `@frontend` then means the TYPE, so rendering the handle
   would print the one token on this task that resolves to two people — and a party list
   pasted from it would be refused. The broker derives `address` for exactly that seat
   (seats.roster); an older API sends no `address` and the handle fallback is then right,
   because before a type could be shared the two were always the same string. */
function seatAddress(seat){ var r=rosterRow(seat); return (r && r.address) || seat; }
/* Does another seat display the same human name? Then the name alone is not an identity. */
function nameIsShared(row){
  var rows = state.detail && state.detail.roster && state.detail.roster.rows;
  if(!rows || !row || !row.name) return false;
  var n=0;
  for(var i=0;i<rows.length;i++){ if(rows[i].name===row.name) n++; }
  return n>1;
}
/* `Tony's agent [backend]` — or `[qa] · not joined` for a seat nobody has taken, which
   is the row a host most needs to see and so is never dropped. `withHandle` appends
   `@seat`, and a shared name forces it. */
function seatIdentity(seat, withHandle){
  var row=rosterRow(seat);
  if(!row) return seat;
  var role='['+row.role+']';
  /* Nobody has taken this seat, so there is no "X's agent" to write — but the row is
     the most useful one on the panel (it is how a host sees the invite nobody accepted),
     so it renders rather than vanishing. With `withHandle` the HANDLE leads, because
     for an unfilled seat that is the only identity there is. */
  if(!row.name) return (withHandle ? '@'+seatAddress(seat)+' ' : '')+role+' · not joined';
  var label=row.name+"’s agent "+role;
  if(withHandle || nameIsShared(row)) label += ' @'+seatAddress(seat);
  return label;
}

/* ---------- the CAST: seats, role types, and the count chips ----------
   A seat is a PERSON (`@frontend-2`); a role type is a KIND OF WORK (`frontend`), and
   several seats may share one. `t.roles` is the list of seat handles and `t.seat_roles`
   maps each to its role type. DEFENSIVE, like every other payload read here: an older
   API sends no `seat_roles`, and the identity fallback is then exactly right — before
   the two were split, a seat and its role type were the same string. */
function seatRoleOf(t, seat){ var m=(t&&t.seat_roles)||{}; return m[seat]||seat; }

/* One coloured letter per ROLE TYPE with a multiplier: (B×2)(F×2)(Q), never
   (B)(B)(F)(F)(Q). Repeating identical letters reads as a rendering bug and stops
   scaling around six seats. Per-person initials were considered and rejected: an
   unjoined seat has no initial, and the letters would stop meaning role type.
   A role type held by ONE seat renders the chip that shipped before — same avatar,
   same colour, same lock/presence badge — so a one-seat-per-role task is unchanged. */
function castChips(t, size, fs){
  var list=(t&&t.roles)||[];
  if(!list.length) return '';
  var order=[], counts={}, firstSeat={};
  for(var i=0;i<list.length;i++){
    var rt=seatRoleOf(t,list[i]);
    if(counts[rt]===undefined){ counts[rt]=0; order.push(rt); firstSeat[rt]=list[i]; }
    counts[rt]++;
  }
  return order.map(function(rt){
    var n=counts[rt];
    if(n===1) return avatarChip(firstSeat[rt], size, fs, rt);
    var a=av(rt);
    return '<span title="'+esc(n+' × '+a.label)+'" style="display:inline-flex;align-items:center;gap:2px;height:'+size+'px;padding:0 '+Math.round(size*0.22)+'px;border-radius:7px;background:'+a.c+';color:#fff;font-size:'+fs+'px;font-weight:700;flex:none;white-space:nowrap">'+
      esc(a.i)+'<span style="font-size:'+(fs-1.5)+'px;opacity:.85;font-weight:600">×'+n+'</span></span>';
  }).join('');
}

/* ---------- the roster panel ("Cast") ----------
   Grows out of the old `PRE-FLIGHT [backend ✓ passed]` strip rather than sitting beside
   it: two overlapping lists of people is how they drift apart. Rendered from `d.roster`,
   the SAME source the agents' `roster` tool reads — one roster, two renderers.

   UNJOINED SEATS ARE LISTED. A roster built only from joined agents cannot answer "who
   never accepted their invite?", which is precisely the state that silently stalls a
   task — and "4 of 5 joined" is the headline for exactly that reason. */
/* A joined seat that is not currently parked in wait_for_message renders BLANK, not
   "idle". We do not track whether a person is at their desk, and "idle" claimed we did
   — it reads as a status about the human ("Kola is slacking") when all it ever meant was
   "no agent is blocked on a read right this second", which is the normal state of an
   agent that is busy working. The column still earns its place: a listening pill is a
   real live signal, and the UNJOINED strings are the whole reason the roster lists seats
   nobody has filled. */
function rosterPresence(row){
  if(!row.joined) return row.invite_pending ? 'invite sent' : 'not invited yet';
  if(row.listening) return listenLabel(row);
  return '';
}
function rosterPanel(d){
  var r=d&&d.roster;
  if(!r||!r.rows||!r.rows.length) return '';   /* older API: render nothing, as before */
  var allIn = r.joined===r.seats;
  var head='<div style="display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border)">'+
    '<span style="font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)">Cast</span>'+
    '<div style="flex:1"></div>'+
    '<span style="font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:'+(allIn?'var(--st-verified-bg)':'var(--st-open-bg)')+';color:'+(allIn?'var(--st-verified-fg)':'var(--st-open-fg)')+'">'+
      r.joined+' of '+r.seats+' joined</span></div>';
  var cols='grid-template-columns:minmax(104px,auto) minmax(72px,auto) minmax(72px,1fr) auto auto';
  var hdr='<div style="display:grid;'+cols+';gap:12px;padding:7px 16px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border)">'+
    '<span>Seat</span><span>Role</span><span>Who</span><span>Pre-flight</span><span>Presence</span></div>';
  var rows=r.rows.map(function(row){
    var a=av(row.role);
    var st = row.joined ? (row.readiness_status||'pending') : '';
    var cfg = st==='passed' ? {bg:'var(--st-verified-bg)',fg:'var(--st-verified-fg)',lbl:'passed'}
           : st==='failed' ? {bg:'var(--st-stuck-bg)',fg:'var(--st-stuck-fg)',lbl:'failed'}
           : st ? {bg:'var(--st-open-bg)',fg:'var(--st-open-fg)',lbl:'pending'} : null;
    /* the seat renders as a monospace @handle chip because it is the token a human
       TYPES into a command — the same idiom as the shortcode chips. Which is exactly
       why it prints `address` and not `seat`: on a task that grew a second seat of a
       role type, the first seat's stored handle IS that type, so the chip would be
       offering a token that names two people. */
    var seat='<span style="font-family:'+MONO+';font-size:11.5px;font-weight:600;color:'+(row.joined?'var(--text)':'var(--text-3)')+';border:1px solid var(--border-strong);border-radius:999px;padding:1px 8px;white-space:nowrap">@'+esc(row.address||row.seat)+'</span>';
    var pre = cfg ? '<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:'+cfg.bg+';color:'+cfg.fg+';white-space:nowrap">'+cfg.lbl+'</span>'
                  : '<span style="font-size:11.5px;color:var(--text-3)">—</span>';
    var pres = row.joined && row.listening ? listenPill(row)
      : '<span style="font-size:11.5px;color:var(--text-3);white-space:nowrap">'+esc(rosterPresence(row))+'</span>';
    return '<div style="display:grid;'+cols+';gap:12px;padding:8px 16px;align-items:center;border-bottom:1px solid var(--border);opacity:'+(row.joined?'1':'.72')+'">'+
      seat+
      '<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap">'+
        '<span style="width:14px;height:14px;border-radius:5px;background:'+a.c+';color:#fff;font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+'</span>'+esc(row.role)+'</span>'+
      '<span style="font-size:12.5px;color:'+(row.name?'var(--text)':'var(--text-3)')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(row.name||'—')+'</span>'+
      pre+pres+'</div>';
  }).join('');
  return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden">'+
    head+'<div style="overflow-x:auto">'+hdr+rows+'</div></div>';
}

/* ---------- pre-flight fail report (coaching panel) ---------- */
/* When an agent FAILED pre-flight, show the human exactly which questions it missed
   and the broker's hint — so they can coach it, then the agent re-runs submit_readiness.
   Rendered only when there's at least one failure; empty otherwise. */
function readinessFailPanel(d){
  var ags=((d&&d.agents)||[]).filter(function(a){ return preflightStatus(a)==='failed' && a.readiness_report; });
  if(!ags.length) return '';
  var blocks=ags.map(function(ag){
    var a=av(ag.role_type||ag.role);
    var missed=(ag.readiness_report||[]).filter(function(r){ return !r.ok; });
    var items=missed.map(function(r){
      return '<li style="margin:0 0 6px"><span style="font-family:'+MONO+';font-size:10.5px;font-weight:700;color:var(--st-stuck-fg);background:var(--st-stuck-bg);padding:1px 6px;border-radius:5px">'+esc(r.id)+'</span> <span style="color:var(--text-2)">'+esc(r.hint||'')+'</span></li>';
    }).join('');
    return '<div style="margin:0 0 10px">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">'+avatarChip(ag.role,20,9)+
      '<span style="font-size:12.5px;font-weight:600;color:var(--text)">'+esc(seatIdentity(ag.role, true))+'</span>'+
      '<span style="font-size:11px;font-weight:600;color:var(--st-stuck-fg)">failed '+missed.length+' question'+(missed.length===1?'':'s')+'</span></div>'+
      '<ul style="margin:0;padding-left:2px;list-style:none;font-size:12px;line-height:1.45">'+items+'</ul></div>';
  }).join('');
  return '<details open style="margin:0 0 16px;background:var(--surface);border:1px solid var(--st-stuck-dot);border-radius:12px;box-shadow:var(--shadow);overflow:hidden">'+
    '<summary style="list-style:none;cursor:pointer;padding:11px 16px;font-size:12.5px;font-weight:700;color:var(--st-stuck-fg);display:flex;align-items:center;gap:8px;user-select:none">'+
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>Pre-flight failures — coach & retry</summary>'+
    '<div style="padding:4px 16px 14px"><p style="margin:0 0 12px;font-size:12px;color:var(--text-2)">Share the hint with the agent, then it re-runs <span style="font-family:'+MONO+'">submit_readiness</span>.</p>'+blocks+'</div></details>';
}

/* ---------- header ---------- */
function headerHTML(){
  var dark=state.theme==='dark';
  var m=state.isMobile;
  var switcherLabel = (state.view==='task' && state.detail) ? state.detail.title : (state.view==='task'?(state.taskId||'Task'):'All tasks');
  var buddy = state.viewer && state.viewer.mode==='buddy';

  var switcherMenu='';
  if(state.switcherOpen){
    var rows = state.tasks.map(function(t){
      var c=stateChip(t.state); var activeRow = t.id===state.taskId;
      return '<button data-open="'+esc(t.id)+'" style="display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--text);background:'+(activeRow?'var(--surface-2)':'transparent')+'">'+
        '<span style="width:8px;height:8px;border-radius:50%;background:'+c.dot+';flex:none"></span>'+
        '<span style="flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.title)+'</span>'+
        '<span style="font-size:11px;color:'+c.fg+';font-weight:600">'+esc(c.label)+'</span></button>';
    }).join('');
    if(!rows) rows='<div style="padding:8px 9px;font-size:12px;color:var(--text-3)">No tasks</div>';
    switcherMenu='<div style="position:absolute;top:calc(100% + 6px);left:0;width:280px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:50">'+
      '<div style="font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:6px 9px 4px">Switch task</div>'+rows+'</div>';
  }

  /* Correction #1: static scope badge, NOT a clickable Host/Buddy toggle. */
  var scopeBadge;
  if(buddy){
    scopeBadge='<div style="display:flex;align-items:center;gap:7px;padding:5px 11px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;font-size:12px;font-weight:500;color:var(--accent-2)">'+
      IC.user+'viewing as buddy · task: '+esc(state.viewer.task_id||'')+'</div>';
  } else {
    scopeBadge='<div style="display:flex;align-items:center;gap:7px;padding:5px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;font-size:12px;font-weight:500;color:var(--text-2)">'+
      '<span style="width:7px;height:7px;border-radius:50%;background:var(--st-live-dot)"></span>viewing as host · all tasks</div>';
  }
  /* while viewer unknown (first paint / error) keep the slot but empty */
  if(!state.viewer) scopeBadge='';
  /* mobile: header would overflow — drop the scope badge (list/subtitle already convey it) */
  if(m) scopeBadge='';

  /* Notification chip. Renders ONLY when a channel is armed — an absent chip means
     "nobody gets paged", which is the honest default and keeps the header quiet for the
     many tasks that never wire one up.

     Reads viewer.notify_channels (NAMES only — a webhook URL or bot token is a bearer
     credential and never reaches the browser), so adding a channel server-side needs no
     change here. Falls back to the older slack_active boolean so a dashboard served by
     an older broker still lights up. Terminal events are what actually get posted, so
     the title says so rather than implying every message is mirrored. */
  var slackChip = '';
  var notifyChannels = (state.viewer && state.viewer.notify_channels)
    || ((state.viewer && state.viewer.slack_active) ? ['slack'] : []);
  if(notifyChannels.length && !m){
    var label = notifyChannels.map(function(c){ return c.charAt(0).toUpperCase()+c.slice(1); }).join(' · ');
    slackChip='<div title="Terminal events (verified · resolved · stuck · waiting) are posted to '+esc(label)+'" '+
      'style="display:flex;align-items:center;gap:6px;padding:5px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;font-size:12px;font-weight:500;color:var(--text-2)">'+
      '<span style="width:7px;height:7px;border-radius:50%;background:var(--st-verified-dot)"></span>'+esc(label)+'</div>';
  }

  /* "+ New task" — host only, and only inside the desktop app (the pywebview bridge
     exists). Never shown to buddy viewers or in a plain browser, so the dashboard
     stays read-only for everyone who can't already start tasks. It deep-links back to
     the app's Start-a-task screen (see gui._DashApi.new_task). */
  var canAddTask = state.viewer && !buddy && !m &&
    typeof window.pywebview !== 'undefined' && window.pywebview.api;
  var newTaskBtn = canAddTask
    ? '<button data-newtask="1" title="Start a new task" style="display:flex;align-items:center;gap:5px;padding:6px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);flex:none">+ New task</button>'
    : '';

  /* The two REFERENCE buttons, grouped: they are siblings ("how do I drive this thing?"),
     so they sit adjacent with a divider separating them from the theme toggle, which is
     a display preference and nothing to do with them. Labelled in words wherever the
     header has room — an icon-only pair here would be pure guesswork. */
  function refBtn(key, icon, label, tip){
    var on = state.panel===key;
    var pad = state.narrow ? 'width:34px;justify-content:center' : 'padding:0 11px;gap:7px';
    return '<button data-panel="'+key+'" title="'+esc(tip)+'" aria-expanded="'+(on?'true':'false')+'" '+
      'style="height:34px;display:flex;align-items:center;'+pad+';border-radius:9px;cursor:pointer;flex:none;'+
      'font-size:13px;font-weight:600;font-family:inherit;'+

      'color:'+(on?'var(--accent-2)':'var(--text-2)')+'">'+

  }
  var refGroup = '<div style="display:flex;align-items:center;gap:6px;flex:none">'+
      refBtn('commands', IC.term, 'Commands',
             'Commands — what you type to YOUR agent. Reference only; the dashboard never runs anything.')+
      refBtn('workflows', IC.flow, 'Workflows',
             'Workflows — how a todo goes from idea to verified, plus debug and pre-flight.')+
    '</div>'+
    '<span style="width:1px;height:22px;background:var(--border);flex:none"></span>';

  var refreshDot = 'var(--st-verified-dot)';
  /* The header sits ABOVE an open reference panel (which starts at HEADER_H, below it) so
     the two buttons stay visible and clickable while a panel is open — you can swap
     Commands ⇄ Workflows, or close by clicking the lit one, without hunting for the ✕. */
  return '<div style="position:sticky;top:0;z-index:'+(state.panel?9992:40)+';display:flex;align-items:center;gap:'+(m?'10px':'14px')+';padding:11px '+(m?'14px':'20px')+';background:var(--surface);border-bottom:1px solid var(--border)">'+
    '<div data-home="1" style="display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;flex:none">'+
      '<div style="display:flex;align-items:center;gap:3px">'+
        '<span style="width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block"></span>'+
        '<span style="width:14px;height:2px;border-radius:2px;background:var(--border-strong);display:inline-block"></span>'+
        '<span style="width:9px;height:9px;border-radius:50%;background:var(--role-backend);display:inline-block"></span>'+
      '</div>'+
      '<span style="font-weight:700;font-size:16px;letter-spacing:-.02em;color:var(--text)">sys<span style="color:var(--text-3);font-weight:400">-</span>buddy</span>'+
    '</div>'+
    /* With ONE task there is nothing to switch to, so the control renders as plain text:
       a menu whose only entry is the thing you are already looking at is pure noise, and
       a caret promises a choice that does not exist. The switcher returns the moment a
       second task exists. */
    '<div style="position:relative;flex:none">'+
      (state.tasks.length > 1
        ? '<button data-switcher="1" style="display:flex;align-items:center;gap:8px;padding:6px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text);max-width:'+(m?'150px':'220px')+'">'+
            '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(switcherLabel)+'</span>'+IC.caret+'</button>'+switcherMenu
        : '<span style="display:flex;align-items:center;padding:6px 11px;font-size:13px;font-weight:500;color:var(--text);max-width:'+(m?'150px':'220px')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(switcherLabel)+'</span>')+
    '</div>'+
    '<div style="flex:1"></div>'+
    newTaskBtn+
    slackChip+
    scopeBadge+
    '<div style="display:flex;align-items:center;gap:7px;flex:none" title="'+esc(refreshText())+'">'+
      '<span id="sb-refresh-dot" style="width:7px;height:7px;border-radius:50%;background:'+refreshDot+';animation:pulsedot 2.4s ease-in-out infinite"></span>'+
      ((m||state.narrow)?'':'<span id="sb-refresh-text" style="font-size:12px;color:var(--text-2);white-space:nowrap">'+refreshText()+'</span>')+
    '</div>'+
    refGroup+
    '<button data-theme-toggle="1" title="Toggle theme" style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;cursor:pointer;color:var(--text-2);flex:none">'+(dark?IC.sun:IC.moon)+'</button>'+
  '</div>';
}

function refreshText(){
  if(state.error) return 'connection issue';
  if(!state.lastRefresh) return 'connecting…';
  var s=Math.floor((Date.now()-state.lastRefresh)/1000);
  if(s<3) return 'Last refreshed just now';
  if(s<60) return 'Last refreshed '+s+'s ago';
  return 'Last refreshed '+Math.floor(s/60)+'m ago';
}

/* ---------- desktop-only gate ---------- */

    '<div style="display:flex;align-items:center;gap:4px;margin-bottom:14px">'+

      '<span style="width:18px;height:2px;border-radius:2px;background:var(--border-strong);display:inline-block"></span>'+

/* ---------- full-screen message ---------- */
/* `retry` adds a button that simply reloads. It is load-bearing on an auth failure and
   NOT mere decoration: this page also runs inside the desktop app's dashboard window,
   which has no address bar, no devtools and no private mode — so before this there was
   literally no action available on that screen. The broker now DELETES a viewer cookie
   that failed to resolve (api._unauthorized), which is what makes reloading meaningful:
   the dead cookie is gone, so the reload is a clean attempt rather than a replay of the
   same rejection. */
function messageScreen(icon,title,body,retry){
  var btn = retry

/* ---------- task list ---------- */

     places, which is how the shortcode list drifted, and it said "One task" on a page
     that could be showing thirty. It also described a task as having "the contract" —
     pre-todo framing for a model where a task is delivered by one or more todos, each
     with its own. */
  var TASKS_BLURB = 'Your agents, working. Watch them agree what to build, sign a '
                  + 'contract for how, and ship — you’re just here to observe.';
  if(!state.tasks.length){
    return '<div style="max-width:1040px;margin:0 auto;padding:30px 20px 70px">'+
      '<h1 style="font-size:23px;font-weight:700;letter-spacing:-.025em;margin:0;color:var(--text)">Tasks</h1>'+
      '<p style="margin:6px 0 24px;font-size:14px;color:var(--text-2);max-width:560px">'+TASKS_BLURB+'</p>'+
      '<div style="text-align:center;padding:60px 20px;border:1px dashed var(--border-strong);border-radius:14px;color:var(--text-2)">'+
      '<p style="font-weight:600;font-size:15px;color:var(--text);margin:0 0 5px">No tasks yet</p>'+
      '<p style="font-size:13.5px;margin:0">Nothing to observe on this token right now.</p></div></div>';
  }
  var rows = state.tasks.map(function(t){
    var c=stateChip(t.state);
    var avs = castChips(t,22,10.5);
    var strike = t.strikes>0 ? '<span style="display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--st-stuck-bg);color:var(--st-stuck-fg)"><span style="width:5px;height:5px;border-radius:50%;background:var(--st-stuck-dot)"></span>strike '+t.strikes+' of '+MAX_STRIKES+'</span>' : '';
    /* the rollup, so a host triages the list without opening anything. `todo_rollup` is
       absent on a row with no live todos, so those rows are exactly as they were. */
    var roll = t.todo_rollup ? rollupBadgeHTML(t.todo_rollup, isDebugTask(t)?'fixed':'verified') : '';
    return '<div data-open="'+esc(t.id)+'" class="sb-row" style="display:flex;align-items:center;gap:16px;padding:15px 18px;background:var(--surface);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:border-color .15s,box-shadow .15s">'+
      '<span style="width:10px;height:10px;border-radius:50%;background:'+c.dot+';flex:none"></span>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
          '<span style="font-size:15px;font-weight:600;color:var(--text)">'+esc(t.title)+'</span>'+
          '<span style="display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:'+c.bg+';color:'+c.fg+'"><span style="width:6px;height:6px;border-radius:50%;background:'+c.dot+'"></span>'+esc(c.label)+'</span>'+roll+
        '</div>'+
        '<div title="'+esc(ROLE_COLOR_TIP)+'" style="display:flex;align-items:center;gap:6px;margin-top:9px">'+avs+'</div>'+
      '</div>'+
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none">'+
        '<span data-last="'+esc(t.id)+'" style="font-size:12.5px;color:var(--text-2);white-space:nowrap">'+esc(t.last||'')+'</span>'+strike+
      '</div>'+IC.chevR+'</div>';
  }).join('');
  /* "in flight" means STILL RUNNING, so it counts only the tasks that are — the header
     used to print state.tasks.length, i.e. every row on the page, so a finished board of
     ten `verified`/`stuck`/`resolved` tasks announced "10 in flight". A `confirmed`
     engagement is the sharpest case: the client has signed it off and you have invoiced. */
  var inFlight = state.tasks.filter(function(t){ return !TERMINAL[t.state]; }).length;
  return '<div style="max-width:1040px;margin:0 auto;padding:30px 20px 70px">'+
    '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">'+
      '<h1 style="font-size:23px;font-weight:700;letter-spacing:-.025em;margin:0;color:var(--text)">Tasks</h1>'+
      '<span style="font-size:13px;color:var(--text-2)">'+inFlight+' in flight</span></div>'+
    '<p style="margin:6px 0 24px;font-size:14px;color:var(--text-2);max-width:560px">'+TASKS_BLURB+'</p>'+
    '<div style="display:flex;flex-direction:column;gap:10px">'+rows+'</div></div>';
}

/* ---------- thread (messages + interleaved broker dividers) ---------- */
function minutes(t){ if(!t||t==='—') return -1; var p=String(t).split(':'); return (+p[0])*60+(+p[1]); }
function buildThread(d){
  var items=[];
  (d.messages||[]).forEach(function(m,idx){ items.push({t:m.time, min:minutes(m.time), ts:(typeof m.ts==='number'?m.ts:null), kind:'msg', m:m, ord:idx}); });
  var DIV={task:1,transition:1,lock:1,slack:1};
  (d.events||[]).forEach(function(ev,idx){
    var evk=ev[1];
    if(!DIV[evk]) return; // deploy/test/token are shown as bubbles or belong to the log
    var mn=minutes(ev[0]); if(evk==='task') mn-=0.5; // creation sorts first within its minute
    items.push({t:ev[0], min:mn, ts:(typeof ev[3]==='number'?ev[3]:null), kind:'div', evkind:evk, text:ev[2], ord:1000+idx});
  });
  // Sort by true creation time (ts, sub-second) when the API supplies it for every
  // item; otherwise fall back to the legacy minute-granularity sort (keeps a stale
  // API — e.g. before a broker restart — from breaking the thread). `ord` breaks ties
  // stably so same-instant items keep the order the API returned them (id order).
  var allTs = items.length>0 && items.every(function(it){ return typeof it.ts==='number' && isFinite(it.ts); });
  if(allTs){ items.sort(function(a,b){ return (a.ts-b.ts) || (a.ord-b.ord); }); }
  else     { items.sort(function(a,b){ return (a.min-b.min) || (a.ord-b.ord); }); }
  return items;
}
function bubbleStyle(type,pass){
  var s='background:var(--surface-2);border:1px solid var(--border);border-radius:12px;border-top-left-radius:4px;padding:11px 13px;font-size:13.5px;line-height:1.55;color:var(--text)';
  if(type==='verified') s='background:var(--st-verified-bg);border:1px solid var(--st-verified-dot);border-radius:12px;border-top-left-radius:4px;padding:11px 13px;font-size:13.5px;line-height:1.55;color:var(--text)';
  else if(type==='test_result' && !pass) s='background:var(--surface-2);border:1px solid var(--st-stuck-dot);border-radius:12px;border-top-left-radius:4px;padding:11px 13px;font-size:13.5px;line-height:1.55;color:var(--text)';
  return s;
}
function confettiHTML(){
  var cols=['var(--accent)','var(--st-verified-dot)','var(--role-backend)','var(--st-testing-dot)','var(--role-frontend)','var(--role-mobile)','var(--accent)'];
  var delays=[0,.1,.05,.18,.12,.22,.3];
  var spans=cols.map(function(c,i){ return '<span style="width:7px;height:9px;border-radius:2px;background:'+c+';animation:cfall 1.2s ease-in '+delays[i]+'s forwards"></span>'; }).join('');
  return '<div style="position:relative;height:0;overflow:visible"><div style="position:absolute;left:6px;top:4px;display:flex;gap:7px">'+spans+'</div></div>';
}
function threadItemHTML(it){
  if(it.kind==='div'){
    var col=eventColor(it.evkind);
    return '<div style="display:flex;align-items:center;gap:12px;padding:1px 0">'+
      '<div style="flex:1;height:1px;background:var(--border)"></div>'+
      '<div style="display:flex;align-items:center;gap:7px;white-space:nowrap">'+
        '<span style="color:'+col+';display:flex">'+dividerIcon(it.evkind)+'</span>'+
        '<span style="font-family:'+MONO+';font-size:11px;color:var(--text-3)">'+esc(it.t)+'</span>'+
        '<span style="color:var(--text-3)">·</span>'+
        '<span style="font-size:12px;color:var(--text-2);font-weight:500">'+esc(it.text)+'</span>'+
      '</div><div style="flex:1;height:1px;background:var(--border)"></div></div>';
  }
  var m=it.m;
  // an agent 'stuck' message renders as the centered stuck pill (prototype sysStuck)
  if(m.type==='stuck'){
    return '<div style="display:flex;justify-content:center;padding:2px 0">'+
      '<div style="display:flex;align-items:center;gap:9px;background:var(--st-stuck-bg);color:var(--st-stuck-fg);border:1px solid var(--st-stuck-dot);padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:600;text-align:center">'+
      '<span style="font-family:'+MONO+';font-size:11px;opacity:.8">'+esc(m.time)+'</span>'+esc(m.body)+'</div></div>';
  }
  var pass = (m.type==='test_result') ? (m.strike==null) : false;
  var chip=typeChip(m.type,pass);
  var a=avSeat(m.role);
  // directed message: a `→ role` chip tinted with the target role's color (broadcast/null = no chip)
  var toChip='';
  if(m.to_role){
    var ta=av(m.to_role);
    toChip='<span title="directed to '+esc(ta.label)+'" style="display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-family:'+MONO+';font-size:10px;font-weight:600;color:'+ta.c+';background:transparent;border:1px solid '+ta.c+'">→ '+esc(ta.label)+'</span>';
  }
  /* ⟨todo⟩ chip: which deliverable this message belongs to. The API adds `todo` ONLY
     when the message names one, so a pre-todo thread renders with no chip at all. */
  var tdChip = (m.todo!=null) ? todoChipHTML(m.todo) : '';
  var code = m.code ? '<pre style="margin:11px 0 2px;background:var(--surface-3);border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-family:'+MONO+';font-size:11.5px;line-height:1.55;color:var(--text-2);overflow-x:auto;white-space:pre">'+esc(m.code)+'</pre>' : '';
  var strikePill='';
  if(m.type==='test_result' && m.strike!=null){
    var dots='';
    for(var i=1;i<=MAX_STRIKES;i++){ dots+='<span style="width:6px;height:6px;border-radius:50%;background:'+(i<=m.strike?'var(--st-stuck-dot)':'var(--border-strong)')+'"></span>'; }
    strikePill='<div style="margin-top:10px;display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--st-stuck-dot);font-size:11.5px;font-weight:600;color:var(--st-stuck-fg)"><span style="display:flex;gap:3px">'+dots+'</span>strike '+m.strike+' of '+MAX_STRIKES+'</div>';
  }
  var confetti = (m.type==='verified') ? confettiHTML() : '';
  return '<div style="display:flex;gap:11px;align-items:flex-start">'+
    '<span style="width:30px;height:30px;border-radius:9px;background:'+a.c+';color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+'</span>'+
    '<div style="flex:1;min-width:0">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">'+
        '<span style="font-size:13px;font-weight:600;color:var(--text)">'+esc(a.label)+'</span>'+
        '<span style="background:'+chip.bg+';color:'+chip.fg+';padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600">'+esc(chip.label)+'</span>'+
        toChip+tdChip+
        '<span style="font-size:11px;color:var(--text-3);font-family:'+MONO+'">'+esc(m.time)+'</span>'+
      '</div>'+
      '<div style="'+bubbleStyle(m.type,pass)+'">'+bodyHTML(m.body)+code+strikePill+'</div>'+confetti+
    '</div></div>';
}
function threadHTML(d){
  var items=buildThread(d);
  var inner;
  if(!items.length){
    var roles=d.roles||[]; var r0=roles[0]||'backend', r1=roles[1]||'frontend';
    inner='<div style="text-align:center;padding:50px 20px">'+
      '<div style="display:inline-flex;align-items:center;gap:9px;margin-bottom:16px">'+
        '<span style="width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-weight:700;font-size:13px">'+esc(av(r0).i)+'</span>'+
        '<span style="display:flex;gap:3px"><span style="width:4px;height:4px;border-radius:50%;background:var(--text-3)"></span><span style="width:4px;height:4px;border-radius:50%;background:var(--text-3)"></span><span style="width:4px;height:4px;border-radius:50%;background:var(--text-3)"></span></span>'+
        '<span style="width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-weight:700;font-size:13px">'+esc(av(r1).i)+'</span>'+
      '</div>'+
      '<p style="font-weight:600;font-size:15px;color:var(--text);margin:0 0 5px">No messages yet</p>'+
