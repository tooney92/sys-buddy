<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sys-buddy</title>
<!-- sys-buddy dashboard — single-file vanilla rebuild of the design prototype (SPEC §12).
     Served at /ui. Auth rides an HttpOnly sb_view cookie (set by /ui from the ?v=
     bootstrap link); fetches the read-only /api/* and receives live change
     notifications over an SSE stream (GET /api/stream). No framework, no build step. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#FAF9F7;--surface:#ffffff;--surface-2:#F5F3F0;--surface-3:#EDEAE5;
  --border:#EBE8E3;--border-strong:#DAD5CE;
  --text:#211F1C;--text-2:#6B6763;--text-3:#9C978F;
  --accent:#E0693F;--accent-2:#C4552E;--accent-soft:#FBEADF;
  --shadow:0 1px 2px rgba(40,30,20,.04),0 6px 16px rgba(40,30,20,.05);
  --st-open-bg:#EFEDEA;--st-open-fg:#6B6763;--st-open-dot:#A29D96;
  --st-proposed-bg:#E7F0FB;--st-proposed-fg:#2E6BC4;--st-proposed-dot:#3B82F6;
  --st-locked-bg:#EEE9FB;--st-locked-fg:#6D4BC4;--st-locked-dot:#8B5CF6;
  --st-live-bg:#DEF2EE;--st-live-fg:#1C8577;--st-live-dot:#14A08C;
  --st-testing-bg:#FBF0DA;--st-testing-fg:#A9720F;--st-testing-dot:#E0A22B;
  --st-verified-bg:#E1F2E3;--st-verified-fg:#2C8A3D;--st-verified-dot:#33A852;
  --st-stuck-bg:#FBE7E3;--st-stuck-fg:#BF4638;--st-stuck-dot:#DE5B4A;
  --role-backend:#5468C9;--role-frontend:#C0568C;--role-mobile:#3F9E8C;--role-designer:#B8823C;--role-system:#8A857F;
}
[data-theme="dark"]{
  --bg:#161514;--surface:#201E1D;--surface-2:#282624;--surface-3:#312E2B;
  --border:#332F2C;--border-strong:#443F3A;
  --text:#F3F1EE;--text-2:#A7A29C;--text-3:#726D68;
  --accent:#F0845C;--accent-2:#F59A77;--accent-soft:#38271F;
  --shadow:0 1px 2px rgba(0,0,0,.24),0 6px 18px rgba(0,0,0,.30);
  --st-open-bg:#2A2826;--st-open-fg:#A7A29C;--st-open-dot:#726D68;
  --st-proposed-bg:#1B2838;--st-proposed-fg:#82B2F0;--st-proposed-dot:#4B90ED;
  --st-locked-bg:#251F36;--st-locked-fg:#B79EF2;--st-locked-dot:#9B72F0;
  --st-live-bg:#152C28;--st-live-fg:#6BCCBE;--st-live-dot:#2FB3A0;
  --st-testing-bg:#2F2712;--st-testing-fg:#E6B95F;--st-testing-dot:#D9A032;
  --st-verified-bg:#182C1C;--st-verified-fg:#74CB82;--st-verified-dot:#3FB457;
  --st-stuck-bg:#301C19;--st-stuck-fg:#F08876;--st-stuck-dot:#DA6152;
  --role-backend:#7E8FE0;--role-frontend:#DB7CAC;--role-mobile:#5FBDAA;--role-designer:#D6A05E;--role-system:#9A948D;
}
body{min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'Geist',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-2)}
button{font-family:inherit}
@keyframes cfall{0%{transform:translateY(-4px) rotate(0);opacity:0}12%{opacity:1}100%{transform:translateY(30px) rotate(240deg);opacity:0}}
@keyframes pulsedot{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
@keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.1);opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ---------- design maps (ported from the prototype Component) ---------- */
var SK={open:'open',contract_proposed:'proposed',contract_locked:'locked',backend_live:'live',testing:'testing',verified:'verified',stuck:'stuck'};
var SLAB={open:'open',contract_proposed:'planning',contract_locked:'contract locked',backend_live:'backend live',testing:'testing',verified:'verified',stuck:'stuck'};
var ORDER={open:0,contract_proposed:1,contract_locked:2,backend_live:3,testing:4,verified:5};
// `broker` is not an agent seat — it's the broker's own voice, used for the
// notifications it authors (e.g. contract_locked). Neutral system colour so it never
// reads as one of the peers talking.
var RL={backend:{i:'B',c:'var(--role-backend)',label:'backend'},frontend:{i:'F',c:'var(--role-frontend)',label:'frontend'},mobile:{i:'M',c:'var(--role-mobile)',label:'mobile'},designer:{i:'D',c:'var(--role-designer)',label:'designer'},broker:{i:'SB',c:'var(--role-system)',label:'sys-buddy'}};
/* Short tags a human types instead of spelling a role out ("sm @BE ..."). Mirrors
   ROLE_TAGS in service.py — the broker is what actually resolves them; this copy exists
   so the shortcodes cheatsheet renders the list rather than hard-coding it and drifting,
   which is exactly how `upto` went missing from the cheatsheet in the first place. */
var ROLE_TAGS={be:'backend',fe:'frontend',mb:'mobile',de:'designer'};
// The 'preflight' node has no matching task state — it's a sub-phase of 'open',
// driven by per-agent readiness (see genSteps). ORDER above stays keyed on the REAL
// task states; genSteps maps real→display indices around the inserted node.
var STEPS=[['open','open'],['preflight','pre-flight assessments'],['contract_proposed','planning'],['contract_locked','locked'],['backend_live','backend live'],['testing','testing'],['verified','verified']];
/* ---------- todos (v2) ----------
   When a task has todos the stepper TRUNCATES, it does not die: `open` and `pre-flight
   assessments` stay task-level (you pair once, at the task), and the five later phases
   fan OUT into each todo. Same component, same visual language, three nodes.
   EVERY todo branch below is dead for a task with no todos — the API omits the
   `has_todos`/`todos`/`todo_rollup` keys entirely, so a pre-todo payload renders on
   exactly the code paths that shipped before. */
var STEPS_TODO=[['open','open'],['preflight','pre-flight assessments'],['todos','todos']];
/* The mini-stepper INSIDE a todo — the five dropped phases folded to four nodes, so
   nobody learns a second idiom; it is the familiar widget one level down. `testing`
   shares the `ready` node: a todo under test is still standing on the producer's
   delivery until it verifies.

   The labels name what is HAPPENING, not the event that just fired. Locking is an
   instant, not a phase — so `contract_locked` lights `building`, because that is what
   the humans are doing for the whole time the todo sits there. The old labels were a
   step behind reality: `locked` sat current while people built, and `build` only lit
   up once the producer was already live, i.e. once building was over. `ready` matches
   the shorthand the producer actually types (`ready #N`). */
var TODO_STEPS=[['planning','planning'],['building','building'],['ready','ready'],['verified','verified']];
var TODO_MARCH={open:0,contract_proposed:0,contract_locked:1,backend_live:2,testing:2,verified:3};
/* The AGREEMENT stage (todo.status) — NOT the march above. `pending` borrows the amber
   `testing` palette on purpose: it is the one row on this screen asking a human for
   something, so it reads as a request, and it is the row that carries the ⚠. */
var TODO_STATUS={pending:'testing',accepted:'proposed',contracted:'locked',verified:'verified',dropped:'open'};
var MAX_STRIKES=3;
var MONO="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace";

function av(role){ return RL[role] || {i:(role?String(role)[0].toUpperCase():'?'),c:'var(--role-system)',label:role||'system'}; }
function stateChip(s){ var k=SK[s]||'open'; return {label:SLAB[s]||s, bg:'var(--st-'+k+'-bg)', fg:'var(--st-'+k+'-fg)', dot:'var(--st-'+k+'-dot)'}; }
function methodChip(m){ var k=({GET:'proposed',POST:'live',PUT:'locked',PATCH:'testing',DELETE:'stuck'})[m]||'open'; return {bg:'var(--st-'+k+'-bg)', fg:'var(--st-'+k+'-fg)'}; }
function typeChip(type,pass){
  var map={question:['question','open'],answer:['answer','proposed'],status_update:['status','open'],
    contract_proposal:['contract proposal','locked'],contract_lock:['contract lock','locked'],
    contract_locked:['contract locked','locked'],renegotiation:['replanning','proposed'],
    deploy_confirmed:['deploy confirmed','live'],verified:['verified','verified'],stuck:['stuck','stuck'],
    /* the todo conversation (v2). Additive: no pre-todo task ever carries these types. */
    todo_proposal:['todo proposed','proposed'],todo_accept:['todo accepted','verified'],
    todo_decline:['todo declined','stuck'],todo_drop:['todo drop','open'],
    todo_dropped:['todo dropped','open']};
  var label,key;
  if(type==='test_result'){ label=pass?'test · pass':'test · fail'; key=pass?'verified':'stuck'; }
  else { var e=map[type]||['message','open']; label=e[0]; key=e[1]; }
  return {label:label, bg:'var(--st-'+key+'-bg)', fg:'var(--st-'+key+'-fg)'};
}
/* `todo` is ONE event kind carrying the specific action inside (api._event), so this
   vocabulary stays fixed as the todo actions grow. Every other palette dot is already
   spoken for, hence accent-2 — distinct from slack's accent, and not a role colour. */
function eventColor(kind){ return ({transition:'var(--st-proposed-dot)',lock:'var(--st-locked-dot)',deploy:'var(--st-live-dot)',test:'var(--st-testing-dot)',slack:'var(--accent)',token:'var(--st-open-dot)',task:'var(--st-open-dot)',todo:'var(--accent-2)'})[kind]||'var(--st-open-dot)'; }

/* small inline SVGs */
function svg(w,inner){ return '<svg width="'+w+'" height="'+w+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+inner+'</svg>'; }
var IC={
  chevR:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>',
  back:svg(15,'<path d="M15 6l-6 6 6 6"/>'),
  caret:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>',
  log:svg(14,'<path d="M4 6h16M4 12h16M4 18h10"/>'),
  warn:svg(16,'<path d="M12 9v4M12 17h.01M10.3 3.9l-8 14A2 2 0 004 21h16a2 2 0 001.7-3l-8-14a2 2 0 00-3.4 0z"/>'),
  user:svg(13,'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'),
  lockSmall:'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
  doc:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>',
  sun:svg(16,'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>'),
  moon:svg(16,'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>'),
  link:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.5.5l3-3a5 5 0 00-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 00-7.5-.5l-3 3a5 5 0 007 7l1.5-1.5"/></svg>',
  next:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>',
  /* `>_` — the Commands reference. A prompt caret, NOT a run button: the panel it opens
     is a cheatsheet of what a human types to THEIR OWN agent (D11 — this dashboard
     never acts), which is why the panel is captioned rather than the glyph carrying it. */
  term:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l4.5 5L4 17M12.5 17H20"/></svg>',
  /* The Workflows glyph deliberately ECHOES the stepper — a line with three nodes on it
     (`──●───●───●──`), the same shape stepVisual paints for the task stepper and the todo
     mini-stepper. Seeing it should read as "the thing that explains those stages".
     Not a lightbulb (that is the "tips" framing we removed), not IC.doc (documentation),
     not a branch (the flow is linear, nothing diverges). */
  flow:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 12h21"/><circle cx="4.6" cy="12" r="2.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/><circle cx="19.4" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>'
};
function dividerIcon(kind){
  if(kind==='lock') return svg(13,'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>');
  if(kind==='slack') return svg(13,'<path d="M20 6L9 17l-5-5"/>');
  if(kind==='task') return svg(13,'<path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="3"/>');
  /* transition / flow */
  return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
}

/* ---------- html escaping ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }

/* ---------- state ---------- */
/* The viewer token lives in an HttpOnly cookie (set by /ui on first load) and is
   sent automatically with same-origin /api fetches — JS neither reads nor forwards
   it. A missing/invalid token surfaces as a 401 from /api/tasks below. */
var state = {
  view:'list', taskId:null,
  theme: localStorage.getItem('sb-theme') || 'light',
  tasks:[], viewer:null, detail:null,
  loadingDetail:false,
  error:null,        // null | 'no-token' | 'unauthorized' | 'forbidden' | 'not-found' | 'network'
  expanded:{}, version:{}, eventFilter:'all', eventLogOpen:true,
  /* which todo the right column is showing, keyed by task id (like `version`) so it
     survives a poll refresh and leaving/returning to the task. Empty = the todo LIST.
     MUST appear in sig() below or selecting a todo would never re-render. */
  selectedTodo:{},
  /* which shared file the screenshot lightbox is enlarging (its id, as a string), or
     null when the overlay is closed. MUST appear in sig() below or opening/closing the
     lightbox would never re-render. Cleared on navigation (openTask/goHome). */
  lightbox:null,
  /* which slide-out reference panel is open: null | 'commands' | 'workflows'. Reference
     only — neither panel has an input or a button that calls anything (DECISIONS D11).
     MUST appear in sig() below or opening/closing it would never re-render. */
  panel:null,
  mobileTab:'thread', switcherOpen:false, isMobile: window.innerWidth<900,
  /* a desktop that is merely NARROW (>=900 so not gated, but under ~1150): the header
     is already dense, so the two reference buttons drop their text labels and the
     "last refreshed" wording collapses to its dot + tooltip. Nothing is lost, and the
     header never overflows horizontally. */
  narrow: window.innerWidth<1150,
  lastRefresh:0, refreshing:false
};
var lastSig=null;
var app=document.getElementById('app');

/* ---------- fetching ---------- */
function api(path){
  /* auth rides the HttpOnly sb_view cookie — same-origin, sent automatically */
  return fetch(path,{headers:{'Accept':'application/json'},credentials:'same-origin'});
}
function fetchTasks(){
  state.refreshing=true; patchVolatile();
  return api('/api/tasks').then(function(r){
    if(r.status===401){ state.error='unauthorized'; throw 0; }
    if(!r.ok) throw 0;
    return r.json();
  }).then(function(d){
    state.tasks=d.tasks||[]; state.viewer=d.viewer||null;
    if(state.error==='unauthorized'||state.error==='network') state.error=null;
    state.lastRefresh=Date.now();
  }).catch(function(e){
    if(state.error==null) state.error='network';
  }).then(function(){ state.refreshing=false; render(); });
}
function fetchDetail(id){
  if(!id) return Promise.resolve();
  return api('/api/task/'+encodeURIComponent(id)).then(function(r){
    if(r.status===401){ state.error='unauthorized'; throw 0; }
    if(r.status===403){ state.error='forbidden'; throw 0; }
    if(r.status===404){ state.error='not-found'; throw 0; }
    if(!r.ok) throw 0;
    return r.json();
  }).then(function(d){
    if(state.view==='task' && state.taskId===id){
      state.detail=d; state.loadingDetail=false;
      if(state.error==='forbidden'||state.error==='not-found'||state.error==='network') state.error=null;
    }
    state.lastRefresh=Date.now();
  }).catch(function(e){
    if(state.error==null) state.error='network';
  }).then(function(){ render(); });
}

/* ---------- navigation ---------- */
function openTask(id){
  state.view='task'; state.taskId=id; state.detail=null; state.loadingDetail=true;
  state.switcherOpen=false; state.mobileTab='thread'; state.lightbox=null;
  if(state.error==='not-found'||state.error==='forbidden') state.error=null;
  render(); fetchDetail(id);
}
function goHome(){ state.view='list'; state.switcherOpen=false; state.detail=null; state.taskId=null; state.lightbox=null; render(); }
function toggleTheme(){ state.theme = state.theme==='dark'?'light':'dark'; localStorage.setItem('sb-theme',state.theme); render(); }

/* ---------- style helpers ---------- */
function seg(active){ return 'padding:5px 13px;font-size:12.5px;font-weight:600;border-radius:7px;border:none;background:'+(active?'var(--surface)':'transparent')+';color:'+(active?'var(--text)':'var(--text-2)')+';box-shadow:'+(active?'var(--shadow)':'none'); }
function tabStyle(active){ return 'flex:1;padding:10px 0;font-size:13px;font-weight:600;border:none;background:transparent;cursor:pointer;color:'+(active?'var(--accent)':'var(--text-2)')+';border-bottom:'+(active?'2px solid var(--accent)':'2px solid transparent'); }
function filterStyle(active){ return 'padding:3px 10px;border-radius:7px;border:1px solid '+(active?'var(--accent)':'var(--border)')+';background:'+(active?'var(--accent-soft)':'transparent')+';color:'+(active?'var(--accent-2)':'var(--text-2)')+';font-size:11px;font-weight:600;cursor:pointer;font-family:'+MONO; }
function vBtnStyle(active){ return 'padding:4px 10px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:'+MONO+';display:flex;align-items:center;gap:4px;background:'+(active?'var(--surface)':'transparent')+';color:'+(active?'var(--text)':'var(--text-2)')+';box-shadow:'+(active?'var(--shadow)':'none'); }

/* ---------- stepper ---------- */
/* Pre-flight is done once every live agent has passed (readiness_status), with a
   fallback to the legacy `ready` bool. No agents yet → not done. */
function preflightPassed(agents){
  if(!agents||!agents.length) return false;
  return agents.every(function(a){ return a.readiness_status==='passed' || a.ready; });
}

/* ONE stepper node's circle + label colour, shared by all three steppers (the seven-node
   task stepper, the truncated three-node one, and the per-todo mini-stepper) so they are
   literally the same widget at different sizes. The glyph sizes are derived from `size`
   and reproduce the original 28px node exactly (14/8/6). */
function stepVisual(done,current,stuckStep,size){
  size=size||28;
  var chk=Math.round(size*0.5), dot=Math.round(size*0.29), pip=Math.round(size*0.215);
  var node='width:'+size+'px;height:'+size+'px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;';
  if(stuckStep) node+='background:var(--st-stuck-dot);';
  else if(done) node+='background:var(--st-verified-dot);';
  else if(current) node+='background:var(--accent);';
  else node+='background:var(--surface);border:2px solid var(--border-strong);';
  var inner;
  if(done) inner='<svg width="'+chk+'" height="'+chk+'" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2"><path d="M20 6L9 17l-5-5"/></svg>';
  else if(current) inner='<span style="width:'+dot+'px;height:'+dot+'px;border-radius:50%;background:#fff"></span><span style="position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ring 1.6s ease-out infinite"></span>';
  else if(stuckStep) inner='<span style="color:#fff;font-weight:700;font-size:'+chk+'px">!</span>';
  else inner='<span style="width:'+pip+'px;height:'+pip+'px;border-radius:50%;background:var(--border-strong)"></span>';
  return {nodeStyle:node, inner:inner,
    labelColor:(done||current)?'var(--text)':(stuckStep?'var(--st-stuck-fg)':'var(--text-3)')};
}

function genSteps(stateName, times, agents){
  times=times||{};
  var isStuck = stateName==='stuck';
  var realO = ORDER[stateName]!=null?ORDER[stateName]:0;   // index into REAL task states
  var preDone = preflightPassed(agents);
  function disp(ri){ return ri===0?0:ri+1; }               // real index → display index
  // Display frontier (into the 7-node STEPS incl. the inserted pre-flight at index 1).
  var o = isStuck ? 5 : (stateName==='open' ? 1 : disp(realO));
  var last = STEPS.length-1;
  // Pass 1: resolve done/current/stuck per node (the pre-flight node is special-cased
  // because it has no matching task state — it's driven by agent readiness).
  var meta = STEPS.map(function(s,i){
    var key=s[0];
    var stuckStep = isStuck && i===5;
    var done, current;
    if(key==='preflight'){
      done = (stateName!=='open') || preDone;
      current = stateName==='open' && !preDone && !isStuck;
    } else {
      done = i<o || (stateName==='verified' && i===o);
      current = i===o && !isStuck && stateName!=='verified';
    }
    return {done:done, current:current, stuck:stuckStep};
  });
  var reached=function(m){ return m.done||m.current||m.stuck; };
  return STEPS.map(function(s,i){
    var key=s[0], m=meta[i];
    var done=m.done, current=m.current, stuckStep=m.stuck;
    var v=stepVisual(done,current,stuckStep,28);
    var leftColor = i===0 ? 'transparent' : (reached(m) ? 'var(--st-verified-dot)' : 'var(--border-strong)');
    var rightColor = i===last ? 'transparent' : (reached(meta[i+1]) ? 'var(--st-verified-dot)' : 'var(--border-strong)');
    return {key:key, label:s[1], time:(done||current||stuckStep)?(times[key]||''):'', nodeStyle:v.nodeStyle, inner:v.inner, leftColor:leftColor, rightColor:rightColor, labelColor:v.labelColor};
  });
}

/* The THREE-node task stepper for a task WITH todos. `open` is done the moment the task
   exists; `pre-flight` keeps its per-seat meaning; the tail is the fan-out, summarised
   by todoProgressTail below. Returns the identical node shape genSteps does, so
   taskHTML's renderer is untouched. */
function genStepsTodo(d){
  var times=d.times||{};
  var roll=d.todo_rollup||{};
  var preDone=preflightPassed(d.agents);
  var complete=!!roll.complete;
  var meta=[
    {done:true,current:false},
    {done:preDone,current:!preDone},
    /* only the frontier pulses: todos can't be the live node until pre-flight passed
       (the broker locks the action tools until then, so this is belt-and-braces) */
    {done:complete,current:preDone&&!complete}
  ];
  var last=STEPS_TODO.length-1;
  var reached=function(m){ return m.done||m.current; };
  return STEPS_TODO.map(function(s,i){
    var m=meta[i], v=stepVisual(m.done,m.current,false,28);
    return {key:s[0], label:s[1], time:(s[0]==='open'?(times.open||''):''),
      nodeStyle:v.nodeStyle, inner:v.inner, labelColor:v.labelColor,
      leftColor: i===0?'transparent':(reached(m)?'var(--st-verified-dot)':'var(--border-strong)'),
      rightColor: i===last?'transparent':(reached(meta[i+1])?'var(--st-verified-dot)':'var(--border-strong)')};
  });
}

/* ---------- role avatar helper ---------- */
/* Find the live agent for a role in the current task detail, or null when the
   detail (or its agents list) is missing — matched by role, then name. */
function agentFor(role, name){
  var ags = state.detail && state.detail.agents;
  if(!ags || !ags.length) return null;
  for(var i=0;i<ags.length;i++){ if(ags[i].role===role || (name&&ags[i].name===name)) return ags[i]; }
  return null;
}
/* ---------- live presence (agent parked in wait_for_message) ---------- */
/* The broker stores an EXPIRY and the API hands us the already-computed booleans.
   DEFENSIVE: ui.html is served fresh from disk while api.py runs from memory, so a
   broker restarted mid-upgrade can serve this file against an older API with no
   `listening` fields at all. Missing → "not listening", and every badge falls back
   to exactly what shipped before (same precedent as the 1.0.1 thread-ordering fix). */
function isListening(ag){ return !!(ag && ag.listening); }
/* "42m" for the streak start; '' when the API is stale or the value is nonsense. */
function listenAgo(ag){
  var since = ag && ag.listening_since;
  if(!since) return '';
  var secs = Math.floor(Date.now()/1000 - since);
  if(!isFinite(secs) || secs < 0) return '';
  if(secs < 60) return secs+'s';
  if(secs < 3600) return Math.floor(secs/60)+'m';
  var h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60);
  return m ? h+'h '+m+'m' : h+'h';
}
function listenLabel(ag){ var d=listenAgo(ag); return d ? 'listening — '+d : 'listening'; }
var LISTEN_TIP="Parked in wait_for_message right now — new mail wakes it immediately.";
/* The same signal spelled out, for rows with room for words. '' when not listening
   (and always '' against an older API, since isListening is then false). */
function listenPill(ag){
  if(!isListening(ag)) return '';
  return '<span title="'+esc(LISTEN_TIP)+'" style="display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--st-verified-bg);color:var(--st-verified-fg);white-space:nowrap">'+
    '<span style="width:6px;height:6px;border-radius:50%;background:var(--st-verified-dot);animation:pulsedot 1.8s ease-in-out infinite;flex:none"></span>'+esc(listenLabel(ag))+'</span>';
}

/* A small corner badge on an agent's avatar. Pre-flight state first — amber 🔒 while
   they haven't passed — then it HANDS OFF: once an agent is through pre-flight the
   badge carries the live signal, a pulsing green dot while it's listening and the
   static green ✓ when it isn't. '' only when the agent is unknown (no agents list). */
var LOCK_TIP="Hasn't passed the pre-flight readiness check — can't send messages or change status yet.";
var READY_TIP="Passed the pre-flight readiness check — action tools unlocked.";
function lockBadge(role, name){
  var ag=agentFor(role, name);
  if(!ag) return '';
  if(ag.ready){
    if(isListening(ag)){
      return '<span title="'+esc(listenLabel(ag)+' · '+LISTEN_TIP)+'" style="position:absolute;bottom:-3px;right:-3px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:1.5px solid var(--surface);display:flex;align-items:center;justify-content:center">'+
        '<span style="width:8px;height:8px;border-radius:50%;background:var(--st-verified-dot);animation:pulsedot 1.8s ease-in-out infinite"></span></span>';
    }
    return '<span title="'+esc(READY_TIP)+'" style="position:absolute;bottom:-3px;right:-3px;width:13px;height:13px;border-radius:50%;background:var(--st-verified-bg);color:var(--st-verified-fg);border:1.5px solid var(--surface);display:flex;align-items:center;justify-content:center">'+
      '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></span>';
  }
  return '<span title="'+esc(LOCK_TIP)+'" style="position:absolute;bottom:-3px;right:-3px;width:13px;height:13px;border-radius:50%;background:var(--st-stuck-bg);color:var(--st-stuck-fg);border:1.5px solid var(--surface);display:flex;align-items:center;justify-content:center">'+
    '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></span>';
}
function avatarChip(role, size, fs){
  var a=av(role);
  var lock=lockBadge(role);
  return '<span title="'+esc(a.label)+'" style="position:relative;width:'+size+'px;height:'+size+'px;border-radius:7px;background:'+a.c+';color:#fff;font-size:'+fs+'px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+lock+'</span>';
}

/* ---------- pre-flight pills (under the pre-flight stepper node) ---------- */
/* One tiny pill per agent — the host/buddy status shown right under the "pre-flight
   assessments" node: green "passed", red "failed", grey "pending" (the default).
   Reads readiness_status, falling back to the legacy `ready` bool. */
function preflightStatus(ag){
  if(ag.readiness_status) return ag.readiness_status;
  return ag.ready ? 'passed' : 'pending';
}
function preflightPills(d){
  var ags=(d&&d.agents)||[];
  if(!ags.length) return '';
  var pills=ags.map(function(ag){
    var a=av(ag.role);
    var s=preflightStatus(ag);
    var cfg = s==='passed' ? {bg:'var(--st-verified-bg)',fg:'var(--st-verified-fg)',lbl:'passed'}
           : s==='failed' ? {bg:'var(--st-stuck-bg)',fg:'var(--st-stuck-fg)',lbl:'failed'}
           : {bg:'var(--st-open-bg)',fg:'var(--st-open-fg)',lbl:'pending'};
    var ic = s==='passed' ? '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M20 6L9 17l-5-5"/></svg>'
           : s==='failed' ? '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M18 6L6 18M6 6l12 12"/></svg>'
           : '<span style="width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7"></span>';
    return '<span title="'+esc(a.label)+' — '+cfg.lbl+'" style="display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;font-size:9.5px;font-weight:700;background:'+cfg.bg+';color:'+cfg.fg+';max-width:100%">'+
      '<span style="width:12px;height:12px;border-radius:4px;background:'+a.c+';color:#fff;font-size:8px;display:inline-flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+'</span>'+ic+'</span>';
  }).join('');
  return '<div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:6px;max-width:120px">'+pills+'</div>';
}

/* A labeled pre-flight row (used in the debug view, which has no stepper): each
   agent with its role label and a passed/failed/pending pill. */
function preflightRow(d){
  var ags=(d&&d.agents)||[];
  if(!ags.length) return '';
  var chips=ags.map(function(ag){
    var a=av(ag.role), s=preflightStatus(ag);
    var cfg = s==='passed' ? {bg:'var(--st-verified-bg)',fg:'var(--st-verified-fg)',lbl:'passed'}
           : s==='failed' ? {bg:'var(--st-stuck-bg)',fg:'var(--st-stuck-fg)',lbl:'failed'}
           : {bg:'var(--st-open-bg)',fg:'var(--st-open-fg)',lbl:'pending'};
    return '<div style="display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--bg);border:1px solid var(--border);border-radius:9px">'+
      avatarChip(ag.role,20,9)+'<span style="font-size:12px;font-weight:600;color:var(--text)">'+esc(a.label)+'</span>'+
      '<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:'+cfg.bg+';color:'+cfg.fg+'">'+cfg.lbl+'</span>'+
      listenPill(ag)+'</div>';
  }).join('');
  return '<div style="margin-top:14px;padding-top:13px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
    '<span style="font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)">Pre-flight</span>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+chips+'</div></div>';
}

/* ---------- pre-flight fail report (coaching panel) ---------- */
/* When an agent FAILED pre-flight, show the human exactly which questions it missed
   and the broker's hint — so they can coach it, then the agent re-runs submit_readiness.
   Rendered only when there's at least one failure; empty otherwise. */
function readinessFailPanel(d){
  var ags=((d&&d.agents)||[]).filter(function(a){ return preflightStatus(a)==='failed' && a.readiness_report; });
  if(!ags.length) return '';
  var blocks=ags.map(function(ag){
    var a=av(ag.role);
    var missed=(ag.readiness_report||[]).filter(function(r){ return !r.ok; });
    var items=missed.map(function(r){
      return '<li style="margin:0 0 6px"><span style="font-family:'+MONO+';font-size:10.5px;font-weight:700;color:var(--st-stuck-fg);background:var(--st-stuck-bg);padding:1px 6px;border-radius:5px">'+esc(r.id)+'</span> <span style="color:var(--text-2)">'+esc(r.hint||'')+'</span></li>';
    }).join('');
    return '<div style="margin:0 0 10px">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">'+avatarChip(ag.role,20,9)+
      '<span style="font-size:12.5px;font-weight:600;color:var(--text)">'+esc(a.label)+'</span>'+
      '<span style="font-size:11px;font-weight:600;color:var(--st-stuck-fg)">failed '+missed.length+' question'+(missed.length===1?'':'s')+'</span></div>'+
      '<ul style="margin:0;padding-left:2px;list-style:none;font-size:12px;line-height:1.45">'+items+'</ul></div>';
  }).join('');
  return '<details open style="margin:0 0 16px;background:var(--surface);border:1px solid var(--st-stuck-dot);border-radius:12px;box-shadow:var(--shadow);overflow:hidden">'+
    '<summary style="list-style:none;cursor:pointer;padding:11px 16px;font-size:12.5px;font-weight:700;color:var(--st-stuck-fg);display:flex;align-items:center;gap:8px;user-select:none">'+
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>Pre-flight failures — coach & retry</summary>'+
    '<div style="padding:4px 16px 14px"><p style="margin:0 0 12px;font-size:12px;color:var(--text-2)">Share the hint with the agent, then it re-runs <span style="font-family:'+MONO+'">submit_readiness</span>.</p>'+blocks+'</div></details>';
}

/* ---------- header ---------- */
function headerHTML(){
  var dark=state.theme==='dark';

  }

  /* Correction #1: static scope badge, NOT a clickable Host/Buddy toggle. */
  var scopeBadge;
  if(buddy){
    scopeBadge='<div style="display:flex;align-items:center;gap:7px;padding:5px 11px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;font-size:12px;font-weight:500;color:var(--accent-2)">'+

  } else {
    scopeBadge='<div style="display:flex;align-items:center;gap:7px;padding:5px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;font-size:12px;font-weight:500;color:var(--text-2)">'+
      '<span style="width:7px;height:7px;border-radius:50%;background:var(--st-live-dot)"></span>viewing as host · all tasks</div>';
  }

  /* Notification chip. Renders ONLY when a channel is armed — an absent chip means

     Reads viewer.notify_channels (NAMES only — a webhook URL or bot token is a bearer
     credential and never reaches the browser), so adding a channel server-side needs no
     change here. Falls back to the older slack_active boolean so a dashboard served by
     an older broker still lights up. Terminal events are what actually get posted, so

  var slackChip = '';

    || ((state.viewer && state.viewer.slack_active) ? ['slack'] : []);

    slackChip='<div title="Terminal events (verified · resolved · stuck · waiting) are posted to '+esc(label)+'" '+
      'style="display:flex;align-items:center;gap:6px;padding:5px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;font-size:12px;font-weight:500;color:var(--text-2)">'+
      '<span style="width:7px;height:7px;border-radius:50%;background:var(--st-verified-dot)"></span>'+esc(label)+'</div>';
  }

  /* "+ New task" — host only, and only inside the desktop app (the pywebview bridge

    '</div>'+
    '<span style="width:1px;height:22px;background:var(--border);flex:none"></span>';

  var refreshDot = 'var(--st-verified-dot)';
  /* The header sits ABOVE an open reference panel (which starts at HEADER_H, below it) so

    '<div data-home="1" style="display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;flex:none">'+

      '<span id="sb-refresh-dot" style="width:7px;height:7px;border-radius:50%;background:'+refreshDot+';animation:pulsedot 2.4s ease-in-out infinite"></span>'+
      ((m||state.narrow)?'':'<span id="sb-refresh-text" style="font-size:12px;color:var(--text-2);white-space:nowrap">'+refreshText()+'</span>')+
    '</div>'+

  '</div>';
}

function refreshText(){
  if(state.error) return 'connection issue';
  if(!state.lastRefresh) return 'connecting…';
  var s=Math.floor((Date.now()-state.lastRefresh)/1000);
  if(s<3) return 'Last refreshed just now';
  if(s<60) return 'Last refreshed '+s+'s ago';
  return 'Last refreshed '+Math.floor(s/60)+'m ago';
}

/* ---------- desktop-only gate ---------- */

    '</div>'+
    '<h1 style="font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0;color:var(--text)">Please switch to a desktop</h1>'+
    '<p style="font-size:14px;color:var(--text-2);margin:10px 0 0;max-width:340px;line-height:1.55">'+

/* ---------- thread (messages + interleaved broker dividers) ---------- */
function minutes(t){ if(!t||t==='—') return -1; var p=String(t).split(':'); return (+p[0])*60+(+p[1]); }
function buildThread(d){
  var items=[];
  (d.messages||[]).forEach(function(m,idx){ items.push({t:m.time, min:minutes(m.time), ts:(typeof m.ts==='number'?m.ts:null), kind:'msg', m:m, ord:idx}); });
  var DIV={task:1,transition:1,lock:1,slack:1};
  (d.events||[]).forEach(function(ev,idx){
    var evk=ev[1];
    if(!DIV[evk]) return; // deploy/test/token are shown as bubbles or belong to the log
    var mn=minutes(ev[0]); if(evk==='task') mn-=0.5; // creation sorts first within its minute
    items.push({t:ev[0], min:mn, ts:(typeof ev[3]==='number'?ev[3]:null), kind:'div', evkind:evk, text:ev[2], ord:1000+idx});
  });
  // Sort by true creation time (ts, sub-second) when the API supplies it for every
  // item; otherwise fall back to the legacy minute-granularity sort (keeps a stale
  // API — e.g. before a broker restart — from breaking the thread). `ord` breaks ties
  // stably so same-instant items keep the order the API returned them (id order).
  var allTs = items.length>0 && items.every(function(it){ return typeof it.ts==='number' && isFinite(it.ts); });
  if(allTs){ items.sort(function(a,b){ return (a.ts-b.ts) || (a.ord-b.ord); }); }
  else     { items.sort(function(a,b){ return (a.min-b.min) || (a.ord-b.ord); }); }
  return items;
}
function bubbleStyle(type,pass){
  var s='background:var(--surface-2);border:1px solid var(--border);border-radius:12px;border-top-left-radius:4px;padding:11px 13px;font-size:13.5px;line-height:1.55;color:var(--text)';
  if(type==='verified') s='background:var(--st-verified-bg);border:1px solid var(--st-verified-dot);border-radius:12px;border-top-left-radius:4px;padding:11px 13px;font-size:13.5px;line-height:1.55;color:var(--text)';
  else if(type==='test_result' && !pass) s='background:var(--surface-2);border:1px solid var(--st-stuck-dot);border-radius:12px;border-top-left-radius:4px;padding:11px 13px;font-size:13.5px;line-height:1.55;color:var(--text)';
  return s;
}
function confettiHTML(){
  var cols=['var(--accent)','var(--st-verified-dot)','var(--role-backend)','var(--st-testing-dot)','var(--role-frontend)','var(--role-mobile)','var(--accent)'];
  var delays=[0,.1,.05,.18,.12,.22,.3];
  var spans=cols.map(function(c,i){ return '<span style="width:7px;height:9px;border-radius:2px;background:'+c+';animation:cfall 1.2s ease-in '+delays[i]+'s forwards"></span>'; }).join('');
  return '<div style="position:relative;height:0;overflow:visible"><div style="position:absolute;left:6px;top:4px;display:flex;gap:7px">'+spans+'</div></div>';

    '<div style="flex:1;min-width:0">'+

    '</div></div>';
}

      }).join('');
      var errRows=(e.errors||[]).map(function(er){
        return '<div style="display:flex;gap:9px;align-items:baseline"><span style="font-family:'+MONO+';font-size:10.5px;font-weight:700;color:var(--st-stuck-fg);background:var(--st-stuck-bg);padding:2px 6px;border-radius:5px;flex:none">'+esc(er.code)+'</span><span style="font-family:'+MONO+';font-size:11.5px;color:var(--text);flex:none">'+esc(er.name)+'</span><span style="font-size:11px;color:var(--text-3);margin-left:auto;text-align:right">'+esc(er.note||'')+'</span></div>';
      }).join('');
      var reqSec=(e.request||[]).length?'<div style="margin-bottom:13px"><div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:7px">Request</div><div style="border:1px solid var(--border);border-radius:9px;overflow:hidden">'+reqRows+'</div></div>':'';
      var resSec=(e.response||[]).length?'<div style="margin-bottom:13px"><div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:7px;display:flex;justify-content:space-between"><span>Response</span><span style="color:var(--st-verified-fg);font-family:'+MONO+';text-transform:none;letter-spacing:0">'+esc(e.resStatus||'200 OK')+'</span></div><div style="border:1px solid var(--border);border-radius:9px;overflow:hidden">'+resRows+'</div></div>':'';
      var errSec=(e.errors||[]).length?'<div><div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:7px">Errors</div><div style="display:flex;flex-direction:column;gap:6px">'+errRows+'</div></div>':'';
      detail='<div style="padding:0 13px 14px;border-top:1px solid var(--border)"><p style="font-size:12.5px;color:var(--text-2);margin:11px 0 13px;line-height:1.5">'+esc(e.summary||'')+'</p>'+reqSec+resSec+errSec+'</div>';
    }
    return '<div style="border:1px solid var(--border);border-radius:11px;margin:6px;overflow:hidden">'+head+detail+'</div>';
  }).join('');

  // The base URL the consumer connects to. Load-bearing (SPEC §9) and previously
  // invisible on the dashboard — surface it so the human can see exactly where the
  // frontend will point.
  var stagingBlock = data.staging_url
    ? '<div style="margin-top:11px;display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;min-width:0"><span style="display:flex;color:var(--text-3);flex:none">'+IC.link+'</span><span style="font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);flex:none">Connect to</span><span style="font-family:'+MONO+';font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(data.staging_url)+'">'+esc(data.staging_url)+'</span></div>'
    : '';
  return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden">'+
    '<div style="padding:14px 16px;border-bottom:1px solid var(--border)">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span style="font-weight:600;font-size:14px;color:var(--text)">API contract</span>'+
      '<div style="display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:9px">'+vbtns+'</div></div>'+statusBlock+stagingBlock+'</div>'+
    '<div style="padding:6px">'+eps+'</div></div>';
}

/* ---------- todo panel (the right column, when a task has todos) ----------
   Everything from here to the event log is guarded by hasTodos(): the API omits the
   todo keys for a pre-todo task, so none of it runs and that task's right column is
   still contractHTML(d), untouched. */
function hasTodos(d){ return !!(d && d.has_todos && (d.todos||[]).length); }
function todoById(d,id){
  var ts=(d&&d.todos)||[];
  for(var i=0;i<ts.length;i++){ if(ts[i].id===id) return ts[i]; }
  return null;
}
function selectedTodo(d){ return d ? todoById(d, state.selectedTodo[d.id]) : null; }

/* The agreement stage as a chip, in the shared state palette. `stuck` is an orthogonal
   FLAG on a todo (it must not brick the other deliverables), so it overrides the label. */
function todoStatusChip(t){
  var k = t.stuck ? 'stuck' : (TODO_STATUS[t.status]||'open');
  var label = t.stuck ? 'stuck' : t.status;
  return '<span style="display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;background:var(--st-'+k+'-bg);color:var(--st-'+k+'-fg);white-space:nowrap">'+
    '<span style="width:5px;height:5px;border-radius:50%;background:var(--st-'+k+'-dot)"></span>'+esc(label)+'</span>';
}

/* "2/6 verified ⚠1" — the SAME shape on the task-list row and the panel header, so a
   host reads one rollup in both places and can triage without opening anything.
   `total` counts LIVE todos: a dropped deliverable is not work any more, so it is
   reported separately rather than padding the denominator. */
function rollupBadgeHTML(r){
  if(!r) return '';
  var warn = r.pending ? '<span title="'+r.pending+' awaiting acceptance" style="color:var(--st-testing-fg);font-weight:700">⚠'+r.pending+'</span>' : '';
  var stuck = r.stuck ? '<span title="'+r.stuck+' stuck" style="color:var(--st-stuck-fg);font-weight:700">!'+r.stuck+'</span>' : '';
  var k = r.complete ? 'verified' : 'open';
  return '<span style="display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-family:'+MONO+';font-size:11px;font-weight:600;background:var(--st-'+k+'-bg);color:var(--st-'+k+'-fg);white-space:nowrap">'+
    (r.verified||0)+'/'+(r.total||0)+' verified'+warn+stuck+'</span>';
}

/* The tail under the `todos` stepper node: the fan-out summarised as a bar + counts,
   sitting where the other nodes put their timestamp. */
function todoProgressTail(d){
  var r=d.todo_rollup;
  if(!r) return '<span style="margin-top:3px;height:12px"></span>';
  var total=r.total||0, done=r.verified||0;
  var pct = total ? Math.round(done/total*100) : 0;
  var warn = r.pending ? '<span style="font-size:10px;font-weight:700;color:var(--st-testing-fg);white-space:nowrap">⚠ '+r.pending+' awaiting acceptance</span>' : '';
  var stuck = r.stuck ? '<span style="font-size:10px;font-weight:700;color:var(--st-stuck-fg);white-space:nowrap">⚠ '+r.stuck+' stuck</span>' : '';
  var dropped = r.dropped ? '<span style="font-size:9.5px;color:var(--text-3);white-space:nowrap">'+r.dropped+' dropped</span>' : '';
  return '<div style="margin-top:7px;display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;max-width:190px">'+
    '<div style="width:100%;height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden"><div style="width:'+pct+'%;height:100%;border-radius:999px;background:var(--st-verified-dot)"></div></div>'+
    '<span style="font-size:10.5px;font-weight:600;color:var(--text-2);font-family:'+MONO+'">'+done+' of '+total+' verified</span>'+
    warn+stuck+dropped+'</div>';
}

/* ⟨#3 Login endpoint⟩ — which deliverable a message belongs to. ONE thread for the whole
   task (six threads would fragment a conversation that is genuinely one conversation, and
   you'd lose "we discussed refunds while building payments"); the chip does the grouping.
   Clicking it selects that todo in the right column. */
function todoChipHTML(id){
  var t=todoById(state.detail,id);
  if(!t) return '';
  var title=String(t.title||'');
  if(title.length>22) title=title.slice(0,21)+'…';
  return '<button data-todo="'+t.id+'" title="'+esc('todo #'+t.id+' — '+t.title)+'" style="display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-family:'+MONO+';font-size:10px;font-weight:600;color:var(--accent-2);background:transparent;border:1px solid var(--accent);cursor:pointer">⟨#'+t.id+' '+esc(title)+'⟩</button>';
}

/* The list: every todo on the task, PENDING first with a ⚠ (the API already sorts
   pending-first / dropped-last). A pending todo is the only thing on this screen blocking
   a human — everything else is progress, that one is a request. */
function todoListHTML(d){
  var rows=(d.todos||[]).map(function(t){
    var pending = t.status==='pending', dropped = t.status==='dropped';
    var parties=(t.parties||[]).map(function(p){
      var a=av(p);
      return '<span title="'+esc(a.label)+'" style="width:16px;height:16px;border-radius:5px;background:'+a.c+';color:#fff;font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+'</span>';
    }).join('');
    var note = dropped ? ('dropped'+(t.drop_reason?' — '+t.drop_reason:''))
             : t.stuck ? (t.stuck_reason||'stuck — humans notified')
             : pending ? ('awaiting '+((t.awaiting||[]).join(', ')||'acceptance'))
             : t.scope;
    var warn = pending ? '<span title="awaiting acceptance — this one is asking you for something" style="color:var(--st-testing-fg);font-size:13px;line-height:1;flex:none;padding-top:2px">⚠</span>' : '';
    return '<button data-todo="'+t.id+'" style="width:100%;display:flex;align-items:flex-start;gap:9px;padding:10px 13px;background:transparent;border:none;border-top:1px solid var(--border);cursor:pointer;text-align:left;font-family:inherit;opacity:'+(dropped?'.55':'1')+'">'+
      warn+
      '<span style="flex:1;min-width:0">'+
        '<span style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">'+
          '<span style="font-size:12.5px;font-weight:600;color:var(--text)'+(dropped?';text-decoration:line-through':'')+'">'+esc(t.title)+'</span>'+
          '<span style="font-family:'+MONO+';font-size:10px;color:var(--text-3)">#'+t.id+'</span>'+
          todoStatusChip(t)+
        '</span>'+
        '<span style="display:block;font-size:11.5px;color:var(--text-2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(note)+'</span>'+
      '</span>'+
      '<span style="display:flex;gap:3px;flex:none;padding-top:2px">'+parties+'</span>'+
      '<span style="flex:none;display:flex;padding-top:1px">'+IC.chevR+'</span></button>';
  }).join('');
  return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden">'+
    '<div style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">'+
      '<span style="font-weight:600;font-size:14px;color:var(--text)">Todos</span>'+rollupBadgeHTML(d.todo_rollup)+'</div>'+
    rows+'</div>';
}

/* The per-todo mini-stepper — genSteps' widget at 20px, one level down. */
function todoMiniStepperHTML(t){
  var o=TODO_MARCH[t.state]!=null?TODO_MARCH[t.state]:0;
  var verified = t.state==='verified';
  var last=TODO_STEPS.length-1;
  var meta=TODO_STEPS.map(function(s,i){
    return {done:(i<o)||(verified&&i===o), current:(i===o)&&!verified&&!t.stuck, stuck:!!t.stuck&&i===o};
  });
  var reached=function(m){ return m.done||m.current||m.stuck; };
  var nodes=TODO_STEPS.map(function(s,i){
    var m=meta[i], v=stepVisual(m.done,m.current,m.stuck,20);
    var lc = i===0?'transparent':(reached(m)?'var(--st-verified-dot)':'var(--border-strong)');
    var rc = i===last?'transparent':(reached(meta[i+1])?'var(--st-verified-dot)':'var(--border-strong)');
    return '<div style="display:flex;flex-direction:column;align-items:center;flex:1;position:relative">'+
      '<div style="position:absolute;top:9px;left:0;width:50%;height:2px;background:'+lc+'"></div>'+
      '<div style="position:absolute;top:9px;right:0;width:50%;height:2px;background:'+rc+'"></div>'+
      '<div style="'+v.nodeStyle+'">'+v.inner+'</div>'+
      '<span style="margin-top:5px;font-size:9.5px;font-weight:600;text-align:center;color:'+v.labelColor+'">'+esc(s[1])+'</span></div>';
  }).join('');
  return '<div style="display:flex;align-items:flex-start;padding:13px 16px 11px;border-bottom:1px solid var(--border)">'+nodes+'</div>';
}

/* ---------- "what happens next" ----------
   The one line that fixes the real failure: a human staring at a locked todo that
   won't move, with nothing on screen saying the next move is his OWN agent typing
   `ready #1`. It names WHO owes the move and the literal shorthand to type.

   The sentence is NOT composed here. `t.next` comes straight off the API
   (state.next_step), computed beside the very gates report_status enforces — so the
   dashboard can never advertise a command the broker would refuse. This function is
   presentation only; if you find yourself adding an `if(t.state===…)` here, it belongs
   in state.next_step instead. */
function nextStepHTML(t){
  var n=t.next;
  if(!n||!n.text) return '';
  /* Terminal (verified/dropped) and human-owned (three strikes) read as statements,
     not instructions — a code chip would imply something to type when there isn't. */
  var tone = n.done ? 'verified' : (n.human ? 'stuck' : null);
  var bg   = tone ? 'var(--st-'+tone+'-bg)' : 'var(--accent-soft)';
  var bd   = tone ? 'var(--st-'+tone+'-dot)' : 'var(--accent)';
  var fg   = tone ? 'var(--st-'+tone+'-fg)' : 'var(--accent-2)';
  var icon = n.done ? IC.check : (n.human ? IC.warn : IC.next);
  var label= n.done ? 'Done' : (n.human ? 'Humans' : 'Next');

  /* The literal thing to type, in the same mono chip the shortcode cheatsheet uses so
     a human recognises it as "say this to your agent". `title` carries the broker tool
     it maps to, for anyone who wants the long form. */
  function chip(c){
    if(!c) return '';
    return '<code title="'+esc(n.tool||'')+'" style="font-family:'+MONO+';font-size:11px;font-weight:700;color:var(--text);background:var(--surface);border:1px solid '+bd+';border-radius:6px;padding:1px 7px;white-space:nowrap">'+esc(c)+'</code>';
  }
  var who = n.who_label
    ? '<strong style="color:var(--text)">'+esc(n.who_label)+'</strong> '
    : '';
  var head = n.cmd
    ? who+'types '+chip(n.cmd)+(n.alt&&n.alt!==n.cmd?' <span style="color:var(--text-3)">or</span> '+chip(n.alt):'')
    : '';

  /* The sentence marks the shorthands it mentions with `backticks` — the same spelling
     the broker uses in the agent-facing errors, so ONE string serves both readers.
     Render them as mono here. ESCAPE FIRST, then substitute: esc() leaves backticks
     alone, so nothing that survives this is attacker-controlled markup. */
  var body = esc(n.text).replace(/`([^`]+)`/g, function(_, c){
    return '<code style="font-family:'+MONO+';font-size:10.5px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:0 5px;white-space:nowrap">'+c+'</code>';
  });

  return '<div style="margin:12px 16px 0;padding:10px 12px;background:'+bg+';border:1px solid '+bd+';border-radius:11px;min-width:0">'+
    '<div style="display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:'+fg+'">'+
      '<span style="display:flex">'+icon+'</span>'+label+'</div>'+
    (head?'<div style="margin-top:6px;font-size:12px;color:var(--text-2);line-height:1.9;display:flex;flex-wrap:wrap;align-items:center;gap:4px">'+head+'</div>':'')+
    '<p style="margin:6px 0 0;font-size:11.5px;color:var(--text-2);line-height:1.7;overflow-wrap:anywhere">'+body+'</p>'+
  '</div>';
}

/* HOST [Drop todo] — READ-ONLY, per DECISIONS.md D11. The dashboard NEVER issues a
   command: this prints the exact line the human types in their OWN terminal, exactly the
   way shortcodesHTML teaches every other action. There is deliberately no button and no
   write path — a leaked ?v= link must only ever be able to LOOK. Host viewers only; a
   buddy can't run a host CLI, so showing it to them would be a lie. */
function dropTodoHTML(d,t){
  if(t.status==='dropped'||t.status==='verified') return '';
  if(!(t.status==='pending'||t.stuck)) return '';
  if(!(state.viewer && state.viewer.mode!=='buddy')) return '';
  var why = t.stuck ? 'This deliverable is stuck.'
          : 'Nothing here moves until '+esc((t.awaiting||[]).join(' and ')||'every party')+' accepts.';
  var cmd = 'sys-buddy todo drop '+d.id+' '+t.id+' --reason "…"';
  return '<div style="margin:12px 16px 0;padding:11px 13px;border:1px dashed var(--border-strong);border-radius:11px">'+
    '<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--text-2)">'+
      '<span style="display:flex;color:var(--st-testing-fg)">'+IC.warn+'</span>Drop todo (host)</div>'+
    '<p style="margin:6px 0 8px;font-size:11.5px;color:var(--text-2);line-height:1.5">'+why+
      ' If it isn’t worth waiting for, drop it from your own terminal — this dashboard only ever reads.</p>'+
    '<div style="font-family:'+MONO+';font-size:11px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:pre">'+esc(cmd)+'</div></div>';
}

/* Selecting a todo swaps the panel to today's contract card scoped to THAT todo, under
   its own header + mini-stepper. Back returns to the list. */
function todoDetailHTML(d,t){
  var parties=(t.parties||[]).map(function(p){
    var a=av(p);
    var yes=(t.accepted_by||[]).indexOf(p)>=0, no=(t.declined_by||[]).indexOf(p)>=0;
    var mark = yes ? '<span style="color:var(--st-verified-fg);font-weight:700">✓</span>'
             : no  ? '<span style="color:var(--st-stuck-fg);font-weight:700">✕</span>'
             : '<span style="color:var(--text-3);font-weight:700">…</span>';
    var tip = a.label+' — '+(yes?'accepted':(no?('declined: '+((t.decline_reasons||{})[p]||'')):'awaiting acceptance'));
    return '<span title="'+esc(tip)+'" style="display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 2px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:10.5px;font-weight:600;color:var(--text-2)">'+
      '<span style="width:16px;height:16px;border-radius:5px;background:'+a.c+';color:#fff;font-size:8px;display:inline-flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+'</span>'+esc(a.label)+mark+'</span>';
  }).join('');

  var declines=Object.keys(t.decline_reasons||{}).map(function(r){
    return '<div style="font-size:11.5px;color:var(--st-stuck-fg);line-height:1.5"><strong>'+esc(r)+'</strong> declined: '+esc(t.decline_reasons[r])+'</div>';
  }).join('');
  if(declines) declines='<div style="margin:10px 16px 0;padding:8px 11px;background:var(--st-stuck-bg);border:1px solid var(--st-stuck-dot);border-radius:10px;display:flex;flex-direction:column;gap:4px">'+declines+'</div>';

  var stuckLine = t.stuck ? '<div style="margin:10px 16px 0;padding:8px 11px;background:var(--st-stuck-bg);border:1px solid var(--st-stuck-dot);border-radius:10px;font-size:11.5px;font-weight:600;color:var(--st-stuck-fg)">'+esc(t.stuck_reason||'stuck — humans notified 📣')+'</div>' : '';
  var dropLine = t.status==='dropped' ? '<div style="margin:10px 16px 0;padding:8px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:11.5px;color:var(--text-2)">Dropped by '+esc(t.dropped_by||'mutual consent')+(t.drop_reason?' — '+esc(t.drop_reason):'')+'</div>' : '';

  var strikeLine='';
  if(t.strikes>0){
    var dots='';
    for(var i=1;i<=MAX_STRIKES;i++){ dots+='<span style="width:6px;height:6px;border-radius:50%;background:'+(i<=t.strikes?'var(--st-stuck-dot)':'var(--border-strong)')+'"></span>'; }
    strikeLine='<div style="margin:10px 16px 0"><span style="display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--st-stuck-dot);font-size:11.5px;font-weight:600;color:var(--st-stuck-fg)"><span style="display:flex;gap:3px">'+dots+'</span>strike '+t.strikes+' of '+MAX_STRIKES+'</span></div>';
  }

  var head='<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px">'+
    '<div style="padding:13px 16px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--border)">'+
      '<button data-todoback="1" title="Back to all todos" style="display:flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;cursor:pointer;color:var(--text-2);flex:none">'+IC.back+'</button>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">'+
          '<span style="font-size:13.5px;font-weight:600;color:var(--text)">'+esc(t.title)+'</span>'+
          '<span style="font-family:'+MONO+';font-size:10px;color:var(--text-3)">#'+t.id+' v'+t.version+'</span>'+
          todoStatusChip(t)+'</div>'+
        '<p style="margin:6px 0 0;font-size:11.5px;color:var(--text-2);line-height:1.5">'+esc(t.scope)+'</p>'+
      '</div></div>'+
    todoMiniStepperHTML(t)+
    /* Directly under the stepper: the stepper says WHERE it is, this says what moves it. */
    nextStepHTML(t)+
    '<div style="padding:12px 16px 0;display:flex;gap:5px;flex-wrap:wrap">'+parties+'</div>'+
    declines+stuckLine+dropLine+strikeLine+dropTodoHTML(d,t)+
    '<div style="height:14px"></div></div>';

  /* the SAME contract card the task view has always rendered, scoped to this todo */
  return head+contractHTML({id:d.id+'#'+t.id, contract:t.contract});
}

function todoPanelHTML(d){
  var t=selectedTodo(d);
  return t ? todoDetailHTML(d,t) : todoListHTML(d);
}

/* ---------- event log ---------- */
function eventLogHTML(d){
  /* `slack` stays for events written before notifications went multi-channel; new rows
   are `notify`. Dropping it would make old rows unfilterable. */
  var FILTERS=['all','transition','lock','deploy','test','notify','slack','token'];
  /* `todo` joins the vocabulary only for a task that HAS todos (incl. one whose todos
     were all dropped — its log still carries them), so a pre-todo task's filter row is
     exactly the row that shipped. */
  if(d && (d.todos||[]).length) FILTERS=FILTERS.concat(['todo']);
  var filter=state.eventFilter;
  var fbtns=FILTERS.map(function(f){ return '<button data-filter="'+f+'" style="'+filterStyle(filter===f)+'">'+f+'</button>'; }).join('');
  var evs=(d.events||[]).filter(function(e){ return filter==='all'||e[1]===filter; });
  var rows;
  if(evs.length){
    rows=evs.map(function(ev){
      return '<div style="display:flex;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid var(--border)">'+
        '<span style="font-family:'+MONO+';font-size:11.5px;color:var(--text-3);width:48px;flex:none">'+esc(ev[0])+'</span>'+
        '<span style="display:inline-flex;align-items:center;gap:7px;width:112px;flex:none;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--text-2)"><span style="width:7px;height:7px;border-radius:2px;background:'+eventColor(ev[1])+';flex:none"></span>'+esc(String(ev[1]).toUpperCase())+'</span>'+
        '<span style="font-size:12.5px;color:var(--text);font-family:'+MONO+';min-width:0;overflow:hidden;text-overflow:ellipsis">'+esc(ev[2])+'</span></div>';
    }).join('');
  } else {
    rows='<div style="text-align:center;padding:34px 20px;font-size:13px;color:var(--text-2)">Nothing logged for this filter.</div>';
  }
  return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-top:16px">'+
    '<div style="padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
      '<span style="font-weight:600;font-size:14px;color:var(--text);display:flex;align-items:center;gap:8px"><span style="color:var(--text-2);display:flex">'+IC.log+'</span>Event log</span>'+
      '<div style="flex:1"></div><div style="display:flex;gap:5px;flex-wrap:wrap">'+fbtns+'</div></div>'+
    '<div style="max-height:320px;overflow-y:auto">'+rows+'</div></div>';
}

function debugTaskHTML(d){
