      '</div>'+
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none">'+
        '<span data-last="'+esc(t.id)+'" style="font-size:12.5px;color:var(--text-2);white-space:nowrap">'+esc(t.last||'')+'</span>'+strike+
      '</div>'+IC.chevR+'</div>';
  }).join('');
  /* "in flight" means STILL RUNNING, so it counts only the tasks that are — the header
     used to print state.tasks.length, i.e. every row on the page, so a finished board of
     ten `verified`/`stuck`/`resolved` tasks announced "10 in flight". A `confirmed`
     engagement is the sharpest case: the client has signed it off and you have invoiced. */
  var inFlight = state.tasks.filter(function(t){ return !TERMINAL[t.state]; }).length;
  return '<div style="max-width:1040px;margin:0 auto;padding:30px 20px 70px">'+
    '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">'+
      '<h1 style="font-size:23px;font-weight:700;letter-spacing:-.025em;margin:0;color:var(--text)">Tasks</h1>'+
      '<span style="font-size:13px;color:var(--text-2)">'+inFlight+' in flight</span></div>'+
    '<p style="margin:6px 0 24px;font-size:14px;color:var(--text-2);max-width:560px">'+TASKS_BLURB+'</p>'+
    '<div style="display:flex;flex-direction:column;gap:10px">'+rows+'</div></div>';
}

/* ---------- thread (messages + interleaved broker dividers) ---------- */
function minutes(t){ if(!t||t==='—') return -1; var p=String(t).split(':'); return (+p[0])*60+(+p[1]); }
function buildThread(d){
  var items=[];
  (d.messages||[]).forEach(function(m,idx){ items.push({t:m.time, min:minutes(m.time), ts:(typeof m.ts==='number'?m.ts:null), kind:'msg', m:m, ord:idx}); });
  var DIV={task:1,transition:1,lock:1,slack:1};
  (d.events||[]).forEach(function(ev,idx){
    var evk=ev[1];
    if(!DIV[evk]) return; // deploy/test/token are shown as bubbles or belong to the log
    var mn=minutes(ev[0]); if(evk==='task') mn-=0.5; // creation sorts first within its minute
    items.push({t:ev[0], min:mn, ts:(typeof ev[3]==='number'?ev[3]:null), kind:'div', evkind:evk, text:ev[2], ord:1000+idx});
  });
  // Sort by true creation time (ts, sub-second) when the API supplies it for every
  // item; otherwise fall back to the legacy minute-granularity sort (keeps a stale
  // API — e.g. before a broker restart — from breaking the thread). `ord` breaks ties
  // stably so same-instant items keep the order the API returned them (id order).
  var allTs = items.length>0 && items.every(function(it){ return typeof it.ts==='number' && isFinite(it.ts); });
  if(allTs){ items.sort(function(a,b){ return (a.ts-b.ts) || (a.ord-b.ord); }); }
  else     { items.sort(function(a,b){ return (a.min-b.min) || (a.ord-b.ord); }); }
  return items;
}
function bubbleStyle(type,pass){
  var s='background:var(--surface-2);border:1px solid var(--border);border-radius:12px;border-top-left-radius:4px;padding:11px 13px;font-size:13.5px;line-height:1.55;color:var(--text)';
  if(type==='verified') s='background:var(--st-verified-bg);border:1px solid var(--st-verified-dot);border-radius:12px;border-top-left-radius:4px;padding:11px 13px;font-size:13.5px;line-height:1.55;color:var(--text)';
  else if(type==='test_result' && !pass) s='background:var(--surface-2);border:1px solid var(--st-stuck-dot);border-radius:12px;border-top-left-radius:4px;padding:11px 13px;font-size:13.5px;line-height:1.55;color:var(--text)';
  return s;
}
function confettiHTML(){
  var cols=['var(--accent)','var(--st-verified-dot)','var(--role-backend)','var(--st-testing-dot)','var(--role-frontend)','var(--role-mobile)','var(--accent)'];
  var delays=[0,.1,.05,.18,.12,.22,.3];
  var spans=cols.map(function(c,i){ return '<span style="width:7px;height:9px;border-radius:2px;background:'+c+';animation:cfall 1.2s ease-in '+delays[i]+'s forwards"></span>'; }).join('');
  return '<div style="position:relative;height:0;overflow:visible"><div style="position:absolute;left:6px;top:4px;display:flex;gap:7px">'+spans+'</div></div>';
}
function threadItemHTML(it){
  if(it.kind==='div'){
    var col=eventColor(it.evkind);
    return '<div style="display:flex;align-items:center;gap:12px;padding:1px 0">'+
      '<div style="flex:1;height:1px;background:var(--border)"></div>'+
      '<div style="display:flex;align-items:center;gap:7px;white-space:nowrap">'+
        '<span style="color:'+col+';display:flex">'+dividerIcon(it.evkind)+'</span>'+
        '<span style="font-family:'+MONO+';font-size:11px;color:var(--text-3)">'+esc(it.t)+'</span>'+
        '<span style="color:var(--text-3)">·</span>'+
        '<span style="font-size:12px;color:var(--text-2);font-weight:500">'+esc(it.text)+'</span>'+
      '</div><div style="flex:1;height:1px;background:var(--border)"></div></div>';
  }
  var m=it.m;
  // an agent 'stuck' message renders as the centered stuck pill (prototype sysStuck)
  if(m.type==='stuck'){
    return '<div style="display:flex;justify-content:center;padding:2px 0">'+
      '<div style="display:flex;align-items:center;gap:9px;background:var(--st-stuck-bg);color:var(--st-stuck-fg);border:1px solid var(--st-stuck-dot);padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:600;text-align:center">'+
      '<span style="font-family:'+MONO+';font-size:11px;opacity:.8">'+esc(m.time)+'</span>'+esc(m.body)+'</div></div>';
  }
  var pass = (m.type==='test_result') ? (m.strike==null) : false;
  var chip=typeChip(m.type,pass);
  var a=avSeat(m.role);
  // directed message: a `→ role` chip tinted with the target role's color (broadcast/null = no chip)
  var toChip='';
  if(m.to_role){
    var ta=av(m.to_role);
    toChip='<span title="directed to '+esc(ta.label)+'" style="display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-family:'+MONO+';font-size:10px;font-weight:600;color:'+ta.c+';background:transparent;border:1px solid '+ta.c+'">→ '+esc(ta.label)+'</span>';
  }
  /* ⟨todo⟩ chip: which deliverable this message belongs to. The API adds `todo` ONLY
     when the message names one, so a pre-todo thread renders with no chip at all. */
  var tdChip = (m.todo!=null) ? todoChipHTML(m.todo) : '';
  var code = m.code ? '<pre style="margin:11px 0 2px;background:var(--surface-3);border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-family:'+MONO+';font-size:11.5px;line-height:1.55;color:var(--text-2);overflow-x:auto;white-space:pre">'+esc(m.code)+'</pre>' : '';
  var strikePill='';
  if(m.type==='test_result' && m.strike!=null){
    var dots='';
    for(var i=1;i<=MAX_STRIKES;i++){ dots+='<span style="width:6px;height:6px;border-radius:50%;background:'+(i<=m.strike?'var(--st-stuck-dot)':'var(--border-strong)')+'"></span>'; }
    strikePill='<div style="margin-top:10px;display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--st-stuck-dot);font-size:11.5px;font-weight:600;color:var(--st-stuck-fg)"><span style="display:flex;gap:3px">'+dots+'</span>strike '+m.strike+' of '+MAX_STRIKES+'</div>';
  }
  var confetti = (m.type==='verified') ? confettiHTML() : '';
  return '<div style="display:flex;gap:11px;align-items:flex-start">'+
    '<span style="width:30px;height:30px;border-radius:9px;background:'+a.c+';color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+'</span>'+
    '<div style="flex:1;min-width:0">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">'+
        '<span style="font-size:13px;font-weight:600;color:var(--text)">'+esc(a.label)+'</span>'+
        '<span style="background:'+chip.bg+';color:'+chip.fg+';padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600">'+esc(chip.label)+'</span>'+
        toChip+tdChip+
        '<span style="font-size:11px;color:var(--text-3);font-family:'+MONO+'">'+esc(m.time)+'</span>'+
      '</div>'+
      '<div style="'+bubbleStyle(m.type,pass)+'"><span>'+esc(m.body)+'</span>'+code+strikePill+'</div>'+confetti+
    '</div></div>';
}
function threadHTML(d){
  var items=buildThread(d);
  var inner;
  if(!items.length){
    var roles=d.roles||[]; var r0=roles[0]||'backend', r1=roles[1]||'frontend';
    inner='<div style="text-align:center;padding:50px 20px">'+
      '<div style="display:inline-flex;align-items:center;gap:9px;margin-bottom:16px">'+
        '<span style="width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-weight:700;font-size:13px">'+esc(av(r0).i)+'</span>'+
        '<span style="display:flex;gap:3px"><span style="width:4px;height:4px;border-radius:50%;background:var(--text-3)"></span><span style="width:4px;height:4px;border-radius:50%;background:var(--text-3)"></span><span style="width:4px;height:4px;border-radius:50%;background:var(--text-3)"></span></span>'+
        '<span style="width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-weight:700;font-size:13px">'+esc(av(r1).i)+'</span>'+
      '</div>'+
      '<p style="font-weight:600;font-size:15px;color:var(--text);margin:0 0 5px">No messages yet</p>'+
      '<p style="font-size:13.5px;color:var(--text-2);margin:0">Your buddies haven’t started talking.</p></div>';
  } else {
    inner=items.map(threadItemHTML).join('');
  }
  var avs=castChips(d,22,10);
  // Spell the presence out next to the avatars — one pill per listening agent (none
  // when nobody is parked, or when the API predates the field).
  var lps=((d&&d.agents)||[]).filter(isListening).map(listenPill).join('');
  return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden">'+
    '<div style="padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">'+
      '<span style="font-weight:600;font-size:14px;color:var(--text)">Message thread</span>'+
      '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+lps+
        '<div title="'+esc(ROLE_COLOR_TIP)+'" style="display:flex;gap:4px">'+avs+'</div></div></div>'+
    threadLegendHTML()+
    '<div style="padding:20px 18px;display:flex;flex-direction:column;gap:17px;max-height:640px;overflow-y:auto">'+inner+'</div></div>';
}

/* ---------- thread legend (the old "Tips" items, rehomed) ----------
   These three lines used to sit in a collapsed "Tips" card at the very bottom of the page,
   which is nowhere near the thing they explain. They are LEGEND, not workflow, so they did
   not move into the Workflows panel either — they live here, one row under the thread
   header, inches from the avatars they decode and the `→ role` chips they define. The test
   this has to pass: someone who sees a `→ designer` chip can learn what it means without
   opening anything. */
/* Deliberately NOT a list of role names. A task can declare any cast — two backends and
   a QA is as valid as backend+frontend — so an enumeration here goes stale the moment
   someone adds a seat, and sat contradicting a `qa` avatar rendered right beside it. What
   the viewer actually needs is the two rules the row encodes: colour means type, ×N means
   several seats of that type. */
var ROLE_COLOR_TIP='Roles are colour-coded — one colour per role type, and ×N marks several seats of the same type.';
function roleDotsHTML(){
  var dot='width:7px;height:7px;border-radius:50%;flex:none';
  return ['backend','frontend','mobile','designer'].map(function(r){
    return '<span title="'+esc(r)+'" style="'+dot+';background:var(--role-'+r+')"></span>';
  }).join('');
}
function threadLegendHTML(){
  /* No `·` separators between the items: the row WRAPS on a narrow desktop and a
     separator that lands at the end of a line reads as a dangling bullet. Gap does the
     same job and survives the wrap. */
  return '<div style="padding:8px 18px;border-bottom:1px solid var(--border);background:var(--surface-2);'+
      'display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;font-size:11px;color:var(--text-2);line-height:1.5">'+
    '<span title="'+esc(ROLE_COLOR_TIP)+'" style="display:inline-flex;align-items:center;gap:6px">'+
      '<span style="display:inline-flex;gap:3px;flex:none">'+roleDotsHTML()+'</span>Roles are colour-coded</span>'+
    '<span>Messages broadcast to everyone on the task by default</span>'+
    '<span style="display:inline-flex;align-items:center;gap:6px">'+
      '<span style="font-family:'+MONO+';font-size:10px;font-weight:600;color:var(--text);border:1px solid var(--border-strong);border-radius:999px;padding:1px 7px;white-space:nowrap">→ role</span>'+
      'means it went to that one role only</span>'+
  '</div>';
}

/* http — the endpoint table, unchanged: a method chip, a path, and the request /
   response / errors detail behind a caret. `data-ep` keys the expansion by
   chain:version:index, so the same endpoint expanded on a todo panel and on the task
   card stay independent. */
function endpointUnitsHTML(d, selId, units){
  return units.map(function(e,i){
    var key=d.id+':'+selId+':'+i;
    var expanded=!!state.expanded[key];
    var mc=methodChip(e.method);
    var head='<button data-ep="'+esc(key)+'" style="width:100%;display:flex;align-items:center;gap:9px;padding:10px 11px;background:transparent;border:none;cursor:pointer;text-align:left;font-family:inherit">'+
      '<span style="background:'+mc.bg+';color:'+mc.fg+';font-family:'+MONO+';font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;letter-spacing:.03em;flex:none">'+esc(e.method)+'</span>'+
      '<span style="font-family:'+MONO+';font-size:12.5px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">'+esc(e.path)+'</span>'+
      '<span style="display:inline-flex;transition:transform .15s;transform:rotate('+(expanded?'90deg':'0')+');color:var(--text-3)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></span></button>';
    var detail='';
    if(expanded){
      var reqRows=(e.request||[]).map(function(f){
        var star = f.req ? '<span style="color:var(--accent)">*</span>':'';
        return '<div style="display:flex;gap:10px;padding:7px 11px;align-items:baseline;border-bottom:1px solid var(--border)"><span style="font-family:'+MONO+';font-size:12px;color:var(--text);font-weight:500">'+esc(f.n)+star+'</span><span style="font-family:'+MONO+';font-size:10.5px;color:var(--role-backend)">'+esc(f.t)+'</span><span style="font-size:11px;color:var(--text-3);margin-left:auto;text-align:right">'+esc(f.note||'')+'</span></div>';
      }).join('');
      var resRows=(e.response||[]).map(function(f){
        return '<div style="display:flex;gap:10px;padding:7px 11px;align-items:baseline;border-bottom:1px solid var(--border)"><span style="font-family:'+MONO+';font-size:12px;color:var(--text);font-weight:500">'+esc(f.n)+'</span><span style="font-family:'+MONO+';font-size:10.5px;color:var(--role-backend)">'+esc(f.t)+'</span><span style="font-size:11px;color:var(--text-3);margin-left:auto;text-align:right">'+esc(f.note||'')+'</span></div>';
      }).join('');
      var errRows=(e.errors||[]).map(function(er){
        return '<div style="display:flex;gap:9px;align-items:baseline"><span style="font-family:'+MONO+';font-size:10.5px;font-weight:700;color:var(--st-stuck-fg);background:var(--st-stuck-bg);padding:2px 6px;border-radius:5px;flex:none">'+esc(er.code)+'</span><span style="font-family:'+MONO+';font-size:11.5px;color:var(--text);flex:none">'+esc(er.name)+'</span><span style="font-size:11px;color:var(--text-3);margin-left:auto;text-align:right">'+esc(er.note||'')+'</span></div>';
      }).join('');
      var reqSec=(e.request||[]).length?'<div style="margin-bottom:13px"><div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:7px">Request</div><div style="border:1px solid var(--border);border-radius:9px;overflow:hidden">'+reqRows+'</div></div>':'';
      var resSec=(e.response||[]).length?'<div style="margin-bottom:13px"><div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:7px;display:flex;justify-content:space-between"><span>Response</span><span style="color:var(--st-verified-fg);font-family:'+MONO+';text-transform:none;letter-spacing:0">'+esc(e.resStatus||'200 OK')+'</span></div><div style="border:1px solid var(--border);border-radius:9px;overflow:hidden">'+resRows+'</div></div>':'';
      var errSec=(e.errors||[]).length?'<div><div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:7px">Errors</div><div style="display:flex;flex-direction:column;gap:6px">'+errRows+'</div></div>':'';
      detail='<div style="padding:0 13px 14px;border-top:1px solid var(--border)"><p style="font-size:12.5px;color:var(--text-2);margin:11px 0 13px;line-height:1.5">'+esc(e.summary||'')+'</p>'+reqSec+resSec+errSec+'</div>';
    }
    return '<div style="border:1px solid var(--border);border-radius:11px;margin:6px;overflow:hidden">'+head+detail+'</div>';
  }).join('');
}

/* ---------- contract KINDS (the view half) ----------
   A contract is ≥1 NAMED UNIT with attributes — it is not always an API. What a unit
   IS changes per kind; everything else (versions, signatures, lock, staging_url) does
   not, which is why one panel renders all four.

   The broker infers the kind from the spec's unit key (`endpoints` → http, `types` →
   schema, `screens` → ui, `criteria` → none) and sends it as `data.kind` alongside
   `data.units`. This page NEVER re-derives it: a second copy of that mapping in the
   browser is a copy that drifts from the validator. All that lives here is the view —
   a card title and a unit renderer. Adding a kind is a row here and a row in
   contracts.KINDS.

   `http` is the fallback for an unknown/absent kind because every contract written
   before kinds existed is one — an older broker's payload still renders. */
var CONTRACT_KINDS={
  http:  {title:'API contract',        units:endpointUnitsHTML},
  schema:{title:'Schema contract',     units:typeUnitsHTML},
  ui:    {title:'UI contract',         units:screenUnitsHTML},
  none:  {title:'Acceptance criteria', units:criteriaUnitsHTML}
};
function contractKind(data){ return CONTRACT_KINDS[data&&data.kind] || CONTRACT_KINDS.http; }
/* The units to render. `units` is the kind-agnostic list the broker sends; `endpoints`
   is the fallback for a payload from a broker that predates kinds, where http units
   only ever arrived under that key. */
function contractUnits(data){ return (data&&data.units) || (data&&data.endpoints) || []; }

/* One bordered block, the shell every non-http unit shares. */
function unitBlock(inner){
  return '<div style="border:1px solid var(--border);border-radius:11px;margin:6px;overflow:hidden">'+inner+'</div>';
}
/* A unit's NAME. Naming is what makes a contract checkable ("does ForgotPassword exist,
   with those states?"), so an unnamed unit says so rather than rendering a blank row. */
function unitName(u){
  var n=(u&&(u.name||u.n));
  return '<span style="font-family:'+MONO+';font-size:12.5px;font-weight:600;color:var(--text)">'+
    (n?esc(n):'<span style="color:var(--text-3);font-style:italic">unnamed</span>')+'</span>';
}
function unitCount(n,word){
  return '<span style="font-size:11px;color:var(--text-3);margin-left:auto;flex:none">'+n+' '+esc(word)+(n===1?'':'s')+'</span>';
}
function unitHead(inner){
  return '<div style="display:flex;align-items:center;gap:9px;padding:10px 11px">'+inner+'</div>';
}

/* schema — a named type and its fields. BOTH spellings of a field are read: the terse
   `n`/`t` is the house wire format endpoint request/response rows have always used, and
   the validator accepts either, so a renderer that read only one would silently drop
   half the real contracts. */
function typeUnitsHTML(d, selId, units){
  return units.map(function(t){
    var fields=(t&&t.fields)||[];
    var rows=fields.map(function(f){
      var star=(f&&(f.req||f.required))?'<span style="color:var(--accent)">*</span>':'';
      return '<div style="display:flex;gap:10px;padding:7px 11px;align-items:baseline;border-top:1px solid var(--border)">'+
        '<span style="font-family:'+MONO+';font-size:12px;color:var(--text);font-weight:500">'+esc((f&&(f.name||f.n))||'')+star+'</span>'+
        '<span style="font-family:'+MONO+';font-size:10.5px;color:var(--role-backend)">'+esc((f&&(f.type||f.t))||'')+'</span>'+
        '<span style="font-size:11px;color:var(--text-3);margin-left:auto;text-align:right">'+esc((f&&f.note)||'')+'</span></div>';
    }).join('');
    return unitBlock(unitHead(unitName(t)+unitCount(fields.length,'field'))+rows);
  }).join('');
}

/* ui — a named screen/component and the states it can be in. The states are the
   agreement; a screen with a name and nothing else is a wish. */
function screenUnitsHTML(d, selId, units){
  return units.map(function(s){
    var states=((s&&s.states)||[]).map(function(st){
      return '<span style="display:inline-flex;align-items:center;font-family:'+MONO+';font-size:11px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:2px 9px">'+esc(st)+'</span>';
    }).join('');
    var note=(s&&(s.note||s.summary))
      ? '<p style="font-size:12px;color:var(--text-2);margin:0 11px 9px;line-height:1.5">'+esc(s.note||s.summary)+'</p>' : '';
    return unitBlock(
      unitHead(unitName(s)+unitCount(((s&&s.states)||[]).length,'state'))+note+
      '<div style="display:flex;flex-wrap:wrap;gap:5px;padding:0 11px 11px">'+states+'</div>');
  }).join('');
}

/* none — the kind with no interface to describe is NOT the kind with no contract: it is
   a checklist, because "this is how we have built" has to stay checkable. Criteria are
   plain strings; an object is tolerated so a hand-written spec still renders. */
function criteriaUnitsHTML(d, selId, units){
  return units.map(function(c){
    var text=(typeof c==='string')?c:((c&&(c.text||c.name))||'');
    return unitBlock('<div style="display:flex;gap:9px;padding:10px 11px;align-items:flex-start">'+
      '<span style="flex:none;color:var(--text-3);margin-top:1px">'+IC.check+'</span>'+
      '<span style="font-size:12.5px;color:var(--text);line-height:1.5;min-width:0">'+esc(text)+'</span></div>');
  }).join('');
}

/* ---------- contract panel ----------
   `d` needs only `id` and `contract`. The per-todo panel passes a SYNTHETIC
   {id:'<task>#<todo>', contract:<todo.contract>} so a todo's version selection and
   expanded endpoints are keyed apart from the task-level chain while rendering through
   this one renderer — the todo's contract is the same shape, one level down. */
function contractHTML(d){
  var c=d.contract||{exists:false};
  var body;
  if(!c.exists){
    /* No contract means no KIND yet — nobody has proposed, so nothing has said whether
       this is endpoints, screens, types or criteria. "API contract" would be a guess,
       and the wrong one for three of the four kinds; the header only names the kind
       once a proposal has named it. */
    body='<div style="padding:14px 16px;border-bottom:1px solid var(--border)"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span style="font-weight:600;font-size:14px;color:var(--text)">Contract</span></div></div>'+
      '<div style="text-align:center;padding:40px 22px">'+
      '<div style="width:38px;height:38px;border-radius:11px;background:var(--surface-2);border:1px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--text-3)">'+IC.doc+'</div>'+
      '<p style="font-weight:600;font-size:14px;color:var(--text);margin:0 0 4px">No contract yet</p>'+
      '<p style="font-size:13px;color:var(--text-2);margin:0">Waiting on the first proposal from a buddy.</p></div>';
    return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden">'+body+'</div>';
  }
  var selId = state.version[d.id] || c.default || (c.versions[0]&&c.versions[0].id);
  var vbtns = c.versions.map(function(v){
    /* data-vkey carries WHICH chain this button selects a version for — the task's, or
       one todo's. bind() falls back to state.taskId, so the task card is unchanged. */
    return '<button data-version="'+esc(v.id)+'" data-vkey="'+esc(d.id)+'" style="'+vBtnStyle(v.id===selId)+';cursor:pointer">'+(v.locked?IC.lockSmall:'')+esc(v.id)+'</button>';
  }).join('');
  var data = (c.data&&c.data[selId]) || {locked:false,signed:[],units:[],endpoints:[]};
  var kindView = contractKind(data);
  var draft = !data.locked;
  var statusBlock='';
  if(draft){
    statusBlock='<div style="margin-top:11px;display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px dashed var(--border-strong);border-radius:10px;font-size:12px;color:var(--text-2)"><span style="width:8px;height:8px;border-radius:50%;border:1.5px dashed var(--text-3)"></span>Draft — awaiting signatures</div>';
  } else if((data.signed||[]).length){
    var chips=(data.signed||[]).map(function(sg){
      var a=avSeat(sg.role);
      return '<span title="'+esc(seatIdentity(sg.role, true))+'" style="display:inline-flex;align-items:center;gap:6px;max-width:100%;background:var(--st-verified-bg);border-radius:999px;padding:3px 10px 3px 3px;font-size:11px;color:var(--st-verified-fg);font-weight:600">'+
        '<span style="width:18px;height:18px;border-radius:6px;background:'+a.c+';color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+'</span>'+
        '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(seatIdentity(sg.role))+'</span>'+
        '<span style="font-family:'+MONO+';opacity:.75;flex:none">'+esc(sg.time)+'</span></span>';
    }).join('');
    statusBlock='<div style="margin-top:11px"><div style="font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);display:flex;align-items:center;gap:6px;margin-bottom:8px"><span style="color:var(--st-verified-fg);display:flex">'+dividerIcon('lock')+'</span>Locked · signed by all parties</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+chips+'</div></div>';
  }

  var eps=kindView.units(d, selId, contractUnits(data));

  // Where the consumer connects. Load-bearing (SPEC §9), and it is the HOST's value,
  // not part of the signed shape — resolved live from the task (or this deliverable's
  // override) on every poll, so re-pointing a tunnel updates this line and moves no
  // contract, version or signature. A `staging_url_at_lock` that DIFFERS is shown
  // beneath it: "we point here now, we signed against that" are two facts, and
  // collapsing them into one string is how a stale target hides in plain sight.
  var stale = data.staging_url_at_lock && data.staging_url_at_lock!==data.staging_url
    ? '<div style="margin-top:6px;font-size:10.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(data.staging_url_at_lock)+'">signed against <span style="font-family:'+MONO+'">'+esc(data.staging_url_at_lock)+'</span> — the target moved, the contract did not</div>'
    : '';
  var stagingBlock = data.staging_url
    ? '<div style="margin-top:11px;padding:8px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;min-width:0"><div style="display:flex;align-items:center;gap:9px;min-width:0"><span style="display:flex;color:var(--text-3);flex:none">'+IC.link+'</span><span style="font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);flex:none">Connect to</span><span style="font-family:'+MONO+';font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(data.staging_url)+'">'+esc(data.staging_url)+'</span></div>'+stale+'</div>'
    : '';
  return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden">'+
    '<div style="padding:14px 16px;border-bottom:1px solid var(--border)">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span style="font-weight:600;font-size:14px;color:var(--text)">'+esc(kindView.title)+'</span>'+
      '<div style="display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:9px">'+vbtns+'</div></div>'+statusBlock+stagingBlock+'</div>'+
    '<div style="padding:6px">'+eps+'</div></div>';
}

/* ---------- todo panel (the right column, when a task has todos) ----------
   Everything from here to the event log is guarded by hasTodos(): the API omits the
   todo keys for a pre-todo task, so none of it runs and that task's right column is
   still contractHTML(d), untouched. */
function hasTodos(d){ return !!(d && d.has_todos && (d.todos||[]).length); }
function todoById(d,id){
  var ts=(d&&d.todos)||[];
  for(var i=0;i<ts.length;i++){ if(ts[i].id===id) return ts[i]; }
  return null;
}
function selectedTodo(d){ return d ? todoById(d, state.selectedTodo[d.id]) : null; }
/* The number a HUMAN types: `todos.number`, per task, starting at 1 — NOT the row's
   `id`, which is global and would print `#7` where the human types `#1`. Every `#` on
   screen and every command string this page prints goes through here; `id` stays for
   internal keying only (data- attributes, lookups, the contract card's version key).
   Falls back to `id` so a payload from a broker that predates the field still renders a
   number rather than `#undefined`. */
function todoNo(t){ return t && t.number!=null ? t.number : (t ? t.id : ''); }

/* The agreement stage as a chip — rendered ONLY when it says something the stepper
   cannot, which is the whole reason a todo carries two state fields.

   A todo has `status` (the AGREEMENT: pending → accepted → contracted → verified) and
   `state` (the MARCH: open → contract_proposed → contract_locked → backend_live →
   testing → verified). Showing both side by side was the single biggest source of
   confusion about this screen: `accepted` sits under a stepper reading "planning",
   `contracted` under "building", `verified` under "verified" — the same fact in two
   vocabularies, inviting the reader to hunt for a difference that isn't there.

   So the march wins: the stepper plus the Next line carry it. The chip survives only
   for the states the march genuinely cannot express —
     · `pending`  — the march maps BOTH `open` and `contract_proposed` to node 0, so
                    "waiting on someone to accept the scope" is invisible there, and it
                    is the one row on this screen blocking a human;
     · `dropped`  — no march equivalent at all;
     · `stuck`    — an orthogonal FLAG (a stuck deliverable must not brick the others),
                    so it overrides the label wherever it appears.
   Everything else returns ''. */
var TODO_STATUS_SHOWN = {pending:1, dropped:1};
function todoStatusChip(t){
  if(!t.stuck && !TODO_STATUS_SHOWN[t.status]) return '';
  var k = t.stuck ? 'stuck' : (TODO_STATUS[t.status]||'open');
  var label = t.stuck ? 'stuck' : t.status;
  return '<span style="display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;background:var(--st-'+k+'-bg);color:var(--st-'+k+'-fg);white-space:nowrap">'+
    '<span style="width:5px;height:5px;border-radius:50%;background:var(--st-'+k+'-dot)"></span>'+esc(label)+'</span>';
}

/* "2/6 verified ⚠1" — the SAME shape on the task-list row and the panel header, so a
   host reads one rollup in both places and can triage without opening anything.
   `total` counts LIVE todos: a dropped deliverable is not work any more, so it is
   reported separately rather than padding the denominator. */
function rollupBadgeHTML(r){
  if(!r) return '';
  var warn = r.pending ? '<span title="'+r.pending+' awaiting acceptance" style="color:var(--st-testing-fg);font-weight:700">⚠'+r.pending+'</span>' : '';
  var stuck = r.stuck ? '<span title="'+r.stuck+' stuck" style="color:var(--st-stuck-fg);font-weight:700">!'+r.stuck+'</span>' : '';
  var k = r.complete ? 'verified' : 'open';
  return '<span style="display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-family:'+MONO+';font-size:11px;font-weight:600;background:var(--st-'+k+'-bg);color:var(--st-'+k+'-fg);white-space:nowrap">'+
    (r.verified||0)+'/'+(r.total||0)+' verified'+warn+stuck+'</span>';
}

/* The tail under the `todos` stepper node: the fan-out summarised as a bar + counts,
   sitting where the other nodes put their timestamp. */
function todoProgressTail(d){
  var r=d.todo_rollup;
  if(!r) return '<span style="margin-top:3px;height:12px"></span>';
  var total=r.total||0, done=r.verified||0;
  var pct = total ? Math.round(done/total*100) : 0;
  var warn = r.pending ? '<span style="font-size:10px;font-weight:700;color:var(--st-testing-fg);white-space:nowrap">⚠ '+r.pending+' awaiting acceptance</span>' : '';
  var stuck = r.stuck ? '<span style="font-size:10px;font-weight:700;color:var(--st-stuck-fg);white-space:nowrap">⚠ '+r.stuck+' stuck</span>' : '';
  var dropped = r.dropped ? '<span style="font-size:9.5px;color:var(--text-3);white-space:nowrap">'+r.dropped+' dropped</span>' : '';
  return '<div style="margin-top:7px;display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;max-width:190px">'+
    '<div style="width:100%;height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden"><div style="width:'+pct+'%;height:100%;border-radius:999px;background:var(--st-verified-dot)"></div></div>'+
    '<span style="font-size:10.5px;font-weight:600;color:var(--text-2);font-family:'+MONO+'">'+done+' of '+total+' verified</span>'+
    warn+stuck+dropped+'</div>';
}

/* ⟨#3 Login endpoint⟩ — which deliverable a message belongs to. ONE thread for the whole
   task (six threads would fragment a conversation that is genuinely one conversation, and
   you'd lose "we discussed refunds while building payments"); the chip does the grouping.
   Clicking it selects that todo in the right column. */
function todoChipHTML(id){
  var t=todoById(state.detail,id);
  if(!t) return '';
  var title=String(t.title||'');
  if(title.length>22) title=title.slice(0,21)+'…';
  return '<button data-todo="'+t.id+'" title="'+esc('todo #'+todoNo(t)+' — '+t.title)+'" style="display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-family:'+MONO+';font-size:10px;font-weight:600;color:var(--accent-2);background:transparent;border:1px solid var(--accent);cursor:pointer">⟨#'+esc(todoNo(t))+' '+esc(title)+'⟩</button>';
}

/* The list: every todo on the task, PENDING first with a ⚠ (the API already sorts
   pending-first / dropped-last). A pending todo is the only thing on this screen blocking
   a human — everything else is progress, that one is a request. */
function todoListHTML(d){
  var rows=(d.todos||[]).map(function(t){
    var pending = t.status==='pending', dropped = t.status==='dropped';
    var parties=(t.parties||[]).map(function(p){
      var a=avSeat(p);
      return '<span title="'+esc(seatIdentity(p, true))+'" style="width:16px;height:16px;border-radius:5px;background:'+a.c+';color:#fff;font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+'</span>';
    }).join('');
    /* "awaiting Priya" and "awaiting a seat nobody ever accepted" are different
       problems with different fixes — nudge a colleague, or chase an invite — so they
       must not render the same. `t.unjoined` is the seats no one ever paired into. */
    var never=(t.unjoined||[]);
    var awaitingLabel=(t.awaiting||[]).map(function(p){
      var row=rosterRow(p);
      var who=(row&&row.name)?row.name:('@'+seatAddress(p));
      return never.indexOf(p)>=0 ? ('@'+seatAddress(p)+' — never joined') : who;
    }).join(', ');
    var note = dropped ? ('dropped'+(t.drop_reason?' — '+t.drop_reason:''))
             : t.stuck ? (t.stuck_reason||'stuck — humans notified')
             : pending ? ('awaiting '+(awaitingLabel||'acceptance'))
             : t.scope;
    var warn = pending ? '<span title="awaiting acceptance — this one is asking you for something" style="color:var(--st-testing-fg);font-size:13px;line-height:1;flex:none;padding-top:2px">⚠</span>' : '';
    return '<button data-todo="'+t.id+'" style="width:100%;display:flex;align-items:flex-start;gap:9px;padding:10px 13px;background:transparent;border:none;border-top:1px solid var(--border);cursor:pointer;text-align:left;font-family:inherit;opacity:'+(dropped?'.55':'1')+'">'+
      warn+
      '<span style="flex:1;min-width:0">'+
        '<span style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">'+
          '<span style="font-size:12.5px;font-weight:600;color:var(--text)'+(dropped?';text-decoration:line-through':'')+'">'+esc(t.title)+'</span>'+
          '<span style="font-family:'+MONO+';font-size:10px;color:var(--text-3)">#'+esc(todoNo(t))+'</span>'+
          todoStatusChip(t)+
        '</span>'+
        '<span style="display:block;font-size:11.5px;color:var(--text-2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(note)+'</span>'+
      '</span>'+
      '<span style="display:flex;gap:3px;flex:none;padding-top:2px">'+parties+'</span>'+
      '<span style="flex:none;display:flex;padding-top:1px">'+IC.chevR+'</span></button>';
  }).join('');
  return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden">'+
    '<div style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">'+
      '<span style="font-weight:600;font-size:14px;color:var(--text)">Todos</span>'+rollupBadgeHTML(d.todo_rollup)+'</div>'+
    rows+'</div>';
}

/* The per-todo mini-stepper — genSteps' widget at 20px, one level down. */
function todoMiniStepperHTML(t){
  var o=TODO_MARCH[t.state]!=null?TODO_MARCH[t.state]:0;
  var verified = t.state==='verified';
  var last=TODO_STEPS.length-1;
  var meta=TODO_STEPS.map(function(s,i){
    return {done:(i<o)||(verified&&i===o), current:(i===o)&&!verified&&!t.stuck, stuck:!!t.stuck&&i===o};
  });
  var reached=function(m){ return m.done||m.current||m.stuck; };
  var nodes=TODO_STEPS.map(function(s,i){
    var m=meta[i], v=stepVisual(m.done,m.current,m.stuck,20);
    var lc = i===0?'transparent':(reached(m)?'var(--st-verified-dot)':'var(--border-strong)');
    var rc = i===last?'transparent':(reached(meta[i+1])?'var(--st-verified-dot)':'var(--border-strong)');
    return '<div style="display:flex;flex-direction:column;align-items:center;flex:1;position:relative">'+
      '<div style="position:absolute;top:9px;left:0;width:50%;height:2px;background:'+lc+'"></div>'+
      '<div style="position:absolute;top:9px;right:0;width:50%;height:2px;background:'+rc+'"></div>'+
      '<div style="'+v.nodeStyle+'">'+v.inner+'</div>'+
      '<span style="margin-top:5px;font-size:9.5px;font-weight:600;text-align:center;color:'+v.labelColor+'">'+esc(s[1])+'</span></div>';
  }).join('');
  return '<div style="display:flex;align-items:flex-start;padding:13px 16px 11px;border-bottom:1px solid var(--border)">'+nodes+'</div>';
}

/* ---------- "what happens next" ----------
   The one line that fixes the real failure: a human staring at a locked todo that
   won't move, with nothing on screen saying the next move is his OWN agent typing
   `ready #1`. It names WHO owes the move and the literal shorthand to type.

   The sentence is NOT composed here. `t.next` comes straight off the API
   (state.next_step), computed beside the very gates report_status enforces — so the
   dashboard can never advertise a command the broker would refuse. This function is
   presentation only; if you find yourself adding an `if(t.state===…)` here, it belongs
   in state.next_step instead. */
function nextStepHTML(t){
  var n=t.next;
  if(!n||!n.text) return '';
  /* Terminal (verified/dropped) and human-owned (three strikes) read as statements,
     not instructions — a code chip would imply something to type when there isn't. */
  var tone = n.done ? 'verified' : (n.human ? 'stuck' : null);
  var bg   = tone ? 'var(--st-'+tone+'-bg)' : 'var(--accent-soft)';
  var bd   = tone ? 'var(--st-'+tone+'-dot)' : 'var(--accent)';
  var fg   = tone ? 'var(--st-'+tone+'-fg)' : 'var(--accent-2)';
  var icon = n.done ? IC.check : (n.human ? IC.warn : IC.next);
  var label= n.done ? 'Done' : (n.human ? 'Humans' : 'Next');

  /* The literal thing to type, in the same mono chip the shortcode cheatsheet uses so
     a human recognises it as "say this to your agent". `title` carries the broker tool
     it maps to, for anyone who wants the long form. */
  function chip(c){
    if(!c) return '';
    return '<code title="'+esc(n.tool||'')+'" style="font-family:'+MONO+';font-size:11px;font-weight:700;color:var(--text);background:var(--surface);border:1px solid '+bd+';border-radius:6px;padding:1px 7px;white-space:nowrap">'+esc(c)+'</code>';
  }
  /* The broker's own `who_label` is built from HANDLES, and it must stay that way —
     the same sentence is served to the AGENT, which is addressed by handle. Here, where
     a human is reading, name the PERSON and carry the handle alongside so the `sign #1`
     in the sentence still has an owner they can point at. */
  var who = '';
  if(n.who && n.who.length){
    /* A seat nobody ever joined is labelled as such rather than as a person who is
       simply slow: the move is to chase the invite (or drop the todo), not to nudge. */
    var never=(n.unjoined||[]);
    var labels = n.who.map(function(h){
      var row=rosterRow(h);
      if(never.indexOf(h)>=0) return '@'+seatAddress(h)+' (never joined)';
      return (row && row.name) ? row.name+"\u2019s agent (@"+seatAddress(h)+")" : '@'+seatAddress(h);
    });
    var joined = labels.length===1 ? labels[0]
      : labels.slice(0,-1).join(', ')+' or '+labels[labels.length-1];
    who = '<strong style="color:var(--text)">'+esc(joined)+'</strong> ';
  } else if(n.who_label){
    who = '<strong style="color:var(--text)">'+esc(n.who_label)+'</strong> ';
  }
  var head = n.cmd
    ? who+'types '+chip(n.cmd)+(n.alt&&n.alt!==n.cmd?' <span style="color:var(--text-3)">or</span> '+chip(n.alt):'')
    : '';

  /* The sentence marks the shorthands it mentions with `backticks` — the same spelling
     the broker uses in the agent-facing errors, so ONE string serves both readers.
     Render them as mono here. ESCAPE FIRST, then substitute: esc() leaves backticks
     alone, so nothing that survives this is attacker-controlled markup. */
  var body = esc(n.text).replace(/`([^`]+)`/g, function(_, c){
    return '<code style="font-family:'+MONO+';font-size:10.5px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:0 5px;white-space:nowrap">'+c+'</code>';
  });

  return '<div style="margin:12px 16px 0;padding:10px 12px;background:'+bg+';border:1px solid '+bd+';border-radius:11px;min-width:0">'+
    '<div style="display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:'+fg+'">'+
      '<span style="display:flex">'+icon+'</span>'+label+'</div>'+
    (head?'<div style="margin-top:6px;font-size:12px;color:var(--text-2);line-height:1.9;display:flex;flex-wrap:wrap;align-items:center;gap:4px">'+head+'</div>':'')+
    '<p style="margin:6px 0 0;font-size:11.5px;color:var(--text-2);line-height:1.7;overflow-wrap:anywhere">'+body+'</p>'+
  '</div>';
}

/* HOST [Drop todo] — READ-ONLY, per DECISIONS.md D11. The dashboard NEVER issues a
   command: this prints the exact line the human types in their OWN terminal, exactly the
   way shortcodesHTML teaches every other action. There is deliberately no button and no
   write path — a leaked ?v= link must only ever be able to LOOK. Host viewers only; a
   buddy can't run a host CLI, so showing it to them would be a lie. */
function dropTodoHTML(d,t){
  if(t.status==='dropped'||t.status==='verified') return '';
  if(!(t.status==='pending'||t.stuck)) return '';
  if(!(state.viewer && state.viewer.mode!=='buddy')) return '';
  /* Name the seats nobody ever joined outright: that is the case where waiting is
     pointless and dropping is the honest move, and it is exactly why this panel is
     here. No timeout does it for you — a silently expiring todo is worse. */
  /* This panel says what DROPPING does. It does NOT re-explain why the todo is stuck —
     the NEXT card directly above already names who is blocking and why, and repeating it
     made a two-line situation read as a wall of text. One fact, one place. */
  var why = 'Drops #'+todoNo(t)+' for everyone. Its scope, its contract and the whole '
          + 'thread stay in the event log — dropping ends it, it does not erase it.';
  /* A line the human TYPES, so it carries the per-task number — the CLI takes the same
     `#N` the agents do, not the global row id. */
  var cmd = 'sys-buddy todo drop '+d.id+' '+todoNo(t)+' --reason "…"';
  return '<div style="margin:12px 16px 0;padding:11px 13px;border:1px dashed var(--border-strong);border-radius:11px">'+
    '<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--text-2)">'+
      '<span style="display:flex;color:var(--st-testing-fg)">'+IC.warn+'</span>Drop todo (host)</div>'+
    '<p style="margin:6px 0 8px;font-size:11.5px;color:var(--text-2);line-height:1.5">'+why+
      ' Run it from your own terminal — this dashboard only ever reads.</p>'+
    '<div style="font-family:'+MONO+';font-size:11px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:pre">'+esc(cmd)+'</div></div>';
}

/* Selecting a todo swaps the panel to today's contract card scoped to THAT todo, under
   its own header + mini-stepper. Back returns to the list. */
function todoDetailHTML(d,t){
  var parties=(t.parties||[]).map(function(p){
    var a=avSeat(p), who=seatIdentity(p);
    var yes=(t.accepted_by||[]).indexOf(p)>=0, no=(t.declined_by||[]).indexOf(p)>=0;
    /* The waiting mark is a hollow ring, NOT an ellipsis. `…` immediately after a name
       that is itself ellipsis-truncated is unreadable — "[qa] · not joined …" looks like
       cut-off text rather than "awaiting acceptance", and a reader cannot tell which. A
       ring cannot be mistaken for truncation and pairs with the ✓/✕ it sits beside. */
    var mark = yes ? '<span style="color:var(--st-verified-fg);font-weight:700">✓</span>'
             : no  ? '<span style="color:var(--st-stuck-fg);font-weight:700">✕</span>'
             : '<span style="color:var(--text-3);font-weight:700">○</span>';
    /* the tooltip carries the HANDLE too: the pill answers "who", the handle is what
       you type at your agent, and a reader needs both without leaving the pill. */
    var neverJoined=(t.unjoined||[]).indexOf(p)>=0;
    var waitLbl = neverJoined ? 'awaiting acceptance — but nobody ever accepted this seat’s invite'
                              : 'awaiting acceptance';
    var tip = seatIdentity(p, true)+' — '+(yes?'accepted':(no?('declined: '+((t.decline_reasons||{})[p]||'')):waitLbl));
    /* max-width + ellipsis on the NAME only: the decision mark (✓/✕/…) is the one part
       that must never be the thing that gets cut, and the full identity — with the
       handle — is always in the tooltip. */
    return '<span title="'+esc(tip)+'" style="display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:2px 9px 2px 2px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:10.5px;font-weight:600;color:var(--text-2)">'+
      '<span style="width:16px;height:16px;border-radius:5px;background:'+a.c+';color:#fff;font-size:8px;display:inline-flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+'</span>'+
      '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(who)+'</span>'+
      '<span style="flex:none">'+mark+'</span></span>';
  }).join('');

  var declines=Object.keys(t.decline_reasons||{}).map(function(r){
    return '<div style="font-size:11.5px;color:var(--st-stuck-fg);line-height:1.5"><strong>'+esc(seatIdentity(r, true))+'</strong> declined: '+esc(t.decline_reasons[r])+'</div>';
  }).join('');
  if(declines) declines='<div style="margin:10px 16px 0;padding:8px 11px;background:var(--st-stuck-bg);border:1px solid var(--st-stuck-dot);border-radius:10px;display:flex;flex-direction:column;gap:4px">'+declines+'</div>';

  var stuckLine = t.stuck ? '<div style="margin:10px 16px 0;padding:8px 11px;background:var(--st-stuck-bg);border:1px solid var(--st-stuck-dot);border-radius:10px;font-size:11.5px;font-weight:600;color:var(--st-stuck-fg)">'+esc(t.stuck_reason||'stuck — humans notified 📣')+'</div>' : '';
  var dropLine = t.status==='dropped' ? '<div style="margin:10px 16px 0;padding:8px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:11.5px;color:var(--text-2)">Dropped by '+esc(t.dropped_by||'mutual consent')+(t.drop_reason?' — '+esc(t.drop_reason):'')+'</div>' : '';

  var strikeLine='';
  if(t.strikes>0){
    var dots='';
    for(var i=1;i<=MAX_STRIKES;i++){ dots+='<span style="width:6px;height:6px;border-radius:50%;background:'+(i<=t.strikes?'var(--st-stuck-dot)':'var(--border-strong)')+'"></span>'; }
    strikeLine='<div style="margin:10px 16px 0"><span style="display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--st-stuck-dot);font-size:11.5px;font-weight:600;color:var(--st-stuck-fg)"><span style="display:flex;gap:3px">'+dots+'</span>strike '+t.strikes+' of '+MAX_STRIKES+'</span></div>';
  }

  var head='<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px">'+
    '<div style="padding:13px 16px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--border)">'+
      '<button data-todoback="1" title="Back to all todos" style="display:flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;cursor:pointer;color:var(--text-2);flex:none">'+IC.back+'</button>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">'+
          '<span style="font-size:13.5px;font-weight:600;color:var(--text)">'+esc(t.title)+'</span>'+
          '<span style="font-family:'+MONO+';font-size:10px;color:var(--text-3)">#'+esc(todoNo(t))+' v'+esc(t.version)+'</span>'+
          todoStatusChip(t)+'</div>'+
        '<p style="margin:6px 0 0;font-size:11.5px;color:var(--text-2);line-height:1.5">'+esc(t.scope)+'</p>'+
      '</div></div>'+
    todoMiniStepperHTML(t)+
    /* Directly under the stepper: the stepper says WHERE it is, this says what moves it. */
    nextStepHTML(t)+
    '<div style="padding:12px 16px 0;display:flex;gap:5px;flex-wrap:wrap">'+parties+'</div>'+
    declines+stuckLine+dropLine+strikeLine+dropTodoHTML(d,t)+
    '<div style="height:14px"></div></div>';

  /* the SAME contract card the task view has always rendered, scoped to this todo —
     followed, on an ENGAGEMENT task only, by what the reviewer is meant to read it
     against: the role's guidelines and the deliverables it serves (item 2). Both render
     '' for a contract/debug task, so that column is byte-identical to before. */
  return head+contractHTML({id:d.id+'#'+t.id, contract:t.contract})+reviewAsideHTML(d,t);
}

function todoPanelHTML(d){
  var t=selectedTodo(d);
  return t ? todoDetailHTML(d,t) : todoListHTML(d);
}

/* ---------- ENGAGEMENT MODE — the owner’s register (docs/enhancements.md item 1) ----------
   A third task mode for commissioned work. The owner said what he wanted in HIS OWN
   WORDS; the team decomposed it into todos. Both registers describe ONE record, so
   nothing below is a second source of truth — the deliverable rows carry the same todos
   the panel to the right already shows, one vocabulary up.

   EVERY function here opens with `if(!isEngagement(d)) return ''`, and the API omits
   `engagement`, `deliverables`, `guidelines` and `verification` entirely on a `contract`
   or `debug` task — the same convention the todo, files and activity keys already
   follow. So a peer task runs none of this and renders exactly as it did before.

   THE WORDS ARE LOAD-BEARING and are not free to be softened. The reader is, by
   construction, someone who cannot evaluate a technical claim; every place this page
   could let him over-read a number is a place the feature does the opposite of its job.
   Hence, throughout: a missing check is said OUT LOUD rather than left blank, the three
   strengths print their whole sentence, the coverage counts name what was NOT looked at
   at least as loudly as what was, and the address a run checked against is always on
   screen because disclosure is the only safeguard there is. */
function isEngagement(d){ return !!(d && d.engagement); }

/* The panel shell every card below shares — the same surface/border/radius/shadow the
   thread, contract and roster cards use, so these read as more of this dashboard rather
   than as a bolted-on mode. */
var ENG_CARD='background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px';
function engHead(title, right, note){
  return '<div style="padding:13px 16px;border-bottom:1px solid var(--border)">'+
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
      '<span style="font-weight:600;font-size:14px;color:var(--text)">'+esc(title)+'</span>'+
      '<div style="flex:1"></div>'+(right||'')+'</div>'+
    (note?'<p style="margin:6px 0 0;font-size:11.5px;color:var(--text-2);line-height:1.55">'+note+'</p>':'')+
  '</div>';
}

/* ---------- how strongly a result knows what it claims ----------
   The broker’s own three (verification.STRENGTHS), printed in the broker’s own words
   (verification.STRENGTH_LABELS) so the dashboard, the CLI and the agent’s summary
   cannot each invent a gentler phrasing of `not_checked`.

   They must be told apart AT A GLANCE by someone who does not know what any of them
   mean, so each differs in COLOUR, GLYPH and WORDS — never in wording alone:
     verified     solid green ✓  — an agent went and looked. The only one that proves.
     evidence     solid amber ◎  — something was read. Nothing was proven.
     not_checked  dashed red ⚠  — nobody looked. A quiet grey pill would read as "fine",
                                  and silence reads as a pass, which is the whole point. */
var STRENGTH_VIEW={
  verified:{label:'Verified — this ran', k:'verified', dashed:false,
    tip:'An agent went to the running site and looked. The only strength that proves anything.'},
  evidence:{label:'Evidence reviewed — nothing proven', k:'testing', dashed:false,
    tip:'Something was read — a diff, a migration, the code. That proves it exists, not that it works.'},
  not_checked:{label:'Not checked', k:'stuck', dashed:true,
    tip:'Nobody looked at this. Said out loud, because silence reads as a pass.'}
};
function strengthGlyph(strength){
  if(strength==='verified') return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M20 6L9 17l-5-5"/></svg>';
  if(strength==='evidence') return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/></svg>';
  return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 9v4M12 17h.01M10.3 3.9l-8 14A2 2 0 004 21h16a2 2 0 001.7-3l-8-14a2 2 0 00-3.4 0z"/></svg>';
}
/* `strength_label` is the BROKER’s wording and wins; STRENGTH_VIEW is the fallback so a
   payload from an older broker (or a strength this page has not met) still prints a
   sentence rather than a bare key. */
function strengthChip(strength, strengthLabel){
  var v=STRENGTH_VIEW[strength];
  var label=strengthLabel || (v?v.label:strength);
  if(!label) return '';
  var k=v?v.k:'open', dashed=v?v.dashed:false;
  return '<span title="'+esc((v&&v.tip)||'')+'" style="display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;'+
    (dashed
      ? 'background:var(--surface);border:1px dashed var(--st-'+k+'-dot);color:var(--st-'+k+'-fg)'
      : 'background:var(--st-'+k+'-bg);border:1px solid transparent;color:var(--st-'+k+'-fg)')+'">'+
    '<span style="display:flex">'+strengthGlyph(strength)+'</span>'+esc(label)+'</span>';
}

/* The outcome, in the owner’s language: `✓ working` / `✗ broken`. It reuses the
   deliverable’s own vocabulary (verification.VERDICTS = accepted / rejected) rather than
   inventing a second one for "this isn’t done". */
var VERDICT_VIEW={accepted:{word:'working',mark:'✓',k:'verified'},rejected:{word:'broken',mark:'✗',k:'stuck'}};
function outcomeBadge(row){
  if(row.withdrawn){
    return '<span title="withdrawn by the owner — it is no longer part of the scope" style="display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--st-open-bg);color:var(--st-open-fg);white-space:nowrap">withdrawn</span>';
  }
  var r=row.result;
  /* NO RESULT AND `not_checked` RENDER THE SAME, deliberately. A verdict backed by
     `not_checked` has looked at nothing, so printing "✓ working" over it would be the
     precise false confidence this mode exists to remove — the strength outranks the
     verdict here, and the row says so where the eye lands first. */
  if(!r || r.strength==='not_checked'){
    return '<span title="'+esc(STRENGTH_VIEW.not_checked.tip)+'" style="display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface);border:1px dashed var(--st-stuck-dot);color:var(--st-stuck-fg);white-space:nowrap">⚠ nobody checked this</span>';
  }
  var v=VERDICT_VIEW[r.verdict];
  if(!v) return '';
  return '<span style="display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--st-'+v.k+'-bg);color:var(--st-'+v.k+'-fg);white-space:nowrap">'+v.mark+' '+esc(v.word)+'</span>';
}

/* ---------- WHERE A RUN LOOKED — always on screen ----------
   The DEV supplies the target, so disclosure is the entire safeguard: "checked against
   https://random.vercel.dev" in front of an owner whose site is acme.com is the thing
   that makes a wrong target catchable. A record that cannot say what it checked is
   unfalsifiable, so a run with no target says THAT, rather than rendering nothing. */
/* When the run happened, as the HH:MM the thread and the event log already print. The
   domain stores an epoch (`created_at`); `time` is read first in case the API ever
   formats one server-side, and a payload carrying neither simply prints no clock rather
   than `undefined`. */
function runTime(run){
  if(run && run.time) return String(run.time);
  var ts=run && run.created_at;
  if(typeof ts!=='number' || !isFinite(ts)) return '';
  var dt=new Date(ts*1000);
  return ('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2);
}
function checkedAgainstHTML(d){
  if(!isEngagement(d)) return '';
  var run=(d.verification||{}).run;
  if(!run) return '';
  var who=run.by_name || run.by;
  var t=runTime(run);
  var when=t ? ' · '+esc(t) : '';
  var by=who ? '<span style="font-size:10.5px;color:var(--text-3);white-space:nowrap">by '+esc(who)+when+'</span>' : '';
  var target = run.staging_url
    ? '<span style="font-family:'+MONO+';font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(run.staging_url)+'">'+esc(run.staging_url)+'</span>'
    : '<span style="font-size:12px;font-weight:600;color:var(--st-stuck-fg)">this run did not record where it looked</span>';
  var note = run.staging_url
    ? 'The dev supplies this address, not the broker. If it is not the site you expect, the result is about a different site.'
    : 'A check that cannot say what it checked cannot be argued with — treat it as unverified.';
  return '<div style="margin:11px 16px 0;padding:8px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;min-width:0">'+
    '<div style="display:flex;align-items:center;gap:9px;min-width:0;flex-wrap:wrap">'+
      '<span style="display:flex;color:var(--text-3);flex:none">'+IC.link+'</span>'+
      '<span style="font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);flex:none">Checked against</span>'+
      target+'<div style="flex:1"></div>'+by+'</div>'+
    '<div style="margin-top:5px;font-size:10.5px;color:var(--text-3);line-height:1.5">'+esc(note)+'</div></div>';
}

/* ---------- the scope agreement ----------
   The LIST is the contract-shaped object, not each deliverable: every builder signs one
   list, per version. Until it locks there are no todos and no contracts — which is why
   an unlocked list gets the loudest card on the page and names exactly who is being
   waited on. This is the screen a blocked team stares at. */
function seatPill(seat, mark, k){
  var a=avSeat(seat);
  return '<span title="'+esc(seatIdentity(seat, true))+'" style="display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:2px 10px 2px 2px;border-radius:999px;background:var(--st-'+k+'-bg);color:var(--st-'+k+'-fg);font-size:11px;font-weight:600">'+
    '<span style="width:18px;height:18px;border-radius:6px;background:'+a.c+';color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+'</span>'+
    '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(seatIdentity(seat))+'</span>'+
    '<span style="flex:none;font-weight:700">'+mark+'</span></span>';
}
function scopeAgreementHTML(d){
  if(!isEngagement(d)) return '';
  var dl=d.deliverables;
  if(!dl) return '';
  var version='deliverable list v'+esc(dl.version==null?'?':dl.version);
  var accepted=(dl.accepted_by||[]).map(function(s){ return seatPill(s,'✓','verified'); }).join('');
  var awaiting=(dl.awaiting||[]).map(function(s){ return seatPill(s,'○','testing'); }).join('');

  if(dl.locked){
    /* Locked is one green line, not a panel: it is settled, and the screen’s attention
       belongs to the outcomes below. What it still has to say is the asymmetry, because
       it is the one people get wrong later — scope may SHRINK, never grow. */
    return '<div style="'+ENG_CARD+'"><div style="padding:11px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
      '<span style="display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--st-verified-bg);color:var(--st-verified-fg);white-space:nowrap">'+
        '<span style="display:flex">'+dividerIcon('lock')+'</span>scope agreed · '+version+'</span>'+
      (accepted?'<div style="display:flex;gap:5px;flex-wrap:wrap">'+accepted+'</div>':'')+
      '<div style="flex:1"></div>'+
      '<span style="font-size:11px;color:var(--text-2);line-height:1.5">The owner may withdraw a deliverable; adding one means a new engagement.</span>'+
    '</div></div>';
  }

  var need = (dl.awaiting||[]).length
    ? 'Waiting on the builders below to accept this list. One signature each, on the LIST — not one per deliverable.'
    : 'Waiting on the owner to put a list of deliverables up for the team to accept.';
  return '<div style="background:var(--surface);border:1px solid var(--st-testing-dot);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px">'+
    '<div style="padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
      '<span style="display:flex;color:var(--st-testing-fg)">'+IC.warn+'</span>'+
      '<span style="font-weight:700;font-size:14px;color:var(--text)">Scope is not agreed yet — nothing can be built</span>'+
      '<div style="flex:1"></div>'+
      '<span style="font-family:'+MONO+';font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--st-testing-bg);color:var(--st-testing-fg);white-space:nowrap">'+version+'</span></div>'+
    '<div style="padding:12px 16px;display:flex;flex-direction:column;gap:10px">'+
      '<div style="font-size:12px;color:var(--text-2);line-height:1.6">'+esc(need)+'</div>'+
      (awaiting?'<div><div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--st-testing-fg);margin-bottom:6px">Waiting on</div>'+
        '<div style="display:flex;gap:5px;flex-wrap:wrap">'+awaiting+'</div></div>':'')+
      (accepted?'<div><div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px">Already accepted</div>'+
        '<div style="display:flex;gap:5px;flex-wrap:wrap">'+accepted+'</div></div>':'')+
      '<p style="margin:0;font-size:11px;color:var(--text-3);line-height:1.6">Until every builder accepts, this task has no todos and no contracts — but messaging stays open, because pushing back IS the conversation. A push-back names one deliverable; the owner revises it, the list mints a new version, and everyone signs again.</p>'+
    '</div></div>';
}

/* ---------- one deliverable, in the owner’s words ----------
   `#1 Landing page, 3 buttons  ✓ working`, and underneath it the per-dev claims, because
   a dev who claims work he did not do should be caught AT HIS OWN CLAIM rather than
   hidden inside a deliverable that mostly works — and the honest dev is individually
   credited, which is the other half of both sides being represented. */
var STALENESS_NOTE={
  stale:'This check was written against an older version of the contract. A ✗ here can mean the check is out of date rather than the work being broken — ask before blaming anyone.',
  unknown:'No locked contract to compare this check against yet, so its freshness is unknown.'
};
function specRowHTML(s){
  var a=avSeat(s.role);
  var who=s.name || seatIdentity(s.role) || s.role;
  var note=STALENESS_NOTE[s.staleness];
  /* A per-claim verdict is rendered when the payload carries one; when it does not, the
     claim still stands on screen with the deliverable’s own outcome above it — an
     unmarked claim must never look like a passed one, so nothing here draws a tick. */
  var mark=(s.result&&VERDICT_VIEW[s.result.verdict])
    ? '<span style="flex:none;font-weight:700;color:var(--st-'+VERDICT_VIEW[s.result.verdict].k+'-fg)">'+VERDICT_VIEW[s.result.verdict].mark+'</span>'
    : '';
  var detail=(s.result&&s.result.detail)
    ? '<span style="font-size:11px;color:var(--st-stuck-fg)">— '+esc(s.result.detail)+'</span>' : '';
  return '<div style="display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--border)">'+
    '<span title="'+esc(seatIdentity(s.role, true))+'" style="width:18px;height:18px;border-radius:6px;background:'+a.c+';color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px">'+esc(a.i)+'</span>'+
    '<div style="flex:1;min-width:0">'+
      '<div style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap">'+
        '<span style="font-size:12px;font-weight:600;color:var(--text)">'+esc(who)+'</span>'+

    '</div></div>';
}
function deliverableRowHTML(row){

  }).join('');

    : (row.withdrawn ? '' : '<div style="margin-top:7px;font-size:11px;color:var(--text-3)">No todo names this yet — no work on the board serves it.</div>');

  var specs=(row.specs||[]);

    specBlock='<div style="margin-top:8px;padding:7px 10px;border:1px dashed var(--border-strong);border-radius:9px;font-size:11px;color:var(--text-2);line-height:1.5">No dev has written a check for this one, so there is nothing for a verifier to go and find.</div>';
  }

  var withdrawn = row.withdrawn

    : '';
  var detail=(!row.withdrawn && row.result && row.result.detail)
    ? '<div style="margin-top:6px;font-size:11.5px;color:var(--text-2);line-height:1.55">'+esc(row.result.detail)+'</div>' : '';
  var strength=(!row.withdrawn && row.result)

function registerHTML(d){
  if(!isEngagement(d)) return '';

/* ---------- coverage: what was LOOKED AT, and what was not ----------
   Two counts the broker gets by counting rows (deliverables with a spec, deliverables
   with a result in the latest run), so "everything passed" cannot hide one nobody
   opened. Both counts measure PRESENCE, NOT QUALITY — a spec with one lazy assertion
   still "covers" its deliverable — and this is the exact place a non-technical owner
   would over-read a bare number, so:
     · the number never appears alone, always as "were looked at";
     · what was NOT checked is rendered at least as prominently, in its own alarmed row,
       naming the deliverables so it cannot be skimmed past;
     · a "nothing was skipped" line still renders when nothing was skipped, because the
       reader has to learn the absence of that row means something. */
function missingListHTML(rows, label, tone){
  if(!rows.length) return '';
  var names=rows.map(function(r){
    return '<a href="#'+esc('dlv-'+r.id)+'" style="font-size:11.5px;font-weight:600;color:var(--st-'+tone+'-fg);text-decoration:underline">#'+esc(r.number)+' '+esc(r.text)+'</a>';
  }).join('<span style="color:var(--text-3)"> · </span>');
  return '<div style="padding:9px 11px;border:1px dashed var(--st-'+tone+'-dot);border-radius:10px;background:var(--surface)">'+
    '<div style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--st-'+tone+'-fg)">'+
      '<span style="display:flex">'+IC.warn+'</span>'+esc(rows.length+' '+label)+'</div>'+
    '<div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap">'+names+'</div></div>';
}
function coverageHTML(d){
  if(!isEngagement(d)) return '';
  var v=d.verification;
  if(!v) return '';
  var c=v.coverage||{};
  var total=c.deliverables||0;
  if(!total) return '';
  var rows=((d.deliverables||{}).rows||[]).filter(function(r){ return !r.withdrawn; });
  var noResult=rows.filter(function(r){ return !r.result || r.result.strength==='not_checked'; });
  var noSpec=rows.filter(function(r){ return !(r.specs||[]).length; });

  var headline = v.run
    ? '<strong style="color:var(--text)">'+(c.with_result||0)+' of '+total+'</strong> deliverables were looked at in the latest run.'
    : '<strong style="color:var(--st-stuck-fg)">Nobody has run a check yet.</strong> Nothing on this list has been looked at.';
  var specLine = '<strong style="color:var(--text)">'+(c.with_spec||0)+' of '+total+'</strong> have a check written by a dev for a verifier to follow.';

  return '<div style="'+ENG_CARD+'">'+
    engHead('What was checked', '',
      'Counting only. The broker counts what was looked at — it does not judge how well any of it works.')+
    '<div style="padding:12px 16px;display:flex;flex-direction:column;gap:9px">'+
      '<div style="font-size:12.5px;color:var(--text-2);line-height:1.6">'+headline+'</div>'+
      '<div style="font-size:12.5px;color:var(--text-2);line-height:1.6">'+specLine+'</div>'+
      missingListHTML(noResult,'nobody checked in the latest run','stuck')+
      missingListHTML(noSpec,'have no check written by any dev','testing')+
      (noResult.length||noSpec.length ? '' :
        '<div style="padding:8px 11px;border:1px solid var(--border);border-radius:10px;font-size:11.5px;color:var(--text-2);line-height:1.55">Nothing was skipped: every live deliverable has a check written and a result from the latest run.</div>')+
      '<p style="margin:0;font-size:11px;color:var(--text-3);line-height:1.6">These are counts of what was looked at, not how well it works. One lazy check still counts as a check here, so a full count is never a promise of quality — read the strength on each deliverable above for that, and remember that only “Verified — this ran” means anything was proven.</p>'+
    '</div>'+checkedAgainstHTML(d)+'<div style="height:12px"></div></div>';
}

/* Everything the owner’s register puts above the fold, in the order a non-technical
   reader needs it: is the scope even agreed → what did I ask for and what came back →
   how much of it was actually looked at. */
function engagementHTML(d){
  if(!isEngagement(d)) return '';
  return scopeAgreementHTML(d)+registerHTML(d)+coverageHTML(d);
}

/* ---------- what the REVIEWER sees, beside the contract (item 2) ----------
   The reviewing agent is already reading the proposal; putting the role’s standards and
   the deliverables it serves next to it makes signing mean "I checked this against
   them" — an accountable moment, with the broker claiming to have verified nothing.
   Both are already in the payload, so this is nearly free. */
function guidelinesCardHTML(d, roleTypes){
  if(!isEngagement(d)) return '';
  var g=d.guidelines;
  if(!g) return '';                                   /* key ABSENT when none — no empty panel */
  var types=(roleTypes||[]).filter(function(rt){ return (g[rt]||[]).length; });
  if(!types.length) return '';
  var blocks=types.map(function(rt){
    var a=av(rt);
    var items=(g[rt]||[]).map(function(r){
      return '<li style="margin:0 0 5px;font-size:12px;color:var(--text);line-height:1.5">'+esc(r.rule)+'</li>';
    }).join('');
    return '<div style="padding:11px 16px;border-top:1px solid var(--border)">'+
      '<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">'+
        '<span style="width:16px;height:16px;border-radius:5px;background:'+a.c+';color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+'</span>'+
        '<span style="font-size:11.5px;font-weight:700;color:var(--text-2)">'+esc(a.label)+'</span></div>'+
      '<ul style="margin:0;padding-left:17px">'+items+'</ul></div>';
  }).join('');
  return '<div style="'+ENG_CARD+';margin-top:16px;margin-bottom:0">'+
    engHead('Guidelines', '',
      'The host set these for this role. Signing the contract means you read it against them — the broker cannot check that the code follows them, and does not claim to.')+
    blocks+'</div>';
}
/* Which deliverables one todo serves — the inverse of `rows[].todos`, so no new payload
   field is needed. It is where you notice a contract has drifted past the agreed scope. */
function deliverablesOfTodo(d, t){
  var rows=((d.deliverables||{}).rows)||[];
  var n=todoNo(t);
  return rows.filter(function(r){ return (r.todos||[]).indexOf(n)>=0; });
}
function todoDeliverablesHTML(d, t){
  if(!isEngagement(d)) return '';

/* The whole review aside: the standards, then the scope, under the contract card. */
function reviewAsideHTML(d, t){

    }).join('');
