  } else if(specs.length){
    specBlock='<div style="margin-top:8px">'+specs.map(specRowHTML).join('')+'</div>';
  } else {
    /* Said out loud. A deliverable nobody left a check for is the single easiest thing
       for a clean-looking page to hide, so it gets a line rather than empty space. */
    specBlock='<div style="margin-top:8px;padding:7px 10px;border:1px dashed var(--border-strong);border-radius:9px;font-size:11px;color:var(--text-2);line-height:1.5">No dev has written a check for this one, so there is nothing for a verifier to go and find.</div>';
  }

  var withdrawn = row.withdrawn
    ? '<div style="margin-top:6px;font-size:11px;color:var(--text-2);line-height:1.5">Withdrawn by the owner'+(row.withdraw_reason?' — '+esc(row.withdraw_reason):'')+'. It stays on the record; it is not work any more.</div>'
    : '';
  var detail=(!row.withdrawn && row.result && row.result.detail)
    ? '<div style="margin-top:6px;font-size:11.5px;color:var(--text-2);line-height:1.55">'+esc(row.result.detail)+'</div>' : '';
  var strength=(!row.withdrawn && row.result)
    ? '<div style="margin-top:7px">'+strengthChip(row.result.strength, row.result.strength_label)+'</div>' : '';

  return '<div id="'+esc('dlv-'+row.id)+'" style="padding:13px 16px;border-top:1px solid var(--border);opacity:'+(row.withdrawn?'.6':'1')+'">'+
    '<div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap">'+
      '<span style="font-family:'+MONO+';font-size:12px;font-weight:700;color:var(--text-3);flex:none;padding-top:2px">#'+esc(row.number)+'</span>'+
      '<span style="flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--text);line-height:1.45'+(row.withdrawn?';text-decoration:line-through':'')+'">'+esc(row.text)+'</span>'+

}
function registerHTML(d){
  if(!isEngagement(d)) return '';
  var dl=d.deliverables;
  if(!dl || !(dl.rows||[]).length) return '';
  var live=dl.rows.filter(function(r){ return !r.withdrawn; }).length;
  var count='<span style="font-size:12px;color:var(--text-2);white-space:nowrap">'+live+' live'+
    (dl.rows.length>live?' · '+(dl.rows.length-live)+' withdrawn':'')+'</span>';
  return '<div style="'+ENG_CARD+'">'+
    engHead('What was asked for', count,
      'The owner’s own words, and what came back. The todos to the right are the same work in the team’s words — one record, two registers.')+
    checkedAgainstHTML(d)+
    '<div style="height:11px"></div>'+
    dl.rows.map(deliverableRowHTML).join('')+
  '</div>';
}

/* ---------- coverage: what was LOOKED AT, and what was not ----------
   Two counts the broker gets by counting rows (deliverables with a spec, deliverables
   with a result in the latest run), so "everything passed" cannot hide one nobody
   opened. Both counts measure PRESENCE, NOT QUALITY — a spec with one lazy assertion
   still "covers" its deliverable — and this is the exact place a non-technical owner
   would over-read a bare number, so:
     · the number never appears alone, always as "were looked at";
     · what was NOT checked is rendered at least as prominently, in its own alarmed row,
       naming the deliverables so it cannot be skimmed past;
     · a "nothing was skipped" line still renders when nothing was skipped, because the
       reader has to learn the absence of that row means something. */
function missingListHTML(rows, label, tone){
  if(!rows.length) return '';
  var names=rows.map(function(r){
    return '<a href="#'+esc('dlv-'+r.id)+'" style="font-size:11.5px;font-weight:600;color:var(--st-'+tone+'-fg);text-decoration:underline">#'+esc(r.number)+' '+esc(r.text)+'</a>';
  }).join('<span style="color:var(--text-3)"> · </span>');
  return '<div style="padding:9px 11px;border:1px dashed var(--st-'+tone+'-dot);border-radius:10px;background:var(--surface)">'+
    '<div style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--st-'+tone+'-fg)">'+
      '<span style="display:flex">'+IC.warn+'</span>'+esc(rows.length+' '+label)+'</div>'+
    '<div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap">'+names+'</div></div>';
}
function coverageHTML(d){
  if(!isEngagement(d)) return '';
  var v=d.verification;
  if(!v) return '';
  var c=v.coverage||{};
  var total=c.deliverables||0;
  if(!total) return '';
  var rows=((d.deliverables||{}).rows||[]).filter(function(r){ return !r.withdrawn; });
  var noResult=rows.filter(function(r){ return !r.result || r.result.strength==='not_checked'; });
  var noSpec=rows.filter(function(r){ return !(r.specs||[]).length; });

  var headline = v.run
    ? '<strong style="color:var(--text)">'+(c.with_result||0)+' of '+total+'</strong> deliverables were looked at in the latest run.'
    : '<strong style="color:var(--st-stuck-fg)">Nobody has run a check yet.</strong> Nothing on this list has been looked at.';
  var specLine = '<strong style="color:var(--text)">'+(c.with_spec||0)+' of '+total+'</strong> have a check written by a dev for a verifier to follow.';

  return '<div style="'+ENG_CARD+'">'+
    engHead('What was checked', '',
      'Counting only. The broker counts what was looked at — it does not judge how well any of it works.')+
    '<div style="padding:12px 16px;display:flex;flex-direction:column;gap:9px">'+
      '<div style="font-size:12.5px;color:var(--text-2);line-height:1.6">'+headline+'</div>'+
      '<div style="font-size:12.5px;color:var(--text-2);line-height:1.6">'+specLine+'</div>'+
      missingListHTML(noResult,'nobody checked in the latest run','stuck')+
      missingListHTML(noSpec,'have no check written by any dev','testing')+
      (noResult.length||noSpec.length ? '' :
        '<div style="padding:8px 11px;border:1px solid var(--border);border-radius:10px;font-size:11.5px;color:var(--text-2);line-height:1.55">Nothing was skipped: every live deliverable has a check written and a result from the latest run.</div>')+
      '<p style="margin:0;font-size:11px;color:var(--text-3);line-height:1.6">These are counts of what was looked at, not how well it works. One lazy check still counts as a check here, so a full count is never a promise of quality — read the strength on each deliverable above for that, and remember that only “Verified — this ran” means anything was proven.</p>'+
    '</div>'+checkedAgainstHTML(d)+'<div style="height:12px"></div></div>';
}

/* Everything the owner’s register puts above the fold, in the order a non-technical
   reader needs it: is the scope even agreed → what did I ask for and what came back →
   how much of it was actually looked at. */
function engagementHTML(d){
  if(!isEngagement(d)) return '';
  return scopeAgreementHTML(d)+registerHTML(d)+coverageHTML(d);
}

/* ---------- what the REVIEWER sees, beside the contract (item 2) ----------
   The reviewing agent is already reading the proposal; putting the role’s standards and
   the deliverables it serves next to it makes signing mean "I checked this against
   them" — an accountable moment, with the broker claiming to have verified nothing.
   Both are already in the payload, so this is nearly free. */
function guidelinesCardHTML(d, roleTypes){
  if(!isEngagement(d)) return '';
  var g=d.guidelines;
  if(!g) return '';                                   /* key ABSENT when none — no empty panel */
  var types=(roleTypes||[]).filter(function(rt){ return (g[rt]||[]).length; });
  if(!types.length) return '';
  var blocks=types.map(function(rt){
    var a=av(rt);
    var items=(g[rt]||[]).map(function(r){
      return '<li style="margin:0 0 5px;font-size:12px;color:var(--text);line-height:1.5">'+esc(r.rule)+'</li>';
    }).join('');
    return '<div style="padding:11px 16px;border-top:1px solid var(--border)">'+
      '<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">'+
        '<span style="width:16px;height:16px;border-radius:5px;background:'+a.c+';color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+'</span>'+
        '<span style="font-size:11.5px;font-weight:700;color:var(--text-2)">'+esc(a.label)+'</span></div>'+
      '<ul style="margin:0;padding-left:17px">'+items+'</ul></div>';
  }).join('');
  return '<div style="'+ENG_CARD+';margin-top:16px;margin-bottom:0">'+
    engHead('Guidelines', '',
      'The host set these for this role. Signing the contract means you read it against them — the broker cannot check that the code follows them, and does not claim to.')+
    blocks+'</div>';
}
/* Which deliverables one todo serves — the inverse of `rows[].todos`, so no new payload
   field is needed. It is where you notice a contract has drifted past the agreed scope. */
function deliverablesOfTodo(d, t){
  var rows=((d.deliverables||{}).rows)||[];
  var n=todoNo(t);
  return rows.filter(function(r){ return (r.todos||[]).indexOf(n)>=0; });
}
function todoDeliverablesHTML(d, t){
  if(!isEngagement(d)) return '';
  var rows=deliverablesOfTodo(d, t);
  if(!rows.length){
    /* Internal work names no deliverable, and that is honest modelling rather than an
       escape hatch — but it must be VISIBLE, or a todo that quietly serves nothing looks
       the same as one that serves everything. */
    return '<div style="'+ENG_CARD+';margin-top:16px;margin-bottom:0">'+
      engHead('Serves no deliverable', '',
        'Internal work — repo setup, CI, a refactor. Nobody verifies it in a browser, and it is left out of the owner’s register on purpose.')+'</div>';
  }
  var items=rows.map(function(r){
    return '<div style="padding:9px 16px;border-top:1px solid var(--border);display:flex;align-items:flex-start;gap:9px">'+
      '<span style="font-family:'+MONO+';font-size:11px;font-weight:700;color:var(--text-3);flex:none;padding-top:1px">#'+esc(r.number)+'</span>'+
      '<span style="flex:1;min-width:0;font-size:12px;color:var(--text);line-height:1.5'+(r.withdrawn?';text-decoration:line-through':'')+'">'+esc(r.text)+'</span>'+
      outcomeBadge(r)+'</div>';
  }).join('');
  return '<div style="'+ENG_CARD+';margin-top:16px;margin-bottom:0">'+
    engHead('Deliverables this serves', '',
      'What the owner asked for, in his words. If the contract has grown past these, it has grown past the agreed scope.')+
    items+'</div>';
}
/* The whole review aside: the standards, then the scope, under the contract card. */
function reviewAsideHTML(d, t){
  if(!isEngagement(d)) return '';
  var types=[];
  (t.parties||[]).forEach(function(p){
    var rt=seatRole(p);
    if(types.indexOf(rt)<0) types.push(rt);
  });
  return guidelinesCardHTML(d, types)+todoDeliverablesHTML(d, t);
}

/* ---------- event log ---------- */
function eventLogHTML(d){
  /* `slack` stays for events written before notifications went multi-channel; new rows
   are `notify`. Dropping it would make old rows unfilterable. */
  /* The engagement kinds are appended rather than woven in, so a peer task's filter
   row is unchanged in both content and order. */
  var FILTERS=['all','transition','lock','deploy','test','notify','slack','token','deliverable','verification','guidelines'];
  /* `todo` joins the vocabulary only for a task that HAS todos (incl. one whose todos
     were all dropped — its log still carries them), so a pre-todo task's filter row is
     exactly the row that shipped. It was ALSO sitting in the base list above, which meant
     a task with todos rendered the button twice — the conditional is the one that matches
     the stated intent, so the base copy is gone rather than this. */
  if(d && (d.todos||[]).length) FILTERS=FILTERS.concat(['todo']);
  var filter=state.eventFilter;
  /* The VALUE stays `todo` because that is the stored event kind; only the label follows
     the task's vocabulary. Without this a debug task offered a `todo` filter above rows
     that all read "Issue #N" — the same leak `api._render_detail` fixed one level down. */
  var fbtns=FILTERS.map(function(f){
    var label = (f==='todo' && isDebugTask(d)) ? 'issue' : f;
    return '<button data-filter="'+f+'" style="'+filterStyle(filter===f)+'">'+label+'</button>';
  }).join('');
  /* NEWEST-FIRST, matching the activity strip. The API hands events back oldest-first
     (api.py `ORDER BY id`) and this box is 320px tall, so rendering them in that order put
     the newest event permanently below the fold on any task with more than a handful — and
     the newest event is the entire reason anyone opens a log. Unlike the message thread
     there is no conversation to read top-down here: each row stands alone.
     Reversing AFTER `.filter()` is what keeps this safe: filter returns a fresh array, so
     the live `d.events` payload is never reversed in place — which would flip the order on
     every poll and make it oscillate. */
  var evs=(d.events||[]).filter(function(e){ return filter==='all'||e[1]===filter; }).reverse();
  var rows;
  if(evs.length){
    rows=evs.map(function(ev){
      return '<div style="display:flex;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid var(--border)">'+
        '<span style="font-family:'+MONO+';font-size:11.5px;color:var(--text-3);width:48px;flex:none">'+esc(ev[0])+'</span>'+
        '<span style="display:inline-flex;align-items:center;gap:7px;width:112px;flex:none;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--text-2)"><span style="width:7px;height:7px;border-radius:2px;background:'+eventColor(ev[1])+';flex:none"></span>'+esc(String(ev[1]).toUpperCase())+'</span>'+
        '<span style="font-size:12.5px;color:var(--text);font-family:'+MONO+';min-width:0;overflow:hidden;text-overflow:ellipsis">'+esc(ev[2])+'</span></div>';
    }).join('');
  } else {
    rows='<div style="text-align:center;padding:34px 20px;font-size:13px;color:var(--text-2)">Nothing logged for this filter.</div>';
  }
  return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-top:16px">'+
    '<div style="padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
      '<span style="font-weight:600;font-size:14px;color:var(--text);display:flex;align-items:center;gap:8px"><span style="color:var(--text-2);display:flex">'+IC.log+'</span>Event log</span>'+
      '<div style="flex:1"></div><div style="display:flex;gap:5px;flex-wrap:wrap">'+fbtns+'</div></div>'+
    '<div style="max-height:320px;overflow-y:auto">'+rows+'</div></div>';
}

/* ---------- debug-mode task view (no stepper, no contract) ---------- */
/* A debug task's lifecycle is just open → resolved, so it gets a tailored view:
   a simple status header + the reused message thread + the reused event log. */
function debugChip(stateName){

  }
  return stateChip(stateName); // 'open' (and any other) falls through to the shared styles
}
function debugTaskHTML(d){
  var chip=debugChip(d.state);
  var avs=castChips(d,22,10);

  var issues=hasTodos(d), roll=d.todo_rollup;

    ? 'Debug session — every issue needs every party to say it is fixed.'
    : 'Debug session — collaborate, then mark resolved.';

    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
    '<span style="display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:'+chip.bg+';color:'+chip.fg+'"><span style="width:7px;height:7px;border-radius:50%;background:'+chip.dot+'"></span>'+esc(chip.label)+'</span>'+
    (roll?rollupBadgeHTML(roll,'fixed'):'')+
    '<span style="font-size:12.5px;color:var(--text-2)">'+esc(blurb)+'</span>'+
    '<div style="flex:1"></div><div title="'+esc(ROLE_COLOR_TIP)+'" style="display:flex;gap:4px">'+avs+'</div></div></div>';
  return '<div style="max-width:1200px;margin:0 auto;padding:20px 20px 80px">'+
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">'+
      '<button data-home="1" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;background:var(--surface);border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:13px;color:var(--text-2)">'+IC.back+'Tasks</button>'+
      '<h1 style="font-size:20px;font-weight:700;margin:0;color:var(--text);letter-spacing:-.02em">'+esc(d.title)+'</h1>'+
      '<span style="display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:'+chip.bg+';color:'+chip.fg+'"><span style="width:6px;height:6px;border-radius:50%;background:'+chip.dot+'"></span>'+esc(chip.label)+'</span>'+
    '</div>'+
    statusHeader+
    rosterPanel(d)+
    /* THE ISSUES PANEL — the same `todoListHTML` the contract view renders, titled
       "Issues" and counting "n/m fixed" because that is what these rows are here. Absent

       looks exactly as it did. */
    (issues?'<div style="margin-bottom:16px">'+todoListHTML(d)+'</div>':'')+

  /* Both overlays hang off the END, outside the page container, so nothing above can

     does — its ISSUES open in it (with no contract column; see `todoModalHTML`) — and it
     needed it even before issues existed, because the thread can carry a ⟨#N⟩ chip and a

  '</div>'+todoModalHTML(d)+lightboxHTML();

/* ---------- shorthand cheatsheet ---------- */
/* The short commands a human types to THEIR OWN agent (taught in the agent prompt).
   Mirrored here so a watcher has the same reference. Contract vs debug show the
   codes that apply to each mode.

   This used to be an inline `<details>` at the bottom of the task page; it now renders
   INSIDE the Commands slide-out (panelHTML below).

   Every row, its grouping and its mode now come from SHORTCODES — this function only
   decides how a row LOOKS. It used to hand-type all twenty-odd codes while
   workflowsPanelBody hand-typed its own copy, and the two had drifted (`reopen` here vs
   `reopen <why> #N` in the prompt; `stuck [#N]`'s optionality claimed for every command).
   The role-tag row is still built FROM ROLE_TAGS: one source, never a copy. */
function shortcodesHTML(d){
  var mode = (d && d.mode==='debug') ? 'debug' : 'contract';
  /* esc() is NOT optional here: `todo <title>` and `no #N <why>` contain angle brackets,
     and an unescaped `<title>` is a real element the parser then reads TEXT into — it
     silently ate every row after it (and, in the panel, the whole Broker-tools section
     below). Placeholders are copy, not markup. */
  function code(c){ return '<span style="font-family:'+MONO+';font-size:10.5px;font-weight:600;color:var(--text);border:1px solid var(--border-strong);border-radius:6px;padding:1px 6px;white-space:nowrap">'+esc(c)+'</span>'; }
  function grp(label){ return '<div style="color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:7px 0 1px">'+esc(label)+'</div>'; }
  function cmd(c, desc){ return '<div style="display:flex;gap:9px;align-items:baseline"><span style="flex:none;min-width:70px">'+code(c)+'</span><span>'+desc+'</span></div>'; }
  var group=null, rows='';
  SHORTCODES.forEach(function(s){
    if(s.modes.indexOf(mode)<0) return;
    var c=s.code, desc=s.desc;
    /* Role tags: the same @role slot, addressed by tag instead of the full name. Listed
       under Messaging (not their own group) because they are an argument spelling, not a
       command — `sm @BE` IS `sm @role`. Rendered from ROLE_TAGS so this row and the
       broker's resolver can't drift apart. */
    if(s.gen==='roleTags'){
      c='@' + Object.keys(ROLE_TAGS)[0].toUpperCase() + ' …';
      desc=desc+' '+Object.keys(ROLE_TAGS).map(function(t){
        return '<b>' + t.toUpperCase() + '</b> ' + ROLE_TAGS[t];
      }).join(' · ');
    }
    /* A row shared by both modes can sit under a different HEADING in each: `yes #N`
       accepts a todo on a contract task and an ISSUE on a debug one, and it is the same
       command with the same notation and the same tool — one row, `debugGroup` naming
       where a debug reader expects to find it. Two rows would be two literals to keep in
       step, which is what this table exists to prevent. */
    var g=(mode==='debug' && s.debugGroup) ? s.debugGroup : s.group;
    if(g!==group){ group=g; rows+=grp(g); }
    rows+=cmd(c, desc);
  });
  return '<div style="display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--text-2);line-height:1.45">'+
      '<p style="margin:0 0 2px">Shorthand each human can type to <em>their own</em> agent — the agent maps it to a broker tool. A code a peer sends in a message is just data, never run.</p>'+
      rows+
    '</div>';
}

/* ---------- the real MCP tools ----------
   The long form of everything above: what the agent actually calls once it has read the
   shorthand. EVERY name here is registered in `src/sys_buddy/tools.py` — read it out of
   there before adding a row. The sole exception is the pair of `/files/...` HTTP routes,
   flagged where they sit. There is a design mockup floating around with issue-tracker
   tools on it (report_issue / resolve_issue / …); those names have no implementation and
   MUST NOT be listed, or this panel documents a feature that does not ship. What DOES
   ship is `propose_issue` plus the todo tools it shares — an issue is a todo with the
   contract half removed, so accept/decline/repropose/drop are the same tools, and the
   Issues group below lists them under the names a debug session uses. */
var MCP_TOOLS=[
  ['Messaging',[
    ['send_message','post to the task (or to one role via to_role)'],
    ['check_messages','read unread now, mark seen, don’t block'],
    ['wait_for_message','park until new mail arrives (long poll)'],
    ['ack_messages','acknowledge specific message ids'],
    ['channel_history','replay the last N messages'],
    ['share_activity','ambient “what I’m up to” note'],
    ['list_activity','read everyone’s activity notes'],
    ['notify_human','ping the humans on Slack — terminal events only']
  ]],
  ['Todo Contract',[
    ['propose_contract','propose the contract for todo N — it is always about one todo'],
    ['get_contract','read it — staging_url is withheld until every party has signed'],
    ['lock_contract','sign it; the last signature locks it, immutably'],
    ['decline_contract','push back on a proposal you have read — that version dies'],
    ['reopen_negotiations','reopen so a new version can be proposed and re-signed']
  ]],
  ['Todos',[
    ['get_todos','list the deliverables on the task'],
    ['propose_todo','propose one — proposing IS your own acceptance'],
    ['accept_todo','accept a proposed todo'],
    ['decline_todo','decline with a reason (recorded, not a status)'],
    ['repropose_todo','new version — resets everyone’s acceptance'],
    ['drop_todo','consent to dropping it (every party must)']
  ]],
  ['Issues',[
    ['get_todos','list the issues on this debug session'],
    ['propose_issue','raise one — raising IS your own acceptance'],
    ['accept_todo','agree an issue is real'],
    ['decline_todo','“that is not a bug”, with a reason'],
    ['repropose_todo','restate it — resets everyone’s acceptance and every `fixed`'],
    ['drop_todo','consent to dropping it (every party must)']
  ]],
  ['Status',[
    ['report_status','ready / checked / blocked / verified / stuck, on todo N']
  ]],
  /* Files — the two HTTP routes lead because they are how bytes actually MOVE: the agent
     shells out and the file never enters its context. They are the one exception to the
     tools.py rule above (an HTTP route is not an MCP tool) and they earn it —
     `upload_file`/`get_file` carry the file as a base64 tool ARGUMENT, so the agent has to
     generate or swallow the whole encoding, and an 8 MB file will not fit in a context at
     all. Same order, and the same reason, as the file-sharing section of
     RULES_OF_ENGAGEMENT in `rules.py`; keep the two agreeing. */
  ['Files',[
    ['POST /files/<task-id>','share a screenshot, design or artefact — raw bytes over curl, nothing through the agent’s context'],
    ['GET /files/<task-id>/<file-id>','fetch one back the same way; the task id in the path must be yours or it is refused'],
    ['list_files','what has been shared on the task'],
    ['upload_file','under ~100 KB just use this — one call, no shell; above that use the route'],
    ['get_file','same rule — small file, just call it; large one, use the route']
  ]],
  ['Meta',[
    ['readiness_check','see the pre-flight questions'],
    ['submit_readiness','answer them — passing unlocks the action tools'],
    ['rules','re-read the charter'],
    ['rotate_token','rotate this agent’s own credential']
  ]]
];
/* A debug task has no contract, and its numbered work is ISSUES rather than todos — so
   `Todo Contract` and `Todos` are dropped for one and `Issues` takes their place (and is
   dropped everywhere else). Same mode-awareness the shorthand rows already have, applied
   to the long form. */
function mcpToolsHTML(d){
  var debug = !!(d && d.mode==='debug');
  var out=MCP_TOOLS.filter(function(sec){
    /* `Status` stays: report_status is how an issue reaches `fixed`. */
    if(sec[0]==='Issues') return debug;
    return !(debug && (sec[0]==='Todo Contract' || sec[0]==='Todos'));
  }).map(function(sec){
    var rows=sec[1].map(function(t){
      if(debug && t[0]==='report_status') t=[t[0],'fixed on issue N (every party), or stuck'];
      return '<div style="display:flex;gap:9px;align-items:baseline;padding:2px 0">'+
        '<span style="flex:none;font-family:'+MONO+';font-size:10.5px;font-weight:600;color:var(--text);white-space:nowrap">'+esc(t[0])+'</span>'+
        '<span style="color:var(--text-3)">·</span>'+
        '<span style="min-width:0">'+esc(t[1])+'</span></div>';
    }).join('');
    return '<div style="color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:9px 0 2px">'+esc(sec[0])+'</div>'+rows;
  }).join('');
  return '<div style="font-size:12px;color:var(--text-2);line-height:1.45">'+
    '<p style="margin:0 0 2px">The broker tools the shorthand maps to. Your agent calls these; you never type them.</p>'+
    out+'</div>';
}

/* ---------- the two reference panels ----------
   Both are slide-outs off the header, and both are REFERENCE ONLY. There is no input,
   no button that calls anything, and nothing here executes — DECISIONS D11: "the
   dashboard surfaces state and tells the human what to type — it never acts". The
   Commands panel is a cheatsheet of what you say to YOUR OWN agent; it is not a console.

   They are state-driven (state.panel) and ride the normal render/bind/sig loop, so the
   SSE stream keeps flowing and repainting underneath. Focus is NOT trapped — Tab still
   walks the page — and Esc or the ✕ dismisses. */
var DOC_TODO_FLOW='https://github.com/tooney92/sys-buddy/blob/main/docs/todo-flow.md';
/* The desktop header's own height: 11px padding + its tallest child (a 34px button) +
   11px + the 1px bottom border. The panel starts here rather than at 0 so it docks UNDER
   the header instead of burying the very buttons that opened it. */
var HEADER_H=57;

function panelSection(title, body, note){
  return '<section style="margin:0 0 20px">'+
    '<h3 style="margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)">'+esc(title)+'</h3>'+
    (note?'<p style="margin:0 0 9px;font-size:12px;color:var(--text-2);line-height:1.55">'+note+'</p>':'')+
    body+'</section>';
}
/* a mono chip in the same spelling nextStepHTML and the cheatsheet use, so all three
   read as "this is the literal thing a human types" */
function shChip(c){
  return '<code style="font-family:'+MONO+';font-size:10.5px;font-weight:600;color:var(--text);background:var(--surface-2);border:1px solid var(--border-strong);border-radius:6px;padding:1px 6px;white-space:nowrap">'+esc(c)+'</code>';
}

/* ---------- Workflows panel ----------
   Three collapsible sections, everything shut on open, so the first screen is three
   lines rather than the wall of eight flat sections this replaced. The reference material
   (gates, traps, disagreements) nests one level down: you meet it when you've hit it.

   The prose says "contract", plainly, because that is what it is and it is a good word:
   two parties write down what they are agreeing to and sign it. There is exactly ONE kind
   — an agreement about one todo — so nothing here needs qualifying against a second, and
   the tool names in the steps table (`propose_contract`, `lock_contract`) name the same
   thing the sentences do. An earlier pass hid the word behind "the shape"; that made the
   panel and the tools read as two different concepts and taught neither.

   Tom 🐱 produces, Jerry 🐭 consumes, Spike 🐶 is on the task but not on this todo. Two
   parties who famously do not get along is the honest illustration: the broker does not
   ask them to trust each other, it just refuses to let either skip a step. Every emoji is
   aria-hidden — the name beside it already carries the meaning. */

/* The seven steps, in order, BY SHORTCODE ID — the literals and the tool names both come
   from SHORTCODES, so the table cannot drift from the cheatsheet the way the hand-typed
   stepper label list did. */
var WF_STEPS=['todo','yes','pc','sign','ready','ok','done'];

function wfStepsHTML(){
  return WF_STEPS.map(function(id,i){
    var e=SHORTCODE_BY_ID[id]||{};
    return '<div style="display:flex;gap:9px;align-items:baseline;padding:4px 0;border-top:1px solid var(--border)">'+
      '<span style="flex:none;width:12px;font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums">'+(i+1)+'</span>'+
      '<span style="flex:none;min-width:116px">'+shChip(SH(id))+'</span>'+
      '<span style="min-width:0;font-family:'+MONO+';font-size:10.5px;color:var(--text-2);word-break:break-word">'+esc((e.tools||[]).join(' + '))+'</span></div>';
  }).join('');
}
/* One line of the story. The icons alternate down the column, which shows the
   producer/consumer turn-taking faster than the sentences do. */
function wfSay(icon,who,what){
  return '<div style="display:flex;gap:8px;padding:3px 0;font-size:11.5px;color:var(--text-2);line-height:1.5">'+
    '<span aria-hidden="true" style="flex:none">'+icon+'</span>'+
    '<span style="min-width:0"><strong style="color:var(--text)">'+esc(who)+'</strong> '+what+'</span></div>';
}
function wfNote(icon,text,tone){
  var b=tone==='warn'?'var(--st-testing-dot)':'var(--border)', bg=tone==='warn'?'var(--st-testing-bg)':'var(--surface-2)';
  return '<div style="display:flex;gap:8px;margin:9px 0 0;padding:9px 11px;background:'+bg+';border:1px solid '+b+';border-radius:10px;font-size:11.5px;color:var(--text-2);line-height:1.55">'+
    '<span aria-hidden="true" style="flex:none">'+icon+'</span><span style="min-width:0">'+text+'</span></div>';
}
function wfP(text){ return '<div style="font-size:11.5px;color:var(--text-2);line-height:1.6">'+text+'</div>'; }
function wfSub(label){ return '<div style="margin:13px 0 3px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)">'+esc(label)+'</div>'; }

/* A disclosure row. `attr` keys the click handler; the caret and the label are one button
   so the whole row is the hit target. */
function wfRow(attr,key,open,title,sub,body){
  return '<div style="border-top:1px solid var(--border)">'+
    '<button '+attr+'="'+esc(key)+'" aria-expanded="'+(open?'true':'false')+'" '+
      'style="width:100%;display:flex;gap:9px;align-items:baseline;padding:10px 2px;background:none;border:0;cursor:pointer;text-align:left;color:var(--text);font:inherit">'+
      '<span aria-hidden="true" style="flex:none;color:var(--text-3);font-size:10px">'+(open?'▾':'▸')+'</span>'+
      '<span style="min-width:0;flex:1">'+
        '<span style="display:block;font-size:12.5px;font-weight:700">'+esc(title)+'</span>'+
        (sub?'<span style="display:block;margin-top:2px;font-size:11.5px;color:var(--text-2);font-weight:400">'+sub+'</span>':'')+
      '</span></button>'+
    (open?'<div style="padding:0 2px 16px 22px">'+body+'</div>':'')+
    '</div>';
}
/* An explicit toggle wins; an UNTOUCHED key falls back to the mode default, so a debug
   task opens on its own section without anyone having clicked. */
function wfIsOpen(key,mode){
  if(state.wf.sec[key]!==undefined) return !!state.wf.sec[key];
  return mode==='debug' ? key==='debug' : false;
}
function wfCastToggle(){
  function b(v,label){
    var on=state.wf.cast===v;
    return '<button data-wf-cast="'+v+'" style="padding:3px 10px;border-radius:999px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;'+
      'border:1px solid '+(on?'var(--accent)':'var(--border)')+';background:'+(on?'var(--surface-2)':'transparent')+';color:'+(on?'var(--text)':'var(--text-3)')+'">'+esc(label)+'</button>';
  }
  return '<div style="display:flex;gap:6px;align-items:center;margin:0 0 11px;flex-wrap:wrap">'+
    '<span style="font-size:11px;color:var(--text-3)">Show me with:</span>'+b('2','2 agents')+b('3','3+ agents')+'</div>';
}

/* Every rule below is a SUMMARY of docs/todo-flow.md, deliberately not a second copy of
   it — two statements of the same rules drift, and the doc is the one that gets updated
   alongside todos.py/state.py. Anything needing detail links out instead. */
function workflowsPanelBody(d){
  /* Every COMMAND below comes from SHORTCODES via SH() — this panel hand-typed its own
     copy of the vocabulary and drifted from the cheatsheet's. The literal chips that
     stay literal here are NOT commands: `status`/`state` are db columns,
     `submit_readiness` is a tool name, `#N` is the token itself. */
  /* Spelled-out numbers so the sentence below can COUNT the stepper rather than assert a
     total: it named one fewer label than the stepper drew from the day `testing` got its
     own node, and listed the labels by hand while it was at it. */
  var NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
  function words(n){ return NUM[n]||String(n); }
  var stepLabels=TODO_STEPS.map(function(s){ return s[1]; }).join(' → ');
  var mode=(d && d.mode==='debug') ? 'debug' : 'contract';
  var sub=state.wf.sub;

  /* ----- nested reference, all shut by default: you meet it when you've hit it ----- */
  var nMarkers=wfP('Two things move, and they answer different questions.')+
    wfSub('The chip — how much have we agreed?')+
    wfP('pending → accepted → <strong>signed</strong> → verified')+
    wfSub('The stepper — how far has it been built?')+
    wfP(esc(stepLabels))+
    wfNote('⚠','<strong>“building” means you have both signed the contract.</strong> Not that any code exists yet. '+
      'The '+words(TODO_STEPS.length)+' stepper labels fold '+words(Object.keys(TODO_MARCH).length)+' stored values, which is why two of them share a node.','warn');

  var nDisagree=
    wfP('<strong>'+shChip(SH('no'))+'</strong> hands the todo back, with your reason on it.')+
    wfP('<strong>'+shChip(SH('decline'))+'</strong> rejects that version of the contract — it dies, and someone proposes a new one.')+
    wfP('<strong>'+shChip(SH('reopen'))+'</strong> re-opens one that was already signed.')+
    wfNote('🐱','Someone has to go first. Whoever proposes the contract becomes the <strong>producer</strong> — that is a rule, not a favour. Tom did not earn it.');

  var nBreaks=
    wfP(shChip(SH('block'))+' is a <strong>strike</strong>. Three strikes and the broker pulls the cord on <em>that one deliverable</em> — not the task.')+
    wfP(shChip(SH('stuck','scoped'))+' flags one deliverable. A bare '+shChip(SH('stuck','bare'))+
      ' escalates the whole thing to the humans, and it is the only command that works without an ID.')+
    wfNote('🐭','Finding the hole is Jerry’s whole job. Three holes and the broker ends the chase.');

  var nStall=
    wfP('<strong>1 · '+shChip(SH('sign'))+' with nothing proposed does nothing.</strong> A signature needs something to attach to. '+
      'If nothing moved, nobody has run '+shChip(SH('pc'))+' yet. '+shChip(SH('ship'))+' does both in one move.')+
    '<div style="height:9px"></div>'+
    wfP('<strong>2 · Nothing auto-advances.</strong> No timer, no daemon. A todo parked at <em>building</em> is not a hung process — '+
      'someone just has not typed '+shChip(SH('ready'))+'. The <strong>Next</strong> line on the card names who owes the move.');

  var nGates=wfP('You must be a <strong>named party</strong> on the todo · '+
    shChip(SH('pc'))+' needs it <em>accepted</em> · '+
    shChip(SH('ready'))+' needs you to be the <strong>producer</strong>, with the contract signed · '+
    shChip(SH('ok'))+' / '+shChip(SH('block'))+' needs you <strong>not</strong> to be the producer, after a ready · '+
    shChip(SH('done'))+' needs it in <em>testing</em>.')+
    wfP('<span style="color:var(--text-3)">Every refusal comes back as an error your agent can read.</span>');

  /* ----- the spine ----- */
  var cast3=state.wf.cast==='3';
  var story=
    wfSay('🐱','Tom','proposes “sign-in endpoint.”')+
    wfSay('🐭','Jerry','says yes. <span style="color:var(--text-3)">Now they agree on WHAT.</span>')+
    wfSay('🐱','Tom','writes down the contract — the exact shape it will take.')+
    wfSay('🐭','Jerry','reads it and agrees. Both sign — which locks it and releases the staging link. <span style="color:var(--text-3)">Now they agree on HOW.</span>')+
    wfSay('🐱','Tom','builds it and says it is live.')+
    wfSay('🐭','Jerry','tries it and says it works. <span style="color:var(--text-3)">Either one says done.</span>')+
    (cast3
      ? wfSay('🐶','Spike','is on this task, but not on this todo. So nobody waits for him and he cannot sign it. His own todo is '+shChip('#2')+', on its own clock.')+
        wfNote('🐶','Spike does not chase anybody. He just has his own thing to build.')
      : wfNote('🐱🐭','These two have never once gotten along. sys-buddy does not ask them to. It just makes sure neither can skip a step.'));

  /* The TWO AGREEMENTS lead the section, and that placement is the point. This panel
     already said it — "agrees twice, once to what, once to how" — but as an info note
     BELOW the story and the steps table, and a real reader still came away thinking that
     accepting a todo meant he had agreed how to build it. By the time the correction
     arrived he had already built the wrong model, so it read as a detail rather than as
     the frame. Same sentence shape for both gates, so they read as two of the same kind
     of thing; and both name the refusal ("accept or deny", "or not") because a reader who
     knows they can REFUSE understands it is a real gate — which is exactly what the
     misreading missed. */
  var todosBody=
    wfP('A todo is <strong>what</strong> you want to build with your team. They can accept or deny what is being built.')+
    wfP('A <strong>todo contract</strong> is what follows next: <strong>how</strong> you want to build it. A contract is proposed, and the parties may accept it or not.')+
    wfP('<span style="color:var(--text-3)">So each todo is agreed twice — once on what, once on how.</span>')+
    '<div style="height:11px"></div>'+
    wfCastToggle()+
    wfSub('The story')+story+
    wfSub('The steps')+wfStepsHTML()+
    wfNote('ⓘ','<strong>'+shChip('#1')+' is the todo’s ID.</strong> Every task numbers its own todos from 1, so the first thing you agree on any task is always '+shChip('#1')+
      '. With several in flight the ID is the only thing telling your agent which one you mean — that is why all seven need it.')+
    wfNote('ⓘ','<strong>You do not have to type the shorthand.</strong> “accept todo 1” works just as well — we train your agent on these seven tools, so it knows which one you mean. The shorthand just saves keystrokes.')+
    /* Was a second statement of "agrees twice", which the section now opens with. Kept for
       the part the intro does NOT carry: WHO the two agreements belong to. */
    wfNote('ⓘ','Both agreements are made by <strong>everyone the todo names</strong> — nobody else is asked, and nobody else can block it.')+
    '<div style="height:9px"></div>'+
    wfRow('data-wf-sub','markers',!!sub.markers,'Reading the two progress markers','',nMarkers)+
    wfRow('data-wf-sub','disagree',!!sub.disagree,'When someone disagrees','',nDisagree)+
    wfRow('data-wf-sub','breaks',!!sub.breaks,'When something breaks','',nBreaks)+
    wfRow('data-wf-sub','stall',!!sub.stall,'When nothing is moving','',nStall)+
    wfRow('data-wf-sub','gates',!!sub.gates,'What the broker refuses','',nGates);

  var preBody=
    wfP('Your agent answers a few readiness questions before it can send anything or change any status. It submits them with '+shChip('submit_readiness')+'.')+
    wfP('Until it passes: an amber 🔒 on its avatar and its action tools stay locked. After: a green ✓, plus a pulsing dot while it is parked waiting for mail.')+
    wfP('Coach a failure and it re-runs with '+shChip(SH('pf'))+'. Pre-flight is <strong>per seat</strong> — each agent does its own, and it is the second node on the task stepper.')+
    wfNote('🐱','Think of it as the medical. Nobody gets in the house until they have passed — not even the cat.');

  var debugBody=
    wfP('Nothing to sign and no stepper — a debug session has no contract, because there is no <em>how</em> to agree on a bug.')+
    wfP('It carries <strong>issues</strong>. An issue is to a debug session what a todo is to a contract task, minus the contract: '+
      'anyone raises one with '+shChip(SH('issue'))+' — and raising it <strong>is</strong> their own acceptance — every other party agrees it is real with '+
      shChip(SH('yes'))+' (or '+shChip(SH('no'))+' for “that is not a bug”), and then the work happens.')+
    wfP('<strong>'+shChip(SH('fixed'))+' takes every party.</strong> Each one reports it independently, so while anyone has not, the issue is still open — '+
      'that is a normal state, not a fault. The last one resolves it, and the session resolves by itself once every live issue has.')+
    wfNote('ⓘ','A session with <strong>no issues at all</strong> is the older, simpler shape and '+shChip(SH('resolved'))+
      ' still closes it. Once it has issues that bare form is refused — “resolved” says nothing until you name which one. '+
      shChip(SH('stuck','bare'))+' gives up and pings the humans either way.')+
    wfNote('ⓘ','Because the session state is <strong>counted, not declared</strong>, raising a new issue on a resolved session reopens it. Nobody has to unlock anything.');

  var link='<a href="'+DOC_TODO_FLOW+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:7px;padding:8px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:11.5px;font-weight:600">'+
    '<span style="display:flex;color:var(--text-3)">'+IC.doc+'</span>Full reference — <span style="font-family:'+MONO+';font-weight:500">docs/todo-flow.md</span>'+
    '<span style="display:flex;color:var(--accent)">'+IC.link+'</span></a>';

  return '<p style="margin:0 0 6px;font-size:12px;color:var(--text-2);line-height:1.55">How this task works, end to end. Pick the part you need.</p>'+
    '<div style="margin:0 0 18px">'+
      wfRow('data-wf-sec','todos',wfIsOpen('todos',mode),'How todos work','Agreeing what to build, then building it',todosBody)+
      wfRow('data-wf-sec','pre',wfIsOpen('pre',mode),'Pre-flight','Why your agent’s tools are locked',preBody)+
      wfRow('data-wf-sec','debug',wfIsOpen('debug',mode),'Debug sessions','Issues, and the fix both sides have to agree on',debugBody)+
      '<div style="border-top:1px solid var(--border)"></div>'+
    '</div>'+
    link;
}

function commandsPanelBody(d){
  var mode = (d && d.mode==='debug') ? 'debug' : (d ? 'contract' : null);
  var modeNote = mode
    ? '<div style="margin:0 0 12px;display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-2)">'+

}

  var sub = cmd

          '<span style="font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--text);flex:1;min-width:0">'+esc(title)+'</span>'+
          '<button data-panel-close="1" title="Close (Esc)" style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;cursor:pointer;color:var(--text-2);font-size:15px;line-height:1;flex:none">✕</button>'+
        '</div>'+
        '<p style="margin:7px 0 0;font-size:11.5px;color:var(--text-2);line-height:1.55">'+sub+'</p>'+
      '</div>'+
      '<div style="flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:16px 18px 42px">'+body+'</div>'+

}

/* ---------- readiness pre-flight (compact, collapsed-by-default) ---------- */
/* Mirrors the Tips card palette. Lists the generic questions every agent must
   answer via submit_readiness before its action tools unlock. Omitted entirely
   when the API hands back no preview. */
function readinessPreviewHTML(d){
  var qs=(d&&d.readiness_preview)||[];
  if(!qs.length) return '';
  var items=qs.map(function(q){ return '<li style="margin:0 0 4px">'+esc(q)+'</li>'; }).join('');
  return '<details style="margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden">'+
    '<summary style="list-style:none;cursor:pointer;padding:11px 16px;font-size:12.5px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:8px;user-select:none">'+
      '<span style="color:var(--text-3);display:flex">'+dividerIcon('lock')+'</span>Readiness pre-flight</summary>'+

      '<p style="margin:0 0 8px">Each agent must answer these before it can act.</p>'+
      '<ol style="margin:0;padding-left:20px">'+items+'</ol></div></details>';

/* ---------- shared files & screenshots (read-only, D11) ----------
   The API adds a `files` array to GET /api/task/{id} (screenshots + designs + other
   attachments the agents uploaded via a tool / the desktop app). This dashboard NEVER
   writes — there is no upload control here, only surfacing. EVERY branch below is
   guarded on `d.files`/length, so a task with no files (or an older API that omits the
   key entirely) renders EXACTLY as it did before — the same precedent as todos above.

   Each file's bytes are served (GET only) at a same-origin relative URL `/api/file/{id}`;
   the `sb_view` HttpOnly cookie rides along automatically on the <img>/<a> request, so
   there is no token in the URL to leak (JS can't read the cookie anyway — same auth model
   as every other /api/* call). The server sets Content-Disposition inline for images and
   attachment for everything else, so a plain <a> downloads non-images on its own. */
function fileURL(id){ return '/api/file/'+encodeURIComponent(id); }
/* screenshots = anything the browser can render inline: an image content-type, or the
   broker's explicit `screenshot` kind (covers a screenshot whose type didn't survive). */
function isImageFile(f){ return (f.content_type && String(f.content_type).indexOf('image/')===0) || f.kind==='screenshot'; }
function humanSize(n){
  n=+n; if(!isFinite(n)||n<0) return '';
  if(n<1024) return n+' B';
  var u=['KB','MB','GB','TB'], i=-1;
  do{ n/=1024; i++; }while(n>=1024 && i<u.length-1);
  return (n>=10?Math.round(n):Math.round(n*10)/10)+' '+u[i];
}
function fileKindChip(kind){
  return '<span style="font-family:'+MONO+';font-size:9.5px;font-weight:600;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;flex:none">'+esc(kind||'other')+'</span>';
}
/* uploader avatar + label, shared by both sections */
function fileUploader(f){
  var a=av(f.role);
  return '<span title="'+esc(a.label)+'" style="display:inline-flex;align-items:center;gap:5px;min-width:0">'+
    '<span style="width:15px;height:15px;border-radius:4px;background:'+a.c+';color:#fff;font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none">'+esc(a.i)+'</span>'+
    '<span style="font-size:10.5px;color:var(--text-2);font-weight:500">'+esc(a.label)+'</span></span>';
}
var IC_DOWNLOAD='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 11l5 5 5-5M5 21h14"/></svg>';

/* Screenshots — inline thumbnails, click to enlarge (lightboxHTML below). */
function screenshotsCardHTML(imgs){
  if(!imgs.length) return '';
  var thumbs=imgs.map(function(f){
    return '<button data-lightbox="'+esc(f.id)+'" title="'+esc(f.name||'')+' — click to enlarge" style="display:flex;flex-direction:column;gap:6px;padding:0;border:none;background:transparent;cursor:pointer;font-family:inherit;width:104px;flex:none">'+
      '<span style="width:104px;height:78px;border-radius:9px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center">'+
        '<img src="'+esc(fileURL(f.id))+'" alt="'+esc(f.name||'')+'" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block"></span>'+
      '<span style="font-size:10.5px;font-weight:500;color:var(--text);max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left">'+esc(f.name||'')+'</span>'+
      '<span style="display:flex;align-items:center;gap:6px">'+fileUploader(f)+'<span style="font-size:10px;color:var(--text-3);font-family:'+MONO+'">'+esc(f.time||'')+'</span></span>'+
    '</button>';
  }).join('');
  return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-top:16px">'+
    '<div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px">'+

    '<div style="padding:16px;display:flex;flex-wrap:wrap;gap:14px">'+thumbs+'</div></div>';
}

/* Files — everything else, each a download link. */
function filesCardHTML(others){
  if(!others.length) return '';

    var size=humanSize(f.size);

/* Both sections, split by type. '' when the task has no files → identical to before. */
function attachmentsHTML(d){

/* ---------- task view ---------- */
function taskHTML(){
  if(!state.detail){

      '<button data-home="1" style="display:inline-flex;align-items:center;gap:6px;padding:6px 11px;background:var(--surface);border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:13px;color:var(--text-2)">'+IC.back+'Tasks</button>'+
      '<div style="text-align:center;padding:80px 20px;color:var(--text-2);font-size:14px">Loading task…</div></div>';
  }

  var m=state.isMobile;
  var chip=stateChip(d.state);
  /* The stepper TRUNCATES when this task has todos — same component, three nodes. A task
     with no todos (and a task whose todos were all dropped, where has_todos is false)
     keeps today's full seven-node stepper, unchanged. */
  var todos=hasTodos(d);
  var steps=todos ? genStepsTodo(d) : genSteps(d.state, d.times, d.agents, isEngagement(d));

    // `todos` node shows the fan-out's progress bar and counts.
    var tail = s.key==='preflight' ? preflightPills(d)

      '<div style="position:absolute;top:18px;right:0;width:50%;height:2px;background:'+s.rightColor+'"></div>'+
      '<div style="'+s.nodeStyle+'">'+s.inner+'</div>'+
      '<span style="margin-top:7px;font-size:11px;font-weight:600;text-align:center;color:'+s.labelColor+';line-height:1.3;padding:0 4px">'+esc(s.label)+'</span>'+
      tail+'</div>';
  }).join('');
  var stuckBanner = stuck ? '<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;padding:9px 13px;background:var(--st-stuck-bg);border:1px solid var(--st-stuck-dot);border-radius:11px;font-size:13px;color:var(--st-stuck-fg);font-weight:500"><span style="display:flex">'+IC.warn+'</span>3 fix cycles reached — humans notified 📣</div>' : '';

  var stepper='<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:15px 20px;margin-bottom:16px;overflow-x:auto">'+stuckBanner+'<div style="display:flex;align-items:flex-start;min-width:560px">'+stepsHTML+'</div></div>';

  var mobileTabs = m ? '<div style="display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px">'+
    '<button data-tab="thread" style="'+tabStyle(state.mobileTab==='thread')+'">Thread</button>'+
    '<button data-tab="contract" style="'+tabStyle(state.mobileTab==='contract')+'">'+(todos?'Todos':'Contract')+'</button>'+
    '<button data-tab="log" style="'+tabStyle(state.mobileTab==='log')+'">Log</button></div>' : '';

  var threadDisp = m ? (state.mobileTab==='thread'?'block':'none') : 'block';
  var contractDisp = m ? (state.mobileTab==='contract'?'block':'none') : 'block';
  var logDisp = m ? (state.mobileTab==='log'?'block':'none') : (state.eventLogOpen?'block':'none');
  var rowStyle = m ? 'display:block' : 'display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:16px;align-items:start';

  var eventBtn = m ? '' : '<button data-eventlog="1" style="display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:9px;border:1px solid '+(state.eventLogOpen?'var(--accent)':'var(--border)')+';background:'+(state.eventLogOpen?'var(--accent-soft)':'var(--surface)')+';color:'+(state.eventLogOpen?'var(--accent-2)':'var(--text-2)')+';cursor:pointer;font-size:13px;font-weight:500">'+IC.log+'Event log</button>';

  return '<div style="max-width:1200px;margin:0 auto;padding:20px 20px 80px">'+
